<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 | NUCKS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pretendard:wght@400;500&display=swap');

  :root{
    --ink:#141414;
    --paper:#f7f6f3;
    --line:#d8d5cd;
    --muted:#8a8578;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--paper);
    font-family:'Pretendard', -apple-system, sans-serif;
    color:var(--ink);
    padding:24px;
  }
  .panel{ width:100%; max-width:380px; }
  .eyebrow{
    font-size:11px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--muted); margin-bottom:18px;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500; font-size:40px; line-height:1.15;
    margin:0 0 10px; letter-spacing:.01em;
  }
  .sub{
    font-size:13px; color:var(--muted); margin-bottom:34px; line-height:1.6;
  }
  form{ display:flex; flex-direction:column; gap:20px; }
  label{
    font-size:12px; letter-spacing:.06em; color:var(--muted);
    display:block; margin-bottom:8px;
  }
  input{
    width:100%; border:none; border-bottom:1px solid var(--line);
    background:transparent; padding:8px 2px 10px; font-size:15px;
    color:var(--ink); font-family:inherit; outline:none;
    transition:border-color .2s ease;
  }
  input:focus{border-bottom-color:var(--ink);}
  .submit{
    margin-top:14px; padding:14px 0; background:var(--ink); color:var(--paper);
    border:none; font-size:13px; letter-spacing:.12em; text-transform:uppercase;
    cursor:pointer; transition:opacity .2s ease;
  }
  .submit:hover{opacity:.85;}
  .submit:disabled{opacity:.5; cursor:default;}
  .msg{ min-height:18px; font-size:13px; color:#a4453c; }
  .foot{
    margin-top:32px; padding-top:24px; border-top:1px solid var(--line);
    font-size:13px; color:var(--muted);
    display:flex; justify-content:space-between; align-items:center;
  }
  .foot a{ color:var(--ink); text-decoration:none; border-bottom:1px solid var(--ink); }
</style>
</head>
<body>

<div class="panel">
  <div class="eyebrow">NUCKS</div>
  <h1>회원가입</h1>
  <div class="sub">가입 후에는 게스트 권한으로 시작되며,<br>근무일지·대시보드 접근은 관리자 승인 후 활성화됩니다.</div>

  <form id="signupForm">
    <div>
      <label for="name">이름</label>
      <input type="text" id="name" required autocomplete="name">
    </div>
    <div>
      <label for="email">이메일</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div>
      <label for="password">비밀번호</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password">
    </div>
    <div class="msg" id="msg"></div>
    <button type="submit" class="submit" id="submitBtn">가입하기</button>
  </form>

  <div class="foot">
    <span>이미 계정이 있으신가요?</span>
    <a href="login.html">로그인</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
  const form = document.getElementById('signupForm');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    btn.disabled = true;
    btn.textContent = '처리 중...';

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      await signUp(email, password, name);
      window.location.href = 'index.html';
    } catch (err) {
      btn.disabled = false;
      btn.textContent = '가입하기';
      if (err.code === 'auth/email-already-in-use') {
        msg.textContent = '이미 가입된 이메일입니다.';
      } else if (err.code === 'auth/weak-password') {
        msg.textContent = '비밀번호는 6자 이상이어야 합니다.';
      } else {
        msg.textContent = '가입 중 오류가 발생했습니다. 다시 시도해 주세요.';
      }
    }
  });
</script>
</body>
</html>
