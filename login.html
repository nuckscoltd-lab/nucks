<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | NUCKS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pretendard:wght@400;500&display=swap');

  :root{
    --ink:#141414;
    --paper:#f7f6f3;
    --line:#d8d5cd;
    --muted:#8a8578;
    --accent:#141414;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--paper);
    font-family:'Pretendard', -apple-system, sans-serif;
    color:var(--ink);
    padding:24px;
  }
  .panel{
    width:100%;
    max-width:380px;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:18px;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size:40px;
    line-height:1.15;
    margin:0 0 36px;
    letter-spacing:.01em;
  }
  form{
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  label{
    font-size:12px;
    letter-spacing:.06em;
    color:var(--muted);
    display:block;
    margin-bottom:8px;
  }
  input{
    width:100%;
    border:none;
    border-bottom:1px solid var(--line);
    background:transparent;
    padding:8px 2px 10px;
    font-size:15px;
    color:var(--ink);
    font-family:inherit;
    outline:none;
    transition:border-color .2s ease;
  }
  input:focus{border-bottom-color:var(--ink);}
  .submit{
    margin-top:14px;
    padding:14px 0;
    background:var(--ink);
    color:var(--paper);
    border:none;
    font-size:13px;
    letter-spacing:.12em;
    text-transform:uppercase;
    cursor:pointer;
    transition:opacity .2s ease;
  }
  .submit:hover{opacity:.85;}
  .submit:disabled{opacity:.5; cursor:default;}
  .msg{
    min-height:18px;
    font-size:13px;
    color:#a4453c;
  }
  .foot{
    margin-top:32px;
    padding-top:24px;
    border-top:1px solid var(--line);
    font-size:13px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .foot a{
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid var(--ink);
  }
</style>
</head>
<body>

<div class="panel">
  <div class="eyebrow">NUCKS</div>
  <h1>로그인</h1>

  <form id="loginForm">
    <div>
      <label for="email">이메일</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div>
      <label for="password">비밀번호</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <div class="msg" id="msg"></div>
    <button type="submit" class="submit" id="submitBtn">로그인</button>
  </form>

  <div class="foot">
    <span>계정이 없으신가요?</span>
    <a href="signup.html">회원가입</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    btn.disabled = true;
    btn.textContent = '확인 중...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const user = await logIn(email, password);
      const role = await getCurrentUserRole();

      // 역할에 따라 이동할 페이지를 분기
      if (role === 'admin') {
        window.location.href = 'admin.html';
      } else if (role === 'worker') {
        window.location.href = 'worklog.html';
      } else {
        window.location.href = 'index.html';
      }
    } catch (err) {
      btn.disabled = false;
      btn.textContent = '로그인';
      msg.textContent = '이메일 또는 비밀번호가 올바르지 않습니다.';
    }
  });
</script>
</body>
</html>
