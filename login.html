<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141414">
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
<title>로그인 | NUCKS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pretendard:wght@400;500&display=swap');

  :root{
    --ink:#141414;
    --paper:#f7f6f3;
    --line:#d8d5cd;
    --muted:#8a8578;
    --accent:#141414;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--paper);
    font-family:'Pretendard', -apple-system, sans-serif;
    color:var(--ink);
    padding:24px;
  }
  .panel{
    width:100%;
    max-width:380px;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:18px;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size:40px;
    line-height:1.15;
    margin:0 0 36px;
    letter-spacing:.01em;
  }
  form{
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  label{
    font-size:12px;
    letter-spacing:.06em;
    color:var(--muted);
    display:block;
    margin-bottom:8px;
  }
  input{
    width:100%;
    border:none;
    border-bottom:1px solid var(--line);
    background:transparent;
    padding:8px 2px 10px;
    font-size:15px;
    color:var(--ink);
    font-family:inherit;
    outline:none;
    transition:border-color .2s ease;
  }
  input:focus{border-bottom-color:var(--ink);}
  .submit{
    margin-top:14px;
    padding:14px 0;
    background:var(--ink);
    color:var(--paper);
    border:none;
    font-size:13px;
    letter-spacing:.12em;
    text-transform:uppercase;
    cursor:pointer;
    transition:opacity .2s ease;
  }
  .submit:hover{opacity:.85;}
  .submit:disabled{opacity:.5; cursor:default;}
  .msg{
    min-height:18px;
    font-size:13px;
    color:#a4453c;
  }
  .foot{
    margin-top:32px;
    padding-top:24px;
    border-top:1px solid var(--line);
    font-size:13px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .foot a{
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid var(--ink);
  }
  .forgot-link{
    display:block;
    margin-top:14px;
    font-size:12.5px;
    color:var(--muted);
    text-decoration:none;
    border-bottom:1px solid transparent;
    cursor:pointer;
    width:fit-content;
  }
  .forgot-link:hover{ border-bottom-color:var(--muted); }
  .reset-panel{
    display:none;
    margin-top:24px;
    padding-top:24px;
    border-top:1px solid var(--line);
  }
  .reset-panel.open{ display:block; }
  .reset-panel .desc{
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:16px;
    line-height:1.6;
  }
  .reset-row{
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  .reset-row input{ flex:1; }
  .reset-btn{
    padding:10px 16px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    cursor:pointer;
    white-space:nowrap;
  }
  .reset-btn:disabled{ opacity:.5; cursor:default; }
  .reset-msg{
    min-height:16px;
    font-size:12.5px;
    margin-top:10px;
  }
</style>
</head>
<body>

<div class="panel">
  <div class="eyebrow">NUCKS</div>
  <h1>로그인</h1>

  <form id="loginForm">
    <div>
      <label for="email">이메일</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div>
      <label for="password">비밀번호</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <div class="msg" id="msg"></div>
    <button type="submit" class="submit" id="submitBtn">로그인</button>
  </form>

  <a class="forgot-link" id="forgotLink">비밀번호를 잊으셨나요?</a>

  <div class="reset-panel" id="resetPanel">
    <div class="desc">가입하신 이메일을 입력하시면, 비밀번호 재설정 링크를 보내드려요.</div>
    <div class="reset-row">
      <input type="email" id="resetEmail" placeholder="이메일 입력">
      <button class="reset-btn" id="resetBtn">전송</button>
    </div>
    <div class="reset-msg" id="resetMsg"></div>
  </div>

  <div class="foot">
    <span>계정이 없으신가요?</span>
    <a href="signup.html">회원가입</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    btn.disabled = true;
    btn.textContent = '확인 중...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const user = await logIn(email, password);
      const role = await getCurrentUserRole();

      // 역할에 따라 이동할 페이지를 분기
      if (role === 'admin') {
        window.location.href = 'admin.html';
      } else if (role === 'worker') {
        window.location.href = 'worklog.html';
      } else {
        window.location.href = 'index.html';
      }
    } catch (err) {
      btn.disabled = false;
      btn.textContent = '로그인';
      msg.textContent = '이메일 또는 비밀번호가 올바르지 않습니다.';
    }
  });

  // 비밀번호 찾기 토글
  const forgotLink = document.getElementById('forgotLink');
  const resetPanel = document.getElementById('resetPanel');
  const resetBtn = document.getElementById('resetBtn');
  const resetEmailInput = document.getElementById('resetEmail');
  const resetMsg = document.getElementById('resetMsg');

  forgotLink.addEventListener('click', () => {
    resetPanel.classList.toggle('open');
    if (resetPanel.classList.contains('open')) {
      resetEmailInput.value = document.getElementById('email').value.trim();
      resetEmailInput.focus();
    }
  });

  resetBtn.addEventListener('click', async () => {
    const email = resetEmailInput.value.trim();
    resetMsg.textContent = '';

    if (!email) {
      resetMsg.style.color = '#a4453c';
      resetMsg.textContent = '이메일을 입력해 주세요.';
      return;
    }

    resetBtn.disabled = true;
    resetBtn.textContent = '전송 중...';

    try {
      await sendResetEmail(email);
      resetMsg.style.color = '#3f6b52';
      resetMsg.textContent = '재설정 메일을 보냈어요. 받은편지함(스팸함도)을 확인해 주세요.';
    } catch (err) {
      resetMsg.style.color = '#a4453c';
      // 보안상 "가입되지 않은 이메일" 여부는 굳이 구분해 알려주지 않음
      resetMsg.textContent = '전송에 실패했어요. 이메일 주소를 다시 확인해 주세요.';
    } finally {
      resetBtn.disabled = false;
      resetBtn.textContent = '전송';
    }
  });
</script>
</body>
</html>
