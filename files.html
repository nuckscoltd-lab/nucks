<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">

if ('serviceWorker' in navigator) {

<title>업무 파일 | NUCKS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pretendard:wght@400;500&display=swap');

  :root{
    --ink:#141414;
    --paper:#f7f6f3;
    --line:#d8d5cd;
    --muted:#8a8578;
  }
  *{box-sizing:border-box;}
  html{ scroll-behavior:smooth; }
  [id^="uploadPanel"], [id^="section-"], [id^="cashbookLinkBar"], [id^="certWritePanel"]{ scroll-margin-top:20px; }
  body{
    margin:0; min-height:100vh; background:var(--paper);
    font-family:'Pretendard', -apple-system, sans-serif; color:var(--ink);
  }
  header{
    padding:28px 48px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .eyebrow{
    font-size:11px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--muted); margin-bottom:6px;
  }
  h1{
    font-family:'Cormorant Garamond', serif; font-weight:500;
    font-size:32px; margin:0; letter-spacing:.01em;
  }
  .header-right{ display:flex; align-items:center; gap:24px; }
  .header-right a{
    font-size:13px; color:var(--muted); text-decoration:none;
    border-bottom:1px solid var(--muted); cursor:pointer;
  }
  main{ max-width:960px; margin:0 auto; padding:48px; }

  /* 업로드 패널 (관리자 전용) */
  .upload-panel{
    display:none;
    background:#fff; border:1px solid var(--line); border-radius:6px;
    padding:24px; margin-bottom:48px;
  }
  .upload-panel.show{ display:block; }
  .esg-link-bar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:#fff; border:1px solid var(--line); border-radius:6px;
    padding:14px 18px; margin-bottom:28px;
  }
  .esg-link-label{ font-size:12.5px; color:var(--muted); margin-right:4px; }
  .esg-link-btn{
    padding:8px 16px; background:var(--ink); color:var(--paper);
    border-radius:4px; font-size:12.5px; text-decoration:none;
  }
  .esg-link-btn:hover{ opacity:.85; }
  .esg-link-btn.disabled{ opacity:.4; pointer-events:none; cursor:default; }

  .link-dropdown{ position:relative; display:inline-block; }
  .link-dropdown-btn{
    padding:8px 16px; background:var(--ink); color:var(--paper); border:none;
    border-radius:4px; font-size:12.5px; font-family:inherit; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
  }
  .link-dropdown-btn:hover{ opacity:.85; }
  .link-dropdown-btn .caret{ font-size:9px; transition:transform .15s; }
  .link-dropdown.open .link-dropdown-btn .caret{ transform:rotate(180deg); }
  .link-dropdown-menu{
    display:none; position:absolute; top:calc(100% + 6px); left:0; z-index:20;
    background:#fff; border:1px solid var(--line); border-radius:6px;
    box-shadow:0 6px 20px rgba(20,20,20,.08); padding:6px; min-width:190px;
  }
  .link-dropdown.open .link-dropdown-menu{ display:block; }
  .link-dropdown-menu a{
    display:block; padding:9px 12px; font-size:13px; color:var(--ink);
    text-decoration:none; border-radius:4px; white-space:nowrap;
  }
  .link-dropdown-menu a:hover{ background:var(--paper); }

  .upload-panel .panel-title{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); margin-bottom:18px;
  }
  .upload-row{
    display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;
  }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:11.5px; color:var(--muted); }
  .field input[type=text], .field input[list]{
    padding:9px 10px; border:1px solid var(--line); border-radius:4px;
    font-family:inherit; font-size:13.5px; min-width:180px; background:#fff;
  }
  .field input[type=file]{ font-size:13px; }
  .upload-btn{
    padding:10px 20px; background:var(--ink); color:var(--paper);
    border:none; font-size:12.5px; letter-spacing:.05em; text-transform:uppercase;
    cursor:pointer; border-radius:4px; white-space:nowrap;
  }
  .upload-btn:disabled{ opacity:.4; cursor:default; }
  .upload-status{ margin-top:12px; font-size:13px; min-height:18px; }

  /* 카테고리 탭 */
  .tabs{
    display:flex; gap:8px; flex-wrap:wrap; margin-bottom:28px;
  }
  .tab{
    padding:7px 16px; border-radius:20px; border:1px solid var(--line);
    background:#fff; font-size:13px; color:var(--muted); cursor:pointer;
  }
  .tab.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  table{ width:100%; border-collapse:collapse; }
  th{
    text-align:left; font-size:12px; color:var(--muted); font-weight:500;
    padding:10px 12px; border-bottom:1px solid var(--line);
  }
  td{
    padding:14px 12px; font-size:14px; border-bottom:1px solid var(--line);
    vertical-align:middle;
  }
  .cat-badge{
    display:inline-block; font-size:11px; padding:3px 10px; border-radius:20px;
    background:#ece9e2; color:#7a766c;
  }
  .dl-link{ color:var(--ink); text-decoration:none; border-bottom:1px solid var(--ink); font-size:13px; }
  .del-btn{
    margin-left:12px; font-size:12px; color:#a4453c; background:none; border:none;
    cursor:pointer; text-decoration:underline;
  }
  .edit-btn{
    margin-left:12px; font-size:12px; color:var(--muted); background:none; border:none;
    cursor:pointer; text-decoration:underline;
  }
  .edit-btn.save{ color:#3f6b52; }
  .edit-name-input, .edit-category-input{
    width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:4px;
    font-family:inherit; font-size:13.5px;
  }
  .empty{ font-size:13px; color:var(--muted); padding:24px 0; }

  /* 회계현황 탭에서만 보이는 대시보드 미리보기 */
  .preview-area{ display:none; margin-bottom:32px; }
  .preview-area.show{ display:block; }
  .preview-frame-wrap{
    border:1px solid var(--line); border-radius:6px; overflow:hidden; background:#fff;
  }
  .preview-frame-wrap iframe{ width:100%; height:70vh; border:none; display:block; }
  .preview-meta{ font-size:12.5px; color:var(--muted); margin-bottom:10px; }
  .preview-empty{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    padding:36px; text-align:center; color:var(--muted); font-size:13.5px; line-height:1.7;
  }

  /* 증명서 발급 섹션 */
  .section-title{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); margin:56px 0 16px;
  }
  .section-title:first-of-type{ margin-top:56px; }
  #certFieldsArea .upload-row{ margin-top:6px; }
  .edit-banner{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    background:#fbe9d8; border:1px solid #e8c9a3; border-radius:6px;
    padding:10px 14px; margin-bottom:16px; font-size:12.5px; color:#7a5a2e;
  }
  .edit-banner button{
    background:none; border:1px solid #c79a5e; color:#7a5a2e; border-radius:4px;
    padding:5px 12px; font-size:12px; cursor:pointer; white-space:nowrap;
  }
  .edit-banner button:hover{ background:#f3dcbb; }
  #certWritePanel .field{ width:210px; }
  #certWritePanel .field input,
  #certWritePanel .field select{
    width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid var(--line);
    border-radius:4px; font-family:inherit; font-size:13.5px; background:#fff;
  }

  /* 인쇄 전용 영역 - 화면에서는 숨겨두고 인쇄할 때만 노출 */
  #certPrintArea{ display:none; }
  @media print {
    /* 인쇄 영역을 제외한 나머지는 레이아웃에서 완전히 제거 (visibility만 끄면
       숨겨진 콘텐츠의 높이가 그대로 남아 빈 페이지가 한 장 더 찍히는 문제가 있음) */
    body > *:not(#certPrintArea){ display:none !important; }
    #certPrintArea{
      display:block !important; width:100%; padding:0; margin:0;
    }
    @page{ size:A4; margin:14mm 16mm; }
    .print-slip{
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }
  }
  .print-slip{
    font-family:'Pretendard', -apple-system, sans-serif; color:#141414;
    padding:14mm 14mm 10mm; min-height:250mm; box-sizing:border-box;
    display:flex; flex-direction:column;
    background-image:url('cert-bg.jpg');
    background-size:100% 100%;
    background-position:top left;
    background-repeat:no-repeat;
  }
  .print-slip .p-header{ text-align:center; margin-bottom:20px; padding-top:8mm; }
  .print-slip .p-docnum{ text-align:right; font-size:11px; color:#888; margin-bottom:4px; }
  .print-slip .p-company{ font-size:10.5px; color:#888; }
  .print-slip .p-title{ font-size:24px; font-weight:700; letter-spacing:.3em; margin-top:6px; }
  .print-slip .p-info-table{ width:100%; border-collapse:collapse; margin:32px 0 24px; page-break-inside:avoid; }
  .print-slip .p-info-table th, .print-slip .p-info-table td{
    border:1px solid #333; padding:10px 12px; font-size:13px;
  }
  .print-slip .p-info-table th{ background:#f2f0eb; width:110px; text-align:center; }
  /* 박스형 레이아웃: 좌측에 "인적사항"을 여러 행에 걸쳐 병합한 라벨을 두고, 바깥 테두리를 굵게 둘러서
     공문서/증명서 특유의 격식 있는 표 느낌을 살린다. */
  .print-slip .p-info-table.boxed{ border:2px solid #141414; }
  .print-slip .p-info-table.boxed th, .print-slip .p-info-table.boxed td{ border-color:#888; }
  .print-slip .p-info-table.boxed .side-label{
    width:64px; background:#f2f0eb; font-weight:600; letter-spacing:.15em; text-align:center; border-color:#141414;
  }
  .print-slip .cert-body{ font-size:13.5px; line-height:1.8; margin:32px 0; text-align:center; }
  .print-slip .cert-purpose{ font-size:12.5px; color:#444; margin-bottom:28px; text-align:center; }
  .print-slip .cert-sign{ text-align:right; font-size:13px; line-height:1.8; margin-top:24px; }
  .print-slip .stamp-row{ display:flex; justify-content:flex-end; align-items:center; gap:4px; margin-top:6px; }
  .print-slip .p-stamp{ width:62px; height:62px; margin-left:-8px; opacity:.92; }
  /* 하단 레터헤드(문서번호/회사 주소) - 문서 맨 아래, 본문과는 여유 있게 띄우고 얇은 상단 구분선만 */
  .print-slip .p-footer{
    margin-top:auto; padding-top:14px; border-top:1px solid #ccc;
    text-align:center;
  }
  @media (max-width: 640px) {
    header{ padding:20px !important; flex-wrap:wrap; gap:10px; }
    .header-right{ flex-wrap:wrap; gap:12px !important; }
    main{ padding:20px 14px !important; }
    h1{ font-size:24px !important; }
    .upload-panel{ padding:18px 16px !important; }
    input, select, textarea{ font-size:16px !important; width:100% !important; box-sizing:border-box; }
    .field input, .field select{ padding:10px 12px !important; }
    .upload-row{ flex-direction:column; align-items:stretch !important; }
    .field{ min-width:0 !important; }
    #certWritePanel .field{ width:100% !important; }
    .tabs{ gap:6px !important; }

    /* 넓은 표는 가로 스크롤 대신 카드형으로 세로 전환 */
    table{ min-width:0 !important; }
    thead{ display:none; }
    table, tbody, tr, td{ display:block; width:100%; }
    tr{
      border:1px solid var(--line); border-radius:6px;
      margin-bottom:12px; padding:10px 14px; background:#fff;
    }
    td{
      border:none !important; padding:6px 0 !important; white-space:normal !important;
    }
    td[data-label]::before{
      content:attr(data-label);
      display:block; font-size:11px; color:var(--muted); margin-bottom:2px;
    }
  }
</style>
</head>

<main>

  <div class="tabs" id="tabs"></div>

<div id="certPrintArea"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
  // 근로자, 관리자 모두 접근 가능
  requireRole(['worker', 'admin']);

  const storage = firebase.storage();
  let allFiles = [];
  let activeCategory = '전체';
  let isAdmin = false;
  let currentCertRole = null;
  let currentCertUser = null;

  auth.onAuthStateChanged(async (user) => {
    if (!user) return;
    const role = await getCurrentUserRole();
    isAdmin = (role === 'admin');
    currentCertRole = role;
    currentCertUser = user;
    document.getElementById('uploadPanel').classList.toggle('show', isAdmin);
    document.getElementById('cashbookLinkBar').style.display = isAdmin ? 'flex' : 'none';
    loadFiles();
    await initCertSection();
    await loadCertHistory();

    // ESG 자가진단(임원/직원) 모두에 로그인한 사람 이름을 실어 보내서, 각 페이지가 이름
    // 선택/입력 없이 바로 본인 설문(또는 이미 참여함 안내)으로 진입시키게 한다.
    // 주의: Firebase 로그인 프로필의 displayName은 비어있을 수 있어서, admin.html에서
    // 실제로 관리하는 Firestore users 문서의 이름을 우선으로 사용한다.
    let staffName = '';
    try {
      const myDoc = await db.collection('users').doc(user.uid).get();
      staffName = myDoc.data()?.displayName || user.displayName || '';
    } catch (err) {
      console.error('이름 조회 실패:', err);

  async function loadFiles() {
    // "회계현황" 카테고리는 규칙상 admin만 읽기 가능해서, 전체를 한 번에 조회하면
    // 규칙과 충돌해 요청 자체가 거부됨. 그래서 조건을 나눠 따로 조회한 뒤 합침.
    let docs = [];

    if (isAdmin) {
      const [accSnap, otherSnap] = await Promise.all([
        db.collection('files').where('category', '==', ACCOUNTING_CATEGORY).get(),
        db.collection('files').where('category', '!=', ACCOUNTING_CATEGORY).get()
      ]);
      docs = [...accSnap.docs, ...otherSnap.docs];
    } else {
      const snap = await db.collection('files').where('category', '!=', ACCOUNTING_CATEGORY).get();
      docs = snap.docs;
    }

    allFiles = docs.map(doc => ({ id: doc.id, ...doc.data() }));
    // 두 조회 결과를 합쳤으니 클라이언트에서 최신순 정렬
    allFiles.sort((a, b) => (b.uploadedAt?.toMillis?.() || 0) - (a.uploadedAt?.toMillis?.() || 0));

    renderCategoryTabs();
    renderTable();
    renderPreview();
    populateCategoryDatalist();
  }

  function renderCategoryTabs() {
    const categories = ['전체', ...new Set(allFiles.map(f => f.category))];
    const tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = '';
    categories.forEach(cat => {
      const btn = document.createElement('div');
      btn.className = 'tab' + (cat === activeCategory ? ' active' : '');
      btn.textContent = cat;
      btn.addEventListener('click', () => {
        activeCategory = cat;
        renderCategoryTabs();
        renderTable();
        renderPreview();
      });
      tabsEl.appendChild(btn);
    });

    } else {

  // 파일 형식에 따라 미리보기 링크를 다르게 생성
  // - 이미지/PDF/HTML: 브라우저가 직접 열어서 보여줄 수 있어 원본 URL 그대로 사용
  // - 워드/엑셀/파워포인트: 구글 문서 뷰어를 통해 미리보기
  // - 그 외 형식: 미리보기 미지원 (다운로드만)
  function buildPreviewUrl(fileName, fileUrl) {
    const ext = fileName.split('.').pop().toLowerCase();
    const directTypes = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'pdf', 'html', 'htm'];
    const officeTypes = ['doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx'];

    if (directTypes.includes(ext)) return fileUrl;
    if (officeTypes.includes(ext)) {
      return `https://docs.google.com/viewer?url=${encodeURIComponent(fileUrl)}&embedded=true`;
    }
    return null; // 미리보기 미지원
  }

  function startEditRow(docId) {
    const file = allFiles.find(f => f.id === docId);
    if (!file) return;
    const tr = document.querySelector(`tr[data-id="${docId}"]`);
    if (!tr) return;

    const nameCell = tr.querySelector('.cell-name');
    const categoryCell = tr.querySelector('.cell-category');

    nameCell.innerHTML = `<input type="text" class="edit-name-input" value="${file.name}">`;
    categoryCell.innerHTML = `<input type="text" class="edit-category-input" value="${file.category}" list="categoryList">`;

    const actionCell = tr.children[4];
    actionCell.innerHTML = `
      <button class="edit-btn save" data-id="${docId}">저장</button>
      <button class="edit-btn cancel" data-id="${docId}">취소</button>
    `;

    actionCell.querySelector('.save').addEventListener('click', () => saveEditRow(docId));
    actionCell.querySelector('.cancel').addEventListener('click', () => { renderTable(); renderPreview(); });
  }

  async function saveEditRow(docId) {
    const tr = document.querySelector(`tr[data-id="${docId}"]`);
    const newName = tr.querySelector('.edit-name-input').value.trim();
    const newCategory = tr.querySelector('.edit-category-input').value.trim();

    if (!newName || !newCategory) {
      alert('파일명과 카테고리를 모두 입력해 주세요.');
      return;
    }

    try {
      await db.collection('files').doc(docId).update({ name: newName, category: newCategory });
      await loadFiles();
    } catch (err) {
      alert('수정 실패: ' + err.message);
    }
  }

    if (!confirm('이 파일을 삭제하시겠습니까?')) return;

  function formatDateKR(str) {
    if (!str) return '';
    const [y, m, d] = String(str).split('-');
    if (!y || !m || !d) return str;
    return `${y}년 ${Number(m)}월 ${Number(d)}일`;
  }

  // 시작일~종료일 사이를 "n년 n개월"로 계산 (재직/경력/퇴직증명서의 "기간" 표기에 사용)
  function calcDuration(startStr, endStr) {
    if (!startStr || !endStr) return '';
    const start = new Date(startStr);
    const end = new Date(endStr);
    if (isNaN(start.getTime()) || isNaN(end.getTime()) || end < start) return '';

    let years = end.getFullYear() - start.getFullYear();
    let months = end.getMonth() - start.getMonth();
    if (end.getDate() < start.getDate()) months -= 1;
    if (months < 0) { years -= 1; months += 12; }

    const parts = [];
    if (years > 0) parts.push(`${years}년`);
    parts.push(`${months}개월`);
    return parts.join(' ');
  }

  // 예전에 이미 "근무중" 같은 상태 태그가 섞여 저장된 문서를 재인쇄할 때도
  // 깨끗하게 나오도록, 표시 직전에 한 번 더 걸러낸다.
  function cleanPosition(str) {
    return String(str || '')
      .split(',')
      .map(s => s.trim())
      .filter(s => s && s !== '근무중')
      .join(', ');
  }

          <table class="p-info-table boxed">
            <tr>
              <th class="side-label" rowspan="4">인적<br>사항</th>
              <th>성 명</th><td>${name}</td><th>주민등록번호</th><td>${f.rrn || ''}</td>
            </tr>
            <tr><th>주 소</th><td colspan="3">${f.address || ''}</td></tr>
            <tr><th>소 속</th><td>${doc.department || ''}</td><th>직 급</th><td>${position}</td></tr>
            <tr><th>기 간</th><td colspan="3">${period}</td></tr>
            <tr><th class="side-label">용 도</th><td colspan="4">${f.purpose || ''}</td></tr>
          </table>
          <p class="cert-body">위와 같이 본 ${COMPANY_NAME_KR}에 재직 함을 증명(확인)합니다.</p>
        `;
      }
      case '경력증명서': {
        const period = f.resignDate
          ? `${formatDateKR(f.hireDate)} ~ ${formatDateKR(f.resignDate)} (${calcDuration(f.hireDate, f.resignDate)})`
          : `${formatDateKR(f.hireDate)} ~ 현재`;
        return `
          <table class="p-info-table boxed">
            <tr>
              <th class="side-label" rowspan="5">인적<br>사항</th>
              <th>성 명</th><td>${name}</td><th>주민등록번호</th><td>${f.rrn || ''}</td>
            </tr>
            <tr><th>주 소</th><td colspan="3">${f.address || ''}</td></tr>
            <tr><th>소 속</th><td>${doc.department || ''}</td><th>직 급</th><td>${position}</td></tr>
            <tr><th>담당업무</th><td colspan="3">${f.duty || ''}</td></tr>
            <tr><th>재직기간</th><td colspan="3">${period}</td></tr>
            <tr><th class="side-label">용 도</th><td colspan="4">${f.purpose || ''}</td></tr>
          </table>
          <p class="cert-body">위와 같이 본 ${COMPANY_NAME_KR}에 재직(근무)하였음을 증명합니다.</p>
        `;
      }
      case '퇴직증명서':
        return `
          <table class="p-info-table boxed">
            <tr>
              <th class="side-label" rowspan="5">인적<br>사항</th>
              <th>성 명</th><td>${name}</td><th>주민등록번호</th><td>${f.rrn || ''}</td>
            </tr>
            <tr><th>주 소</th><td colspan="3">${f.address || ''}</td></tr>
            <tr><th>소 속</th><td>${doc.department || ''}</td><th>직 급</th><td>${position}</td></tr>
            <tr><th>재직기간</th><td colspan="3">${formatDateKR(f.hireDate)} ~ ${formatDateKR(f.resignDate)} (${calcDuration(f.hireDate, f.resignDate)})</td></tr>
            <tr><th>퇴직사유</th><td colspan="3">${f.resignReason || ''}</td></tr>
            <tr><th class="side-label">용 도</th><td colspan="4">${f.purpose || ''}</td></tr>
          </table>
          <p class="cert-body">위와 같이 본 ${COMPANY_NAME_KR}에 입사하여 근무하다가 위와 같은 사유로 퇴직하였음을 증명합니다.</p>
        `;
      case '해촉증명서':
        return `
          <table class="p-info-table boxed">
            <tr>
              <th class="side-label" rowspan="4">인적<br>사항</th>
              <th>성 명</th><td>${name}</td><th>주민등록번호</th><td>${f.rrn || ''}</td>
            </tr>
            <tr><th>소 속</th><td colspan="3">${doc.department || ''}</td></tr>
            <tr><th>근무일자</th><td colspan="3">${formatDateKR(f.workStart)} ~ ${formatDateKR(f.workEnd)}</td></tr>
            <tr><th>주 소</th><td colspan="3">${f.address || ''}</td></tr>
            <tr><th class="side-label">용 도</th><td>${f.purpose || ''}</td><th>제출처</th><td colspan="2">${f.submitTo || ''}</td></tr>
          </table>
          <p class="cert-body">위 사실을 증명합니다.</p>
        `;
      case '사직서':
        return `
          <table class="p-info-table boxed">
            <tr>
              <th class="side-label" rowspan="4">인적<br>사항</th>
              <th>소 속</th><td>${doc.department || ''}</td><th>직 위</th><td>${position}</td>
            </tr>
            <tr><th>성 명</th><td>${name}</td><th>생년월일</th><td>${formatDateKR(f.birthDate)}</td></tr>
            <tr><th>입사년월일</th><td>${formatDateKR(f.hireDate)}</td><th>주민등록번호</th><td>${f.rrn || ''}</td></tr>
            <tr><th>주 소</th><td colspan="3">${f.address || ''}</td></tr>
          </table>
          <p class="cert-body">상기 본인은 ${formatDateKR(f.resignDate)}자로 ${f.resignReason || ''} 사유로 사직하고자 하오니<br>조치하여 주시기 바랍니다.</p>
        `;
      default:
        return '';
    }
  }

  function printCertificate(doc) {
    const today = formatDateKR(doc.issueDate);
    const isResignation = doc.type === '사직서';
    const titleSpaced = doc.type.split('').join(' ');

    const signArea = isResignation ? `
      <div class="cert-sign">
        <div>제출일자: ${today}</div>
        <div style="margin-top:24px;">신청인: ${doc.employeeName} &nbsp;&nbsp;(서명)</div>
      </div>
    ` : `
      <div class="cert-sign">
        <div>발행일: ${today}</div>
        <div class="stamp-row">
          <span>${COMPANY_NAME} ${CEO_TITLE}</span>
          <img class="p-stamp" src="${COMPANY_STAMP_URL}">
        </div>
      </div>
    `;

    renderAndPrint(`
      <div class="print-slip">
        <div class="p-header">
          ${doc.docNumber ? `<div class="p-docnum">문서번호: ${doc.docNumber}</div>` : ''}
          <div class="p-title">${titleSpaced}</div>
        </div>
        ${certBodyText(doc)}
        ${signArea}
        <div class="p-footer">
          <div class="p-company">${COMPANY_NAME} · ${COMPANY_ADDRESS} · ${COMPANY_TEL}</div>
        </div>
      </div>
    `, 'certPrintArea');
  }

  // 인쇄 영역에 직인 이미지가 있으면, 이미지 로딩이 끝난 뒤에 인쇄를 실행한다.
  // (innerHTML 세팅 직후 바로 print()를 부르면 이미지가 아직 안 그려진 채로 인쇄되는 경우가 있음)
  function renderAndPrint(html, areaId) {
    const area = document.getElementById(areaId);
    area.innerHTML = html;

    const img = area.querySelector('img.p-stamp');
    let printed = false;
    const doPrint = () => {
      if (printed) return;
      printed = true;
      window.print();
    };

    if (img) {
      if (img.complete && img.naturalWidth > 0) {
        doPrint();
      } else {
        img.addEventListener('load', doPrint);
        img.addEventListener('error', doPrint);
        setTimeout(doPrint, 1500); // 안전장치: 로딩이 오래 걸려도 결국은 인쇄되게
      }
    } else {
      doPrint();
    }
  }

  window.addEventListener('afterprint', () => {
    const area = document.getElementById('certPrintArea');
    if (area) area.innerHTML = '';
  });

  let editingDocId = null;

  document.getElementById('certGenerateBtn').addEventListener('click', async () => {
    const type = document.getElementById('cert-type').value;
    const uid = document.getElementById('cert-employee').value;
    const emp = certEmployees.find(e => e.uid === uid);
    const defs = CERT_FIELD_DEFS[type] || [];
    const statusEl = document.getElementById('certStatus');
    const btn = document.getElementById('certGenerateBtn');

    const values = {};
    for (const f of defs) {
      const el = document.getElementById('cf-' + f.key);
      values[f.key] = el ? el.value.trim() : '';
      if (!values[f.key] && !f.optional) {
        statusEl.style.color = '#a4453c';
        statusEl.textContent = `"${f.label}" 항목을 입력해 주세요.`;
        return;
      }
    }

    btn.disabled = true;
    statusEl.textContent = '';

    try {
      if (editingDocId) {
        // 수정 모드: 문서번호/문서종류/발급일(선택입력)은 유지하고 내용만 갱신
        btn.textContent = '수정 저장 중...';
        const issueDate = document.getElementById('cert-issueDate').value;

        await db.collection('issuedDocuments').doc(editingDocId).update({
          uid,
          employeeName: emp?.displayName || emp?.email || '',
          department: emp?.department || '',
          position: (emp?.positionTags || []).filter(t => t !== '근무중').join(', ') || '',
          fields: values,
          issueDate
        });

        statusEl.style.color = '#3f6b52';
        statusEl.textContent = '수정되었습니다. (문서번호는 그대로 유지됩니다)';
        const savedId = editingDocId;
        cancelEditDoc();
        await loadCertHistory();

        const updatedDoc = allCertDocs.find(d => d.id === savedId);
        if (updatedDoc) printCertificate(updatedDoc);
      } else {
        btn.textContent = '처리 중...';
        const docNumber = await getNextDocNumber(type);

        const docData = {
          type,
          docNumber,
          uid,
          employeeName: emp?.displayName || emp?.email || '',
          department: emp?.department || '',
          position: (emp?.positionTags || []).filter(t => t !== '근무중').join(', ') || '',
          fields: values,
          issueDate: new Date().toISOString().slice(0, 10),
          createdByEmail: auth.currentUser.email,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        const ref = await db.collection('issuedDocuments').add(docData);
        printCertificate({ id: ref.id, ...docData });
        statusEl.style.color = '#3f6b52';
        statusEl.textContent = '발급 완료. 인쇄 창이 열립니다.';
        await loadCertHistory();
      }
    } catch (err) {
      statusEl.style.color = '#a4453c';
      statusEl.textContent = (editingDocId ? '수정' : '발급') + ' 실패: ' + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = editingDocId ? '수정 저장' : '발급 및 인쇄';
    }
  });

  function startEditDoc(doc) {
    editingDocId = doc.id;

    const typeSelect = document.getElementById('cert-type');
    const empSelect = document.getElementById('cert-employee');
    const issueDateField = document.getElementById('cert-issueDate-field');
    const issueDateInput = document.getElementById('cert-issueDate');

    // 수정 화면에서도 문서종류/사원 전체 목록을 보여줘야 하므로 admin 기준 옵션으로 고정
    typeSelect.innerHTML = `
      <option value="재직증명서">재직증명서</option>
      <option value="경력증명서">경력증명서</option>
      <option value="퇴직증명서">퇴직증명서</option>
      <option value="해촉증명서">해촉증명서</option>
      <option value="사직서">사직서</option>
    `;
    typeSelect.value = doc.type;
    typeSelect.disabled = true; // 문서번호에 이미 종류가 반영되어 있어 종류는 바꿀 수 없음

    empSelect.innerHTML = certEmployees.map(e => `<option value="${e.uid}">${e.displayName || e.email}</option>`).join('');
    empSelect.value = doc.uid;
    empSelect.disabled = false;

    issueDateField.style.display = '';
    issueDateInput.value = doc.issueDate || '';

    renderCertFields();

    // renderCertFields()가 사원 프로필로 일부 값을 자동 채운 뒤, 저장되어 있던 값으로 다시 덮어쓴다
    const defs = CERT_FIELD_DEFS[doc.type] || [];
    defs.forEach(f => {
      const el = document.getElementById('cf-' + f.key);
      if (el) el.value = (doc.fields && doc.fields[f.key]) || '';
    });

    document.getElementById('certPanelTitle').textContent = '문서 수정';
    document.getElementById('certEditBannerText').textContent =
      `"${doc.docNumber}" 문서를 수정 중입니다. 저장해도 문서번호는 그대로 유지됩니다. (문서종류는 변경 불가)`;
    document.getElementById('certEditBanner').style.display = 'flex';
    document.getElementById('certGenerateBtn').textContent = '수정 저장';
    document.getElementById('certStatus').textContent = '';

    document.getElementById('certWritePanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function cancelEditDoc() {
    editingDocId = null;
    document.getElementById('cert-issueDate-field').style.display = 'none';
    document.getElementById('certPanelTitle').textContent = '문서 작성';
    document.getElementById('certEditBanner').style.display = 'none';
    document.getElementById('certGenerateBtn').textContent = '발급 및 인쇄';
    document.getElementById('certStatus').textContent = '';
    initCertSection(); // 근로자/관리자 기본 상태(문서종류·사원 잠금 등)로 재초기화
  }

  document.getElementById('certCancelEditBtn').addEventListener('click', cancelEditDoc);

  // 문서종류별로 "코드-연도-4자리 일련번호" 형태의 문서번호를 트랜잭션으로 발급
  // (docCounters/{문서종류} 문서의 seq 필드를 원자적으로 1씩 증가시켜 중복 없이 채번)
  async function getNextDocNumber(type) {
    const year = new Date().getFullYear();
    const counterRef = db.collection('docCounters').doc(type);

    const seq = await db.runTransaction(async (tx) => {
      const snap = await tx.get(counterRef);
      const current = snap.exists ? (snap.data().seq || 0) : 0;
      const next = current + 1;
      tx.set(counterRef, { seq: next }, { merge: true });
      return next;
    });

    const code = CERT_TYPE_CODE[type] || type;
    return `${code}-${year}-${String(seq).padStart(4, '0')}`;
  }

  async function loadCertHistory() {
    const query = (currentCertRole === 'admin')
      ? db.collection('issuedDocuments').orderBy('createdAt', 'desc')
      : db.collection('issuedDocuments').where('uid', '==', currentCertUser.uid);

    const snap = await query.get();
    allCertDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (currentCertRole !== 'admin') {
      allCertDocs.sort((a, b) => (b.issueDate || '').localeCompare(a.issueDate || ''));
    }

    renderCertTabs();
    renderCertHistoryTable();
  }

  function renderCertTabs() {
    const tabsEl = document.getElementById('certTabs');
    const types = ['전체', ...CERT_TYPES_LIST];
    tabsEl.innerHTML = '';
    types.forEach(t => {
      const btn = document.createElement('div');
      btn.className = 'tab' + (t === activeCertType ? ' active' : '');
      btn.textContent = t;
      btn.addEventListener('click', () => {
        activeCertType = t;
        renderCertTabs();
        renderCertHistoryTable();
      });
      tabsEl.appendChild(btn);
    });
  }

  function renderCertHistoryTable() {
    const tbody = document.getElementById('certTableBody');
    const emptyMsg = document.getElementById('certEmptyMsg');
    const docs = activeCertType === '전체'
      ? allCertDocs
      : allCertDocs.filter(d => d.type === activeCertType);

    if (docs.length === 0) {
      tbody.innerHTML = '';
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';

    tbody.innerHTML = docs.map(d => `
      <tr>
        <td data-label="문서번호">${d.docNumber || '-'}</td>
        <td data-label="발급일">${d.issueDate || ''}</td>
        <td data-label="문서종류"><span class="cat-badge">${d.type}</span></td>
        <td data-label="사원명">${d.employeeName || ''}</td>
        <td data-label="용도/사유">${(d.fields && (d.fields.purpose || d.fields.resignReason)) || ''}</td>
        <td data-label="관리">
          <button class="dl-link" style="background:none; border:none; cursor:pointer; padding:0;" data-reprint="${d.id}">인쇄</button>
          ${currentCertRole === 'admin' ? `<button class="dl-link" style="background:none; border:none; cursor:pointer; padding:0; margin-left:8px;" data-certedit="${d.id}">수정</button>` : ''}
          ${currentCertRole === 'admin' ? `<button class="del-btn" data-certdel="${d.id}">삭제</button>` : ''}
        </td>
      </tr>
    `).join('');

    tbody.querySelectorAll('[data-reprint]').forEach(btn => {
      btn.addEventListener('click', () => {
        const d = docs.find(x => x.id === btn.dataset.reprint);
        if (d) printCertificate(d);
      });
    });
    tbody.querySelectorAll('[data-certedit]').forEach(btn => {
      btn.addEventListener('click', () => {
        const d = docs.find(x => x.id === btn.dataset.certedit);
        if (d) startEditDoc(d);
      });
    });
    tbody.querySelectorAll('[data-certdel]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('이 발급 이력을 삭제할까요? (문서번호는 재사용되지 않습니다. 잘못 발급한 경우 삭제 대신 "수정"을 이용해주세요)')) return;
        await db.collection('issuedDocuments').doc(btn.dataset.certdel).delete();
        await loadCertHistory();
      });
    });
  }

  // 회계/관리 드롭다운
  const accountingDropdown = document.getElementById('accountingDropdown');
  document.getElementById('accountingDropdownBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    accountingDropdown.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (accountingDropdown && !accountingDropdown.contains(e.target)) {
      accountingDropdown.classList.remove('open');
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async (e) => {
    e.preventDefault();
    await logOut();
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
