<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pretendard:wght@400;500&display=swap');

  :root{
    --ink:#141414;
    --paper:#f7f6f3;
    --line:#d8d5cd;
    --muted:#8a8578;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    font-family:'Pretendard', -apple-system, sans-serif;
    color:var(--ink);
  }
  header{
    padding:28px 48px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .eyebrow{
    font-size:11px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--muted); margin-bottom:6px;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500; font-size:32px; margin:0; letter-spacing:.01em;
  }
  .header-right{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    justify-content:flex-end;
    row-gap:8px;
    gap:20px;
  }
  .home-link{
    font-size:13px; color:var(--muted); text-decoration:none;
    border-bottom:1px solid var(--muted);
  }
  .logout{
    font-size:13px; color:var(--muted); text-decoration:none;
    border-bottom:1px solid var(--muted); cursor:pointer;
  }

  /* 업무 도구 드롭다운 (index.html의 nav-item-dropdown 패턴과 동일) */
  .nav-item-dropdown{ position:relative; }
  .nav-dropdown-toggle{
    display:inline-flex; align-items:center; gap:4px; cursor:pointer;
    font-size:13px; color:var(--muted); text-decoration:none;
    border-bottom:1px solid var(--muted);
  }
  .nav-dropdown-toggle .caret{ font-size:10px; transition:transform .2s; cursor:pointer; padding:4px; margin:-4px; }
  .nav-dropdown-menu{
    display:none; position:absolute; top:100%; right:0; padding-top:14px;
    min-width:210px; z-index:1001;
  }
  .nav-dropdown-menu-inner{
    background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.08);
    padding:8px;
  }
  .nav-dropdown-menu a{
    display:block; padding:9px 12px; font-size:12.5px;
    color:var(--ink); border-radius:5px; white-space:nowrap; text-decoration:none; border-bottom:none;
  }
  .nav-dropdown-menu a:hover{ background:var(--paper); }
  .nav-item-dropdown:hover .nav-dropdown-menu{ display:block; }
  .nav-item-dropdown:hover .caret{ transform:rotate(180deg); }
  .nav-item-dropdown.open .nav-dropdown-menu{ display:block; }
  .nav-item-dropdown.open .caret{ transform:rotate(180deg); }
  main{ max-width:1180px; margin:0 auto; padding:48px; }
  .section-label{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); margin-bottom:16px;
  }
  table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:56px;
  }
  th{
    text-align:left; font-size:12px; color:var(--muted);
    font-weight:500; padding:10px 12px; border-bottom:1px solid var(--line);
  }
  td{
    padding:14px 12px; font-size:14px; border-bottom:1px solid var(--line);
    vertical-align:middle;
  }
  .name-cell{ display:flex; align-items:center; gap:10px; }
  .avatar-img{
    width:32px; height:32px; border-radius:50%; object-fit:cover; flex-shrink:0;
  }
  .avatar-fallback{
    width:32px; height:32px; border-radius:50%; background:#ece9e2; color:#7a766c;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600;
    flex-shrink:0;
  }
  .avatar-wrap{
    position:relative; width:32px; height:32px; flex-shrink:0; cursor:pointer; border-radius:50%;
  }
  .avatar-wrap input[type="file"]{
    position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer;
  }
  .avatar-wrap .avatar-overlay{
    position:absolute; inset:0; border-radius:50%; background:rgba(20,20,20,.55);
    color:#fff; font-size:9px; display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .15s; pointer-events:none; text-align:center; line-height:1.2;
  }
  .avatar-wrap:hover .avatar-overlay{ opacity:1; }
  .avatar-wrap.uploading .avatar-overlay{ opacity:1; content:''; }
  .role-badge{
    display:inline-block; font-size:11px; padding:3px 10px;
    border-radius:20px; letter-spacing:.02em; white-space:nowrap;
  }
  .role-guest{ background:#ece9e2; color:#7a766c; }
  .role-worker{ background:#dfe9e2; color:#3f6b52; }
  .role-admin{ background:#141414; color:#f7f6f3; }
  select{
    font-family:inherit; font-size:13px; padding:6px 10px;
    border:1px solid var(--line); background:#fff; color:var(--ink);
    border-radius:4px;
  }
  .apply-btn{
    margin-left:8px; padding:6px 14px; background:var(--ink); color:var(--paper);
    border:none; font-size:12px; letter-spacing:.05em; cursor:pointer; border-radius:4px;
  }
  .apply-btn:hover{ opacity:.85; }
  .apply-btn:disabled{ opacity:.4; cursor:default; }
  .edit-btn, .delete-btn{
    padding:6px 12px; background:#fff; color:var(--ink); border:1px solid var(--line);
    font-size:12px; cursor:pointer; border-radius:4px; margin-right:6px;
  }
  .edit-btn:hover{ border-color:var(--ink); }
  .delete-btn{ color:#a4453c; border-color:#f0c9c4; }
  .delete-btn:hover{ background:#fdf1f0; }
  .order-controls{ display:flex; flex-direction:column; gap:3px; }
  .order-btn{
    width:26px; height:22px; padding:0; background:#fff; color:var(--ink); border:1px solid var(--line);
    font-size:11px; cursor:pointer; border-radius:4px; line-height:1;
  }
  .order-btn:hover{ border-color:var(--ink); }
  .order-btn:disabled{ opacity:.3; cursor:default; }
  .hr-edit-input{
    display:block; width:100%; max-width:220px; padding:6px 8px; margin-bottom:6px;
    border:1px solid var(--line); border-radius:4px; font-family:inherit; font-size:12.5px; background:#fff;
  }
  .empty{ font-size:13px; color:var(--muted); padding:20px 0; }
  .status-msg{ font-size:13px; margin-top:-40px; margin-bottom:40px; min-height:18px; }
  @media (max-width: 640px) {
    header{ padding:20px !important; flex-wrap:wrap; gap:10px; }
    .header-right{ flex-wrap:wrap; gap:12px !important; }
    .nav-dropdown-menu{ position:static; display:none; padding-top:0; margin:8px 0 0; min-width:0; right:auto; }
    .nav-dropdown-menu-inner{ box-shadow:none; border:none; border-radius:0; padding:0; border-left:2px solid var(--line); padding-left:10px; }
    .nav-item-dropdown:hover .nav-dropdown-menu{ display:none; }
    .nav-item-dropdown.open .nav-dropdown-menu{ display:block; }
    main{ padding:24px 16px !important; }
    h1{ font-size:24px !important; }
    input, select, textarea{ font-size:16px !important; }

    table{ min-width:0 !important; }
    thead{ display:none; }
    table, tbody, tr, td{ display:block; width:100%; }
    tr{
      border:1px solid var(--line); border-radius:6px;
      margin-bottom:12px; padding:10px 14px; background:#fff;
    }
    td{
      border:none !important; padding:6px 0 !important; white-space:normal !important;
    }
    td[data-label]::before{
      content:attr(data-label);
      display:block; font-size:11px; color:var(--muted); margin-bottom:2px;
    }
  }
</style>
</head>

<main>
  <div class="section-label">전체 회원</div>
  <div class="status-msg" id="statusMsg"></div>
  <table>
    <thead>
      <tr>
        <th>순서</th>
        <th>이름</th>
        <th>이메일</th>
        <th>인사정보</th>
        <th>현재 권한</th>
        <th>변경</th>
        <th>관리</th>
      </tr>
    </thead>
    <tbody id="userTableBody"></tbody>
  </table>
  <div class="empty" id="emptyMsg" style="display:none;">등록된 회원이 없습니다.</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-functions-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
  // 관리자만 접근 가능
  requireRole(['admin']);

  // 상단 "업무 도구" 드롭다운 (index.html과 동일한 동작 패턴)
  function toggleNavDropdown(e, el) {
    e.preventDefault();
    e.stopPropagation();
    const wrap = el.closest('.nav-item-dropdown');
    const wasOpen = wrap.classList.contains('open');
    document.querySelectorAll('.nav-item-dropdown.open').forEach(d => d.classList.remove('open'));
    if (!wasOpen) wrap.classList.add('open');
    return false;
  }
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.nav-item-dropdown')) {
      document.querySelectorAll('.nav-item-dropdown.open').forEach(d => d.classList.remove('open'));
    }
  });

  const functions = firebase.functions();
  const tableBody = document.getElementById('userTableBody');
  const emptyMsg = document.getElementById('emptyMsg');
  const statusMsg = document.getElementById('statusMsg');

  const roleLabel = { guest: '게스트', worker: '근로자', admin: '관리자' };
  let usersCache = {};

  async function swapOrder(a, b) {
    const orderA = a.data.order ?? 0;
    const orderB = b.data.order ?? 0;
    const batch = db.batch();
    batch.update(db.collection('users').doc(a.uid), { order: orderB });
    batch.update(db.collection('users').doc(b.uid), { order: orderA });
    await batch.commit();
    await loadUsers();
  }

  async function loadUsers() {
    const snapshot = await db.collection('users').get();
    tableBody.innerHTML = '';
    usersCache = {};

    if (snapshot.empty) {
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';

    let entries = snapshot.docs.map(doc => ({ uid: doc.id, data: doc.data() }));

    // order 필드가 없는(기존) 회원은 현재 목록 순서를 기준으로 한 번만 채워준다 (최초 1회 마이그레이션)
    const missingOrder = entries.filter(e => e.data.order === undefined || e.data.order === null);
    if (missingOrder.length > 0) {
      const batch = db.batch();
      entries.forEach((e, i) => {
        if (e.data.order === undefined || e.data.order === null) {
          e.data.order = i;
          batch.update(db.collection('users').doc(e.uid), { order: i });
        }
      });
      await batch.commit();
    }

    entries.sort((a, b) => (a.data.order ?? 0) - (b.data.order ?? 0));

    entries.forEach(({ uid, data }, idx) => {
      usersCache[uid] = data;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td data-label="순서">
          <div class="order-controls">
            <button class="order-btn" data-move-up="${uid}" ${idx === 0 ? 'disabled' : ''}>▲</button>
            <button class="order-btn" data-move-down="${uid}" ${idx === entries.length - 1 ? 'disabled' : ''}>▼</button>
          </div>
        </td>
        <td data-label="이름">
          <div class="name-cell">
            <label class="avatar-wrap" data-avatar-wrap="${uid}">
              ${data.photoURL
                ? `<img src="${data.photoURL}" class="avatar-img">`
                : `<span class="avatar-fallback">${(data.displayName || '?').charAt(0)}</span>`}
              <span class="avatar-overlay">변경</span>
              <input type="file" accept="image/*" data-photo-uid="${uid}">
            </label>
            <span>${data.displayName || '(이름 없음)'}</span>
          </div>
        </td>
        <td data-label="이메일">${data.email || ''}</td>
        <td data-label="인사정보" data-hr-cell="${uid}">
          ${data.department || '부서 미지정'} · ${(data.positionTags || []).join(', ') || '직급 미지정'} · ${data.hireDate ? '입사일 ' + data.hireDate : '입사일 미지정'}
        </td>
        <td data-label="현재 권한"><span class="role-badge role-${data.role}">${roleLabel[data.role] || data.role}</span></td>
        <td data-label="변경">
          <select data-uid="${uid}">
            <option value="guest" ${data.role === 'guest' ? 'selected' : ''}>게스트</option>
            <option value="worker" ${data.role === 'worker' ? 'selected' : ''}>근로자</option>
            <option value="admin" ${data.role === 'admin' ? 'selected' : ''}>관리자</option>
          </select>
          <button class="apply-btn" data-uid="${uid}">적용</button>
        </td>
        <td data-label="관리" data-actions-cell="${uid}">
          <button class="edit-btn" data-edit="${uid}">수정</button>
          <button class="delete-btn" data-delete="${uid}">삭제</button>
        </td>
      `;
      tableBody.appendChild(tr);
    });

    // 순서 이동 버튼 (바로 위/아래 회원과 order 값을 서로 맞바꿈)
    document.querySelectorAll('[data-move-up]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const uid = btn.dataset.moveUp;
        const idx = entries.findIndex(e => e.uid === uid);
        if (idx <= 0) return;
        await swapOrder(entries[idx], entries[idx - 1]);
      });
    });
    document.querySelectorAll('[data-move-down]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const uid = btn.dataset.moveDown;
        const idx = entries.findIndex(e => e.uid === uid);
        if (idx < 0 || idx >= entries.length - 1) return;
        await swapOrder(entries[idx], entries[idx + 1]);
      });
    });

    // 인사정보 수정 버튼
    document.querySelectorAll('[data-edit]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const uid = btn.dataset.edit;
        const data = usersCache[uid];
        startEditHrInfo(uid, data);
      });
    });

    // 프로필 사진 업로드 (아바타 클릭)
    document.querySelectorAll('[data-photo-uid]').forEach((input) => {
      input.addEventListener('change', async () => {
        const uid = input.dataset.photoUid;
        const file = input.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
          statusMsg.style.color = '#a4453c';
          statusMsg.textContent = '이미지 파일만 업로드할 수 있습니다.';
          input.value = '';
          return;
        }
        if (file.size > 5 * 1024 * 1024) {
          statusMsg.style.color = '#a4453c';
          statusMsg.textContent = '5MB 이하 이미지만 업로드할 수 있습니다.';
          input.value = '';
          return;
        }

        const wrap = document.querySelector(`[data-avatar-wrap="${uid}"]`);
        const overlay = wrap.querySelector('.avatar-overlay');
        wrap.classList.add('uploading');
        overlay.textContent = '업로드중';
        statusMsg.style.color = '';
        statusMsg.textContent = '';

        try {
          const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
          const storageRef = firebase.storage().ref(`avatars/${uid}/${Date.now()}.${ext}`);
          await storageRef.put(file);
          const photoURL = await storageRef.getDownloadURL();
          await db.collection('users').doc(uid).update({ photoURL });
          statusMsg.style.color = '#3f6b52';
          statusMsg.textContent = '프로필 사진이 변경되었습니다.';
          await loadUsers();
        } catch (err) {
          statusMsg.style.color = '#a4453c';
          statusMsg.textContent = '업로드 실패: ' + (err.message || '알 수 없는 오류');
          wrap.classList.remove('uploading');
          overlay.textContent = '변경';
        }
      });
    });

    // 회원 삭제 버튼
    document.querySelectorAll('[data-delete]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const uid = btn.dataset.delete;
        const data = usersCache[uid];

        if (auth.currentUser && auth.currentUser.uid === uid) {
          alert('본인 계정은 삭제할 수 없습니다.');
          return;
        }
        if (!confirm(`"${data.displayName || data.email}" 계정을 삭제할까요?\n\n이 작업은 되돌릴 수 없으며, 삭제 후 다시 로그인하면 게스트 상태로 재가입해야 합니다.`)) return;

        try {
          await db.collection('users').doc(uid).delete();
          statusMsg.style.color = '#3f6b52';
          statusMsg.textContent = '삭제되었습니다.';
          await loadUsers();
        } catch (err) {
          statusMsg.style.color = '#a4453c';
          statusMsg.textContent = '삭제 실패: ' + err.message;
        }
      });
    });

    // 적용 버튼 이벤트 연결
    document.querySelectorAll('.apply-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const uid = btn.dataset.uid;
        const select = document.querySelector(`select[data-uid="${uid}"]`);
        const newRole = select.value;

        btn.disabled = true;
        btn.textContent = '처리 중...';
        statusMsg.textContent = '';

        try {
          const setUserRole = functions.httpsCallable('setUserRole');
          await setUserRole({ targetUid: uid, newRole });
          statusMsg.textContent = '권한이 변경되었습니다.';
          statusMsg.style.color = '#3f6b52';
          await loadUsers();
        } catch (err) {
          statusMsg.textContent = '변경 실패: ' + (err.message || '알 수 없는 오류');
          statusMsg.style.color = '#a4453c';
          btn.disabled = false;
          btn.textContent = '적용';
        }
      });
    });
  }

  function startEditHrInfo(uid, data) {
    const hrCell = document.querySelector(`[data-hr-cell="${uid}"]`);
    const actionsCell = document.querySelector(`[data-actions-cell="${uid}"]`);
    const esc = (s) => String(s || '').replace(/"/g, '&quot;');

    hrCell.innerHTML = `
      <input type="text" class="hr-edit-input" data-hr-field="department" value="${esc(data.department)}" placeholder="부서 (예: 경영관리부)">
      <input type="text" class="hr-edit-input" data-hr-field="positionTags" value="${esc((data.positionTags || []).join(', '))}" placeholder="직급 (콤마로 구분, 예: 과장, 대표)">
      <input type="date" class="hr-edit-input" data-hr-field="hireDate" value="${esc(data.hireDate)}">
    `;

    actionsCell.innerHTML = `
      <button class="edit-btn" data-save="${uid}">저장</button>
      <button class="delete-btn" data-cancel="${uid}" style="color:var(--muted); border-color:var(--line);">취소</button>
    `;

    actionsCell.querySelector('[data-save]').addEventListener('click', async () => {
      const department = hrCell.querySelector('[data-hr-field="department"]').value.trim();
      const positionTagsRaw = hrCell.querySelector('[data-hr-field="positionTags"]').value.trim();
      const hireDate = hrCell.querySelector('[data-hr-field="hireDate"]').value;
      const positionTags = positionTagsRaw ? positionTagsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];

      try {
        await db.collection('users').doc(uid).update({ department, positionTags, hireDate });
        statusMsg.style.color = '#3f6b52';
        statusMsg.textContent = '인사정보가 저장되었습니다.';
        await loadUsers();
      } catch (err) {
        statusMsg.style.color = '#a4453c';
        statusMsg.textContent = '저장 실패: ' + err.message;
      }
    });

    actionsCell.querySelector('[data-cancel]').addEventListener('click', () => {
      loadUsers();
    });
  }

  auth.onAuthStateChanged((user) => {
    if (user) loadUsers();
  });

  document.getElementById('logoutBtn').addEventListener('click', async (e) => {
    e.preventDefault();
    await logOut();
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
