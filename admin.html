<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141414">
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
<title>관리자 | NUCKS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pretendard:wght@400;500&display=swap');

  :root{
    --ink:#141414;
    --paper:#f7f6f3;
    --line:#d8d5cd;
    --muted:#8a8578;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    font-family:'Pretendard', -apple-system, sans-serif;
    color:var(--ink);
  }
  header{
    padding:28px 48px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .eyebrow{
    font-size:11px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--muted); margin-bottom:6px;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500; font-size:32px; margin:0; letter-spacing:.01em;
  }
  .header-right{
    display:flex;
    align-items:center;
    gap:24px;
  }
  .home-link{
    font-size:13px; color:var(--muted); text-decoration:none;
    border-bottom:1px solid var(--muted);
  }
  .logout{
    font-size:13px; color:var(--muted); text-decoration:none;
    border-bottom:1px solid var(--muted); cursor:pointer;
  }
  main{ max-width:880px; margin:0 auto; padding:48px; }
  .section-label{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); margin-bottom:16px;
  }
  table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:56px;
  }
  th{
    text-align:left; font-size:12px; color:var(--muted);
    font-weight:500; padding:10px 12px; border-bottom:1px solid var(--line);
  }
  td{
    padding:14px 12px; font-size:14px; border-bottom:1px solid var(--line);
    vertical-align:middle;
  }
  .name-cell{ display:flex; align-items:center; gap:10px; }
  .avatar-img{
    width:32px; height:32px; border-radius:50%; object-fit:cover; flex-shrink:0;
  }
  .avatar-fallback{
    width:32px; height:32px; border-radius:50%; background:#ece9e2; color:#7a766c;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600;
    flex-shrink:0;
  }
  .role-badge{
    display:inline-block; font-size:11px; padding:3px 10px;
    border-radius:20px; letter-spacing:.02em;
  }
  .role-guest{ background:#ece9e2; color:#7a766c; }
  .role-worker{ background:#dfe9e2; color:#3f6b52; }
  .role-admin{ background:#141414; color:#f7f6f3; }
  select{
    font-family:inherit; font-size:13px; padding:6px 10px;
    border:1px solid var(--line); background:#fff; color:var(--ink);
    border-radius:4px;
  }
  .apply-btn{
    margin-left:8px; padding:6px 14px; background:var(--ink); color:var(--paper);
    border:none; font-size:12px; letter-spacing:.05em; cursor:pointer; border-radius:4px;
  }
  .apply-btn:hover{ opacity:.85; }
  .apply-btn:disabled{ opacity:.4; cursor:default; }
  .empty{ font-size:13px; color:var(--muted); padding:20px 0; }
  .status-msg{ font-size:13px; margin-top:-40px; margin-bottom:40px; min-height:18px; }
  @media (max-width: 640px) {
    header{ padding:20px !important; flex-wrap:wrap; gap:10px; }
    .header-right{ flex-wrap:wrap; gap:12px !important; }
    main{ padding:24px 16px !important; }
    h1{ font-size:24px !important; }
    input, select, textarea{ font-size:16px !important; }

    table{ min-width:0 !important; }
    thead{ display:none; }
    table, tbody, tr, td{ display:block; width:100%; }
    tr{
      border:1px solid var(--line); border-radius:6px;
      margin-bottom:12px; padding:10px 14px; background:#fff;
    }
    td{
      border:none !important; padding:6px 0 !important; white-space:normal !important;
    }
    td[data-label]::before{
      content:attr(data-label);
      display:block; font-size:11px; color:var(--muted); margin-bottom:2px;
    }
  }
</style>
</head>
<body>

<div id="notifPopup" style="display: none; position: fixed; top: 24px; right: 24px; z-index: 9999; max-width: 340px; background: rgb(255, 255, 255); border: 1px solid rgb(216, 213, 205); border-radius: 8px; box-shadow: rgba(0, 0, 0, 0.12) 0px 8px 28px; padding: 20px; font-family: Pretendard, -apple-system, sans-serif;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div style="font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#8a8578;">알림</div>
        <button id="notifCloseBtn" style="background:none; border:none; cursor:pointer; font-size:14px; color:#8a8578;">✕</button>
    </div>
    <div id="notifBody" style="font-size:13.5px; line-height:1.7; color:#141414;"></div>
</div>

<header>
  <div>
    <div class="eyebrow">NUCKS · Secret Mode</div>
    <h1>회원 관리</h1>
  </div>
  <div class="header-right">
    <a href="index.html" class="home-link">Home</a>
    <a href="gallery-admin.html" class="home-link">Gallery</a>
    <a href="#" class="logout" id="logoutBtn">Logout</a>
  </div>
</header>

<main>
  <div class="section-label">전체 회원</div>
  <div class="status-msg" id="statusMsg"></div>
  <table>
    <thead>
      <tr>
        <th>이름</th>
        <th>이메일</th>
        <th>현재 권한</th>
        <th>변경</th>
      </tr>
    </thead>
    <tbody id="userTableBody"></tbody>
  </table>
  <div class="empty" id="emptyMsg" style="display:none;">등록된 회원이 없습니다.</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-functions-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
  // 관리자만 접근 가능
  requireRole(['admin']);

  const functions = firebase.functions();
  const tableBody = document.getElementById('userTableBody');
  const emptyMsg = document.getElementById('emptyMsg');
  const statusMsg = document.getElementById('statusMsg');

  const roleLabel = { guest: '게스트', worker: '근로자', admin: '관리자' };

  async function loadUsers() {
    const snapshot = await db.collection('users').get();
    tableBody.innerHTML = '';

    if (snapshot.empty) {
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';

    snapshot.forEach((doc) => {
      const data = doc.data();
      const uid = doc.id;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td data-label="이름">
          <div class="name-cell">
            ${data.photoURL
              ? `<img src="${data.photoURL}" class="avatar-img">`
              : `<span class="avatar-fallback">${(data.displayName || '?').charAt(0)}</span>`}
            <span>${data.displayName || '(이름 없음)'}</span>
          </div>
        </td>
        <td data-label="이메일">${data.email || ''}</td>
        <td data-label="현재 권한"><span class="role-badge role-${data.role}">${roleLabel[data.role] || data.role}</span></td>
        <td data-label="변경">
          <select data-uid="${uid}">
            <option value="guest" ${data.role === 'guest' ? 'selected' : ''}>게스트</option>
            <option value="worker" ${data.role === 'worker' ? 'selected' : ''}>근로자</option>
            <option value="admin" ${data.role === 'admin' ? 'selected' : ''}>관리자</option>
          </select>
          <button class="apply-btn" data-uid="${uid}">적용</button>
        </td>
      `;
      tableBody.appendChild(tr);
    });

    // 적용 버튼 이벤트 연결
    document.querySelectorAll('.apply-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const uid = btn.dataset.uid;
        const select = document.querySelector(`select[data-uid="${uid}"]`);
        const newRole = select.value;

        btn.disabled = true;
        btn.textContent = '처리 중...';
        statusMsg.textContent = '';

        try {
          const setUserRole = functions.httpsCallable('setUserRole');
          await setUserRole({ targetUid: uid, newRole });
          statusMsg.textContent = '권한이 변경되었습니다.';
          statusMsg.style.color = '#3f6b52';
          await loadUsers();
        } catch (err) {
          statusMsg.textContent = '변경 실패: ' + (err.message || '알 수 없는 오류');
          statusMsg.style.color = '#a4453c';
          btn.disabled = false;
          btn.textContent = '적용';
        }
      });
    });
  }

  auth.onAuthStateChanged((user) => {
    if (user) {
      loadUsers();
      checkNotifications(user, 'admin');
    }
  });

  // ---------- 알림: 다가오는 연차(일주일 이내) + 다가오는 중요업무일정(일주일 이내) ----------
  // (login.html에서 관리자는 로그인 즉시 이 페이지로 이동하므로, index.html이 아니라
  //  여기서도 동일하게 알림을 띄워줘야 실제로 노출됩니다. 이 페이지는 requireRole(['admin'])로
  //  이미 관리자만 접근 가능하므로 role 분기 없이 항상 표시합니다.)
  async function checkNotifications(user, role) {
    const sections = [];

    try {
      const today = new Date();
      const todayStr = today.toISOString().slice(0, 10);
      const weekLater = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
      const weekLaterStr = weekLater.toISOString().slice(0, 10);

      // 1. 앞으로 7일 이내 예정된 연차
      const leaveLines = [];
      const leavesSnap = await db.collection('leaves').get();
      const upcomingLeaves = leavesSnap.docs
        .map(d => d.data())
        .filter(l => l['날짜'] >= todayStr && l['날짜'] <= weekLaterStr);

      if (upcomingLeaves.length > 0) {
        upcomingLeaves.sort((a, b) => (a['날짜'] || '').localeCompare(b['날짜'] || ''));
        leaveLines.push('🏖 일주일 내 예정된 연차:');
        upcomingLeaves.forEach(l => {
          leaveLines.push(`　· ${l['사원명'] || ''} - ${l['날짜']} (${l['연차구분'] || '연차'})`);
        });
      }
      if (leaveLines.length > 0) sections.push(leaveLines);

      // 2. 앞으로 7일 이내 예정된 중요업무일정
      const scheduleLines = [];
      const worklogsSnap = await db.collection('workLogs').get();
      const upcomingSchedules = worklogsSnap.docs
        .map(d => d.data())
        .filter(w => w['중요업무일정'] && w['중요업무일정']['날짜'] >= todayStr && w['중요업무일정']['날짜'] <= weekLaterStr);

      if (upcomingSchedules.length > 0) {
        upcomingSchedules.sort((a, b) => (a['중요업무일정']['날짜'] || '').localeCompare(b['중요업무일정']['날짜'] || ''));
        scheduleLines.push('📌 일주일 내 예정된 중요업무일정:');
        upcomingSchedules.forEach(w => {
          const content = w['중요업무일정']['내용'] || '';
          scheduleLines.push(`　· ${w['사원명'] || ''} - ${w['중요업무일정']['날짜']} (${content})`);
        });
      }
      if (scheduleLines.length > 0) sections.push(scheduleLines);

      if (sections.length > 0) {
        showNotifPopup(sections, user.uid);
      }
    } catch (err) {
      console.error('알림 확인 실패:', err);
    }
  }

  // 로그아웃 시 알림 플래그를 지워서, 같은 계정이든 다른 계정이든
  // 다음 로그인 때 알림을 새로 체크하도록 한다.
  function clearNotifFlags() {
    try {
      Object.keys(sessionStorage)
        .filter(k => k.startsWith('notifShown_'))
        .forEach(k => sessionStorage.removeItem(k));
    } catch (e) {}
  }

  function showNotifPopup(sections, uid) {
    // 세션당(+계정당) 한 번만 팝업 (같은 탭에서 새로고침만 반복할 땐 다시 안 뜨지만,
    // 같은 탭에서 계정을 바꿔 로그인하면 새 계정 기준으로 다시 뜬다)
    const flagKey = 'notifShown_' + uid;
    if (sessionStorage.getItem(flagKey)) return;
    sessionStorage.setItem(flagKey, '1');

    const popup = document.getElementById('notifPopup');
    const body = document.getElementById('notifBody');
    const divider = '<hr style="border:none; border-top:1px solid #d8d5cd; margin:10px 0;">';
    body.innerHTML = sections
      .map(lines => lines.map(i => `<div style="margin-bottom:6px;">${i}</div>`).join(''))
      .join(divider);
    popup.style.display = 'block';
  }

  document.getElementById('notifCloseBtn').addEventListener('click', () => {
    document.getElementById('notifPopup').style.display = 'none';
  });

  document.getElementById('logoutBtn').addEventListener('click', async (e) => {
    e.preventDefault();
    clearNotifFlags();
    await logOut();
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
