<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pretendard:wght@400;500&display=swap');
  :root{ --ink:#141414; --paper:#f7f6f3; --line:#d8d5cd; --muted:#8a8578; --green:#3f6b52; --red:#a4453c; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:var(--paper); font-family:'Pretendard', -apple-system, sans-serif; color:var(--ink); }
  header{ padding:28px 48px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .eyebrow{ font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  h1{ font-family:'Cormorant Garamond', serif; font-weight:500; font-size:32px; margin:0; letter-spacing:.01em; }
  .header-right{ display:flex; align-items:center; gap:24px; }
  .header-right a{ font-size:13px; color:var(--muted); text-decoration:none; border-bottom:1px solid var(--muted); cursor:pointer; }
  main{ max-width:1280px; margin:0 auto; padding:40px 48px; }

  .panel{ background:#fff; border:1px solid var(--line); border-radius:6px; padding:20px 22px; margin-bottom:24px; }
  .panel-title{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:16px; }
  .import-help{ font-size:12.5px; color:var(--muted); line-height:1.6; margin-bottom:16px; }

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:20px; }
  .toolbar select{ padding:8px 10px; border:1px solid var(--line); border-radius:4px; font-family:inherit; font-size:13px; background:#fff; }
  .toolbar{ justify-content:space-between; }
  .view-toggle-btn{
    padding:8px 14px; border:1px solid var(--line); background:#fff; color:var(--muted);
    font-family:inherit; font-size:12.5px; cursor:pointer; border-radius:4px;
  }
  .view-toggle-btn.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  .summary-bar{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:24px; }
  .summary-chip{ background:#fff; border:1px solid var(--line); border-radius:6px; padding:14px 20px; font-size:13px; color:var(--muted); flex:1; min-width:160px; }
  .summary-chip b{ color:var(--ink); font-size:19px; display:block; margin-top:4px; }
  .summary-chip.profit b{ color:var(--green); }
  .summary-chip.loss b{ color:var(--red); }

  .quarter-block{ background:#fff; border:1px solid var(--line); border-radius:6px; margin-bottom:16px; overflow:hidden; }
  .quarter-head{ padding:14px 18px; background:#faf9f6; border-bottom:1px solid var(--line); font-size:13.5px; font-weight:500; display:flex; justify-content:space-between; align-items:center; }
  .quarter-head .q-profit{ font-size:13px; }
  .quarter-head .q-profit.profit{ color:var(--green); }
  .quarter-head .q-profit.loss{ color:var(--red); }

  table.month-table{ width:100%; border-collapse:collapse; }
  table.month-table th{ text-align:right; font-size:11px; color:var(--muted); font-weight:500; padding:8px 12px; border-bottom:1px solid var(--line); }
  table.month-table th:first-child{ text-align:left; }
  table.month-table td{ text-align:right; padding:8px 12px; font-size:13px; border-bottom:1px solid var(--line); }
  table.month-table td:first-child{ text-align:left; font-weight:500; }
  table.month-table tr:last-child td{ border-bottom:none; }
  table.month-table tr.total-row td{ font-weight:600; background:#faf9f6; }
  .neg{ color:var(--red); }
  .edit-link{ font-size:11px; color:var(--muted); text-decoration:underline; cursor:pointer; background:none; border:none; padding:0; }

  .edit-form{ padding:16px 18px; background:#fcfbf9; border-top:1px solid var(--line); }
  .edit-form .form-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; align-items:flex-end; }
  .edit-form .field{ display:flex; flex-direction:column; gap:4px; }
  .edit-form label{ font-size:10.5px; color:var(--muted); }
  .edit-form input{ padding:7px 9px; border:1px solid var(--line); border-radius:4px; font-family:inherit; font-size:12.5px; width:130px; }
  .edit-form button{ padding:7px 16px; background:var(--ink); color:var(--paper); border:none; font-size:12px; cursor:pointer; border-radius:4px; }
  .status-line{ font-size:12px; margin-top:6px; min-height:14px; }

  .breakdown-toggle{ font-size:11.5px; color:var(--muted); text-decoration:underline; cursor:pointer; background:none; border:none; padding:0; margin-top:6px; }
  .breakdown-list{ display:none; margin-top:10px; font-size:12px; color:#54514a; }
  .breakdown-list.open{ display:block; }
  .breakdown-list .b-row{ display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed var(--line); }

  .empty{ background:#fff; border:1px solid var(--line); border-radius:6px; padding:36px; text-align:center; color:var(--muted); font-size:13.5px; }

  @media (max-width: 720px) {
    header{ padding:20px !important; flex-wrap:wrap; gap:10px; }
    .header-right{ flex-wrap:wrap; gap:12px !important; }
    main{ padding:24px 16px !important; }
    h1{ font-size:24px !important; }
    input, select{ font-size:16px !important; }
    table.month-table{ font-size:11.5px; }
  }
</style>

<script>
  const salesPurchaseRef = db.collection('quarterlySalesPurchase'); // 문서id = 'YYYY-MM', 매출/매입 수동 입력분

  const SOURCE_COLLECTIONS = [
    { key: 'corporateCards', label: '법인카드' },
    { key: 'utilityItems', label: '공과금' },
    { key: 'insuranceItems', label: '보험' },
    { key: 'taxItems', label: '세금' },
    { key: 'stockItems', label: '주식·배당' },
    { key: 'loanRepaymentItems', label: '이자상환' }
  ];

  // 공과금 항목은 "공과금 관리(utilities.html)" 화면에서 항목별로 켜둔 includeInExpense 값에
  // 따라서만 "일반지출" 자동집계에 포함된다 (수도요금·통신료·임대료 등은 그쪽에서 기본으로 켜져 있고,
  // 전기요금·도시가스·인터넷 등 매입계산서(세금계산서)로 별도 발행되어 "매입" 합계와 중복될 수 있는
  // 항목은 기본으로 꺼져 있음). 항목명을 바꿔도 이 값은 그대로 유지되므로, 이름이 바뀌어서 누락되는
  // 일이 없다 - 정확한 포함 여부는 공과금 관리 화면에서 항목을 펼쳐 확인/변경할 수 있다.
  // includeInExpense 필드는 공과금 관리 화면을 한 번이라도 열어야 자동으로 채워지는 값이라, 그 전까지는
  // (문서에 필드 자체가 아직 없는 상태) 이 항목명 기본값으로라도 판단해서 첫 화면부터 빠짐없이 잡히게 한다.
  const DEFAULT_UTILITY_EXPENSE_CATEGORIES = ['수도요금', '통신료', '임대료', '사무실임차료', '기부금'];

  let expenseByMonth = {};       // { 'YYYY-MM': 합계 } - 순수 지출만
  let expenseBreakdown = {};     // { 'YYYY-MM': [{source, name, amount}] }
  let otherIncomeByMonth = {};   // { 'YYYY-MM': 합계 } - flowType이 '수입'인 항목(예: 전문건설배당)
  let otherIncomeBreakdown = {}; // { 'YYYY-MM': [{source, name, amount}] }
  let salesPurchaseByMonth = {}; // { 'YYYY-MM': {salesTotal/salesSupply/salesTax/purchaseTotal/salesSupply/purchaseTax (세금계산서), cashReceipt*(현금영수증), plainInvoice*(일반계산서)} }
  let activeYear = String(new Date().getFullYear());
  let openBreakdown = new Set();
  let viewMode = 'quarter'; // 'quarter' | 'month'

  function fmtWon(n){ return (Math.round(n) || 0).toLocaleString() + '원'; }
  function esc(s){ return String(s || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
  function parseMoney(el){ return Number(String(el.value || '').replace(/[^\d]/g, '')) || 0; }

  function quarterOfMonth(m){ return Math.floor((m - 1) / 3) + 1; } // 1~3월->1, 4~6월->2 ...

  async function loadExpenses(){
    expenseByMonth = {};
    expenseBreakdown = {};
    otherIncomeByMonth = {};
    otherIncomeBreakdown = {};

    for (const src of SOURCE_COLLECTIONS) {
      // 주식·배당은 회사 손익(영업 활동)과 무관한 항목이라 일반지출/기타수입 자동집계·예상손익 계산에서 제외한다.
      // (매수 등 지출성 항목이든, 배당처럼 수입으로 분류된 항목이든 모두 여기서 걸러진다)
      if (src.key === 'stockItems') continue;
      const snap = await db.collection(src.key).get();
      snap.docs.forEach(doc => {
        const d = doc.data();
        const name = d.name || d.label || d.category || '(이름없음)';
        // 공과금은 항목별로 저장된 includeInExpense 값(공과금 관리 화면의 체크박스)에 따라서만
        // 일반지출에 반영한다 - 세금계산서(매입계산서)로도 발행되는 항목은 "매입" 합계와 중복되므로 보통 꺼둔다.
        // 값이 아직 저장되지 않은 문서(공과금 관리 화면을 아직 한 번도 안 열어본 경우)는 항목명 기본값으로 판단한다.
        if (src.key === 'utilityItems') {
          // "임대료(넉스빌딩)"처럼 뒤에 부연설명이 붙은 이름도 매칭되도록 완전일치 대신 포함 여부로 판단한다.
          const included = d.includeInExpense !== undefined ? (d.includeInExpense === true) : DEFAULT_UTILITY_EXPENSE_CATEGORIES.some(k => (d.category || '').includes(k));
          if (!included) return;
        }
        // flowType이 '수입'인 항목(예: 주식·배당의 전문건설배당)은 우리가 받는 돈이라 지출이 아니라 별도 수입으로 집계
        const isIncome = d.flowType === '수입';
        Object.entries(d.monthly || {}).forEach(([ym, amt]) => {
          const v = Number(amt) || 0;
          if (!v) return;
          if (isIncome) {
            otherIncomeByMonth[ym] = (otherIncomeByMonth[ym] || 0) + v;
            if (!otherIncomeBreakdown[ym]) otherIncomeBreakdown[ym] = [];
            otherIncomeBreakdown[ym].push({ source: src.label, name, amount: v });
          } else {
            expenseByMonth[ym] = (expenseByMonth[ym] || 0) + v;
            if (!expenseBreakdown[ym]) expenseBreakdown[ym] = [];
            expenseBreakdown[ym].push({ source: src.label, name, amount: v });
          }
        });
      });
    }

    // 급여명세서(payslips)는 다른 관리 도구와 달리 { monthly: {...} } 구조가 아니라
    // 사원별/지급일별로 개별 문서가 쌓이는 구조라 별도로 집계한다. 지급액계(공제 전 총지급액)를
    // 지급일이 속한 월의 "일반지출"에 급여로 합산한다.
    const paySnap = await db.collection('payslips').get();
    paySnap.docs.forEach(doc => {
      const d = doc.data();
      const ym = String(d['지급일'] || '').slice(0, 7);
      const v = Number(d['지급액계']) || 0;
      if (!ym || !v) return;
      expenseByMonth[ym] = (expenseByMonth[ym] || 0) + v;
      if (!expenseBreakdown[ym]) expenseBreakdown[ym] = [];
      expenseBreakdown[ym].push({ source: '급여', name: d['사원명'] || '(이름없음)', amount: v });
    });
  }

  async function loadSalesPurchase(){
    salesPurchaseByMonth = {};
    const snap = await salesPurchaseRef.get();
    snap.docs.forEach(doc => { salesPurchaseByMonth[doc.id] = doc.data(); });
  }

  // 매출/매입은 증빙 서류 종류별로 따로 입력받는다: 세금계산서(기존 필드, 접두사 없음 - 이미 저장된
  // 데이터와 호환되도록 그대로 둠) · 현금영수증(cashReceipt) · 일반계산서(plainInvoice).
  // "총매출/총매입"에는 셋을 모두 합산해서 반영한다.
  const SP_DOC_TYPES = [
    { prefix: '', label: '세금계산서' },
    { prefix: 'cashReceipt', label: '현금영수증' },
    { prefix: 'plainInvoice', label: '일반계산서' }
  ];
  // 필드/입력칸 id 키를 만드는 규칙을 한 곳에 모아둔다 - prefix가 없으면 기존 필드명(salesTotal 등)
  // 그대로, prefix가 있으면 camelCase로 이어붙인다(cashReceiptSalesTotal 등).
  function spKey(prefix, dir, metric){
    const Dir = dir[0].toUpperCase() + dir.slice(1);
    return prefix ? `${prefix}${Dir}${metric}` : `${dir}${metric}`;
  }
  const SP_FIELD_KEYS = SP_DOC_TYPES.flatMap(t => ['sales', 'purchase'].flatMap(dir =>
    ['Total', 'Supply', 'Tax'].map(metric => spKey(t.prefix, dir, metric))
  ));

  function spFor(ym){
    const raw = salesPurchaseByMonth[ym] || {};
    const sp = {};
    SP_FIELD_KEYS.forEach(k => { sp[k] = Number(raw[k]) || 0; });
    return sp;
  }

  // 증빙 종류 상관없이 합산한 총매출/총매입 (연/분기/월 집계와 예상손익 계산에 사용)
  function spSalesAll(sp){ return SP_DOC_TYPES.reduce((s, t) => s + (sp[spKey(t.prefix, 'sales', 'Total')] || 0), 0); }
  function spPurchaseAll(sp){ return SP_DOC_TYPES.reduce((s, t) => s + (sp[spKey(t.prefix, 'purchase', 'Total')] || 0), 0); }

  async function loadAll(){
    await Promise.all([loadExpenses(), loadSalesPurchase()]);
    renderAll();
  }

  function getAllYears(){
    const years = new Set();
    Object.keys(expenseByMonth).forEach(ym => years.add(ym.slice(0, 4)));
    Object.keys(salesPurchaseByMonth).forEach(ym => years.add(ym.slice(0, 4)));
    years.add(String(new Date().getFullYear()));
    return [...years].sort().reverse();
  }

  function renderAll(){
    const main = document.getElementById('mainArea');
    const years = getAllYears();

    main.innerHTML = `
      <div class="panel" style="padding:14px 18px;">
        <div class="import-help" style="margin-bottom:0;">
          "일반지출"은 법인카드·공과금·보험·세금·이자상환·급여명세서 데이터를 매달 자동으로 합산한 값이에요 (직접 입력할 필요 없음).
          공과금은 항목별로 포함 여부가 정해져 있어요(기본: 수도요금·통신료·임대료만 포함, 전기요금·도시가스·인터넷 등은 매입계산서와 중복될 수 있어 제외) - 공과금 관리 화면에서 항목을 펼치면 "일반지출 자동집계" 체크박스로 직접 켜고 끌 수 있어요.
          주식·배당은 회사 영업 손익과 무관한 항목이라 일반지출/기타수입 자동집계·예상손익 계산에서 제외돼요.
          "매출/매입"은 부가세 신고 자료를 바탕으로 각 월 항목의 "입력" 버튼을 눌러 채워주세요 - 세금계산서·현금영수증·일반계산서 세 증빙별로 각각 입력하며, 화면의 매출/매입 합계에는 셋을 모두 더한 값이 표시돼요. 각 총합계(VAT포함)만 넣으면 공급가액·세액은 자동 계산되고, 실제 서류 금액과 다르면 직접 수정할 수 있어요.
        </div>
      </div>
      <div class="summary-bar" id="summaryBar"></div>
      <div class="panel" style="padding:14px 18px;">
        <div class="toolbar" style="margin-bottom:0;">
          <select id="yearFilter">${years.map(y => `<option value="${y}" ${y === activeYear ? 'selected' : ''}>${y}년</option>`).join('')}</select>
          <div style="display:flex; gap:6px;">
            <button type="button" class="view-toggle-btn ${viewMode === 'quarter' ? 'active' : ''}" id="viewQuarterBtn">분기별</button>
            <button type="button" class="view-toggle-btn ${viewMode === 'month' ? 'active' : ''}" id="viewMonthBtn">월별</button>
          </div>
        </div>
      </div>
      <div class="panel" style="padding:18px;">
        <div class="panel-title">매출·매입·일반지출 추이</div>
        <canvas id="overviewChart" height="90"></canvas>
        <div id="overviewChartError" style="display:none; font-size:12.5px; color:var(--muted); padding:20px 0; text-align:center;">
          차트 라이브러리를 불러오지 못해 그래프를 표시할 수 없습니다. 인터넷 연결을 확인하거나 페이지를 새로고침해보세요. (계속되면 관리자에게 문의해주세요)
        </div>
      </div>
      <div id="quarterList"></div>
    `;

    document.getElementById('yearFilter').addEventListener('change', (e) => { activeYear = e.target.value; renderAll(); });
    document.getElementById('viewQuarterBtn').addEventListener('click', () => { viewMode = 'quarter'; renderAll(); });
    document.getElementById('viewMonthBtn').addEventListener('click', () => { viewMode = 'month'; renderAll(); });

    renderSummary();
    renderChart();
    if (viewMode === 'quarter') renderQuarters(); else renderMonthsFlat();
  }

  function yearTotals(year){
    let sales = 0, purchase = 0, expense = 0, otherIncome = 0;
    for (let m = 1; m <= 12; m++) {
      const ym = `${year}-${String(m).padStart(2, '0')}`;
      sales += spSalesAll(spFor(ym));
      purchase += spPurchaseAll(spFor(ym));
      expense += expenseByMonth[ym] || 0;
      otherIncome += otherIncomeByMonth[ym] || 0;
    }
    return { sales, purchase, expense, otherIncome, profit: sales - purchase - expense + otherIncome };
  }

  function renderSummary(){
    const bar = document.getElementById('summaryBar');
    const t = yearTotals(activeYear);
    const profitClass = t.profit >= 0 ? 'profit' : 'loss';

    bar.innerHTML = `
      <div class="summary-chip">${activeYear}년 총매출<b>${fmtWon(t.sales)}</b></div>
      <div class="summary-chip">${activeYear}년 총매입<b>${fmtWon(t.purchase)}</b></div>
      <div class="summary-chip">${activeYear}년 일반지출 (자동집계)<b>${fmtWon(t.expense)}</b></div>
      <div class="summary-chip">${activeYear}년 기타수입 (자동집계)<b>${fmtWon(t.otherIncome)}</b></div>
      <div class="summary-chip ${profitClass}">${activeYear}년 예상손익<b>${fmtWon(t.profit)}</b></div>
    `;
  }

  function buildMonthRow(ym, label){
    const sp = spFor(ym);
    const exp = expenseByMonth[ym] || 0;
    const inc = otherIncomeByMonth[ym] || 0;
    const salesTotal = spSalesAll(sp);
    const purchaseTotal = spPurchaseAll(sp);
    const monthProfit = salesTotal - purchaseTotal - exp + inc;

    const expBreakdown = expenseBreakdown[ym];
    const incBreakdown = otherIncomeBreakdown[ym];
    // 매출/매입도 세금계산서·현금영수증·일반계산서 중 2가지 이상 입력된 달만 "내역보기"로 구성을 보여준다.
    const spBreakdownRows = SP_DOC_TYPES
      .map(t => ({ label: t.label, sales: sp[spKey(t.prefix, 'sales', 'Total')], purchase: sp[spKey(t.prefix, 'purchase', 'Total')] }))
      .filter(x => x.sales || x.purchase);
    const spBreakdown = spBreakdownRows.length > 1 ? spBreakdownRows : null;

    return `
      <tr>
        <td>${label}</td>
        <td>
          ${fmtWon(salesTotal)}
          ${spBreakdown ? `<button class="breakdown-toggle" data-toggle-breakdown="sp-${ym}">${openBreakdown.has('sp-' + ym) ? '숨기기' : '내역보기'}</button>` : ''}
        </td>
        <td>${fmtWon(purchaseTotal)}</td>
        <td>
          ${fmtWon(exp)}
          ${expBreakdown ? `<button class="breakdown-toggle" data-toggle-breakdown="exp-${ym}">${openBreakdown.has('exp-' + ym) ? '숨기기' : '내역보기'}</button>` : ''}
        </td>
        <td>
          ${fmtWon(inc)}
          ${incBreakdown ? `<button class="breakdown-toggle" data-toggle-breakdown="inc-${ym}">${openBreakdown.has('inc-' + ym) ? '숨기기' : '내역보기'}</button>` : ''}
        </td>
        <td class="${monthProfit < 0 ? 'neg' : ''}">${fmtWon(monthProfit)}</td>
        <td><button class="edit-link" data-edit-month="${ym}">입력</button></td>
      </tr>
      ${spBreakdown ? `
        <tr style="display:${openBreakdown.has('sp-' + ym) ? 'table-row' : 'none'};" data-breakdown-row="sp-${ym}">
          <td colspan="7">
            <div class="breakdown-list open">
              <div style="font-weight:600; margin-bottom:4px;">매출·매입 증빙별 내역</div>
              ${spBreakdown.map(b => `<div class="b-row"><span>${esc(b.label)}</span><span>매출 ${fmtWon(b.sales)} · 매입 ${fmtWon(b.purchase)}</span></div>`).join('')}
            </div>
          </td>
        </tr>
      ` : ''}
      ${expBreakdown ? `
        <tr style="display:${openBreakdown.has('exp-' + ym) ? 'table-row' : 'none'};" data-breakdown-row="exp-${ym}">
          <td colspan="7">
            <div class="breakdown-list open">
              <div style="font-weight:600; margin-bottom:4px;">일반지출 내역</div>
              ${expBreakdown.map(b => `<div class="b-row"><span>${esc(b.source)} · ${esc(b.name)}</span><span>${fmtWon(b.amount)}</span></div>`).join('')}
            </div>
          </td>
        </tr>
      ` : ''}
      ${incBreakdown ? `
        <tr style="display:${openBreakdown.has('inc-' + ym) ? 'table-row' : 'none'};" data-breakdown-row="inc-${ym}">
          <td colspan="7">
            <div class="breakdown-list open">
              <div style="font-weight:600; margin-bottom:4px;">기타수입 내역</div>
              ${incBreakdown.map(b => `<div class="b-row"><span>${esc(b.source)} · ${esc(b.name)}</span><span>${fmtWon(b.amount)}</span></div>`).join('')}
            </div>
          </td>
        </tr>
      ` : ''}
      <tr style="display:none;" data-edit-row="${ym}"></tr>
    `;
  }

  function tableHead(){
    return `<thead><tr><th>월</th><th>매출</th><th>매입</th><th>일반지출(자동)</th><th>기타수입(자동)</th><th>월손익</th><th></th></tr></thead>`;
  }

  function bindRowEvents(){
    document.querySelectorAll('[data-toggle-breakdown]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.toggleBreakdown;
        if (openBreakdown.has(key)) openBreakdown.delete(key); else openBreakdown.add(key);
        if (viewMode === 'quarter') renderQuarters(); else renderMonthsFlat();
      });
    });
    document.querySelectorAll('[data-edit-month]').forEach(btn => {
      btn.addEventListener('click', () => openEditForm(btn.dataset.editMonth));
    });
  }

  function renderQuarters(){
    const listEl = document.getElementById('quarterList');
    let html = '';
    for (let q = 1; q <= 4; q++) {
      const months = [(q - 1) * 3 + 1, (q - 1) * 3 + 2, (q - 1) * 3 + 3];
      let qSales = 0, qPurchase = 0, qExpense = 0, qIncome = 0;
      const rowsHtml = months.map(m => {
        const ym = `${activeYear}-${String(m).padStart(2, '0')}`;
        const sp = spFor(ym);
        qSales += spSalesAll(sp);
        qPurchase += spPurchaseAll(sp);
        qExpense += expenseByMonth[ym] || 0;
        qIncome += otherIncomeByMonth[ym] || 0;
        return buildMonthRow(ym, `${m}월`);
      }).join('');
      const qProfit = qSales - qPurchase - qExpense + qIncome;

      html += `
        <div class="quarter-block">
          <div class="quarter-head">
            <span>${activeYear}년 ${q}분기 (${months[0]}~${months[2]}월)</span>
            <span class="q-profit ${qProfit >= 0 ? 'profit' : 'loss'}">예상손익 ${fmtWon(qProfit)}</span>
          </div>
          <table class="month-table">
            ${tableHead()}
            <tbody>
              ${rowsHtml}
              <tr class="total-row">
                <td>분기 합계</td>
                <td>${fmtWon(qSales)}</td>
                <td>${fmtWon(qPurchase)}</td>
                <td>${fmtWon(qExpense)}</td>
                <td>${fmtWon(qIncome)}</td>
                <td class="${qProfit < 0 ? 'neg' : ''}">${fmtWon(qProfit)}</td>
                <td></td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }
    listEl.innerHTML = html;
    bindRowEvents();
  }

  function renderMonthsFlat(){
    const listEl = document.getElementById('quarterList');
    const t = yearTotals(activeYear);
    const rowsHtml = Array.from({ length: 12 }, (_, i) => i + 1).map(m => {
      const ym = `${activeYear}-${String(m).padStart(2, '0')}`;
      return buildMonthRow(ym, `${activeYear}-${String(m).padStart(2, '0')}`);
    }).join('');

    listEl.innerHTML = `
      <div class="quarter-block">
        <div class="quarter-head">
          <span>${activeYear}년 전체 (월별)</span>
          <span class="q-profit ${t.profit >= 0 ? 'profit' : 'loss'}">연간 예상손익 ${fmtWon(t.profit)}</span>
        </div>
        <table class="month-table">
          ${tableHead()}
          <tbody>
            ${rowsHtml}
            <tr class="total-row">
              <td>연간 합계</td>
              <td>${fmtWon(t.sales)}</td>
              <td>${fmtWon(t.purchase)}</td>
              <td>${fmtWon(t.expense)}</td>
              <td>${fmtWon(t.otherIncome)}</td>
              <td class="${t.profit < 0 ? 'neg' : ''}">${fmtWon(t.profit)}</td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </div>
    `;
    bindRowEvents();
  }

  let overviewChartInstance = null;
  function renderChart(){
    const canvas = document.getElementById('overviewChart');
    if (!canvas) return;
    const errorEl = document.getElementById('overviewChartError');
    if (typeof Chart === 'undefined') {
      // Chart.js CDN 로딩 실패 시 빈 화면으로 남기지 않고 원인을 바로 알 수 있게 안내 문구를 보여준다.
      canvas.style.display = 'none';
      if (errorEl) errorEl.style.display = 'block';
      return;
    }
    canvas.style.display = '';
    if (errorEl) errorEl.style.display = 'none';

    let labels, salesData, purchaseData, expenseData, incomeData, profitData;
    if (viewMode === 'quarter') {
      labels = ['1분기', '2분기', '3분기', '4분기'];
      salesData = []; purchaseData = []; expenseData = []; incomeData = []; profitData = [];
      for (let q = 1; q <= 4; q++) {
        let s = 0, p = 0, e = 0, inc = 0;
        for (let i = 0; i < 3; i++) {
          const m = (q - 1) * 3 + i + 1;
          const ym = `${activeYear}-${String(m).padStart(2, '0')}`;
          s += spSalesAll(spFor(ym));
          p += spPurchaseAll(spFor(ym));
          e += expenseByMonth[ym] || 0;
          inc += otherIncomeByMonth[ym] || 0;
        }
        salesData.push(s); purchaseData.push(p); expenseData.push(e); incomeData.push(inc);
        // 화면 상단/분기별 카드에 쓰는 예상손익 계산식(매출-매입-일반지출+기타수입)과 동일하게 맞춤
        profitData.push(s - p - e + inc);
      }
    } else {
      labels = Array.from({ length: 12 }, (_, i) => `${i + 1}월`);
      salesData = []; purchaseData = []; expenseData = []; incomeData = []; profitData = [];
      for (let m = 1; m <= 12; m++) {
        const ym = `${activeYear}-${String(m).padStart(2, '0')}`;
        const s = spSalesAll(spFor(ym));
        const p = spPurchaseAll(spFor(ym));
        const e = expenseByMonth[ym] || 0;
        const inc = otherIncomeByMonth[ym] || 0;
        salesData.push(s);
        purchaseData.push(p);
        expenseData.push(e);
        incomeData.push(inc);
        profitData.push(s - p - e + inc);
      }
    }

    if (overviewChartInstance) overviewChartInstance.destroy();
    overviewChartInstance = new Chart(canvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: '매출', data: salesData, backgroundColor: '#3f6b52' },
          { label: '매입', data: purchaseData, backgroundColor: '#a4453c' },
          { label: '일반지출', data: expenseData, backgroundColor: '#8a8578' },
          { label: '기타수입', data: incomeData, backgroundColor: '#c9a24b' },
          { label: '예상손익', data: profitData, backgroundColor: '#141414' }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom', labels: { font: { family: 'Pretendard' } } } },
        scales: {
          y: { ticks: { callback: (v) => (v / 10000).toLocaleString() + '만' } }
        }
      }
    });
  }

  // 매출/매입 입력 폼: 세금계산서·현금영수증·일반계산서 세 구획을 SP_DOC_TYPES 기준으로 똑같은
  // 모양(매출/매입 × 총합계·공급가액·세액)으로 반복 생성한다.
  function spSectionHtml(docType, sp, ym){
    const val = (k) => sp[k] ? sp[k].toLocaleString('ko-KR') : '';
    const kSalesTotal = spKey(docType.prefix, 'sales', 'Total');
    const kSalesSupply = spKey(docType.prefix, 'sales', 'Supply');
    const kSalesTax = spKey(docType.prefix, 'sales', 'Tax');
    const kPurchaseTotal = spKey(docType.prefix, 'purchase', 'Total');
    const kPurchaseSupply = spKey(docType.prefix, 'purchase', 'Supply');
    const kPurchaseTax = spKey(docType.prefix, 'purchase', 'Tax');
    return `
      <div style="font-size:12px; font-weight:600; color:var(--muted); margin:14px 0 6px; ${docType.prefix ? 'border-top:1px solid var(--line); padding-top:14px;' : ''}">${docType.label}</div>
      <div class="form-row">
        <div class="field"><label>매출 총합계(VAT포함)</label><input type="text" inputmode="numeric" class="money-in" id="sp-${kSalesTotal}-${ym}" value="${val(kSalesTotal)}"></div>
        <div class="field"><label>매출 공급가액</label><input type="text" inputmode="numeric" class="money-in" id="sp-${kSalesSupply}-${ym}" value="${val(kSalesSupply)}"></div>
        <div class="field"><label>매출 세액</label><input type="text" inputmode="numeric" class="money-in" id="sp-${kSalesTax}-${ym}" value="${val(kSalesTax)}"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>매입 총합계(VAT포함)</label><input type="text" inputmode="numeric" class="money-in" id="sp-${kPurchaseTotal}-${ym}" value="${val(kPurchaseTotal)}"></div>
        <div class="field"><label>매입 공급가액</label><input type="text" inputmode="numeric" class="money-in" id="sp-${kPurchaseSupply}-${ym}" value="${val(kPurchaseSupply)}"></div>
        <div class="field"><label>매입 세액</label><input type="text" inputmode="numeric" class="money-in" id="sp-${kPurchaseTax}-${ym}" value="${val(kPurchaseTax)}"></div>
      </div>
    `;
  }

  function openEditForm(ym){
    const row = document.querySelector(`[data-edit-row="${ym}"]`);
    if (!row) return;
    const sp = spFor(ym);
    row.style.display = 'table-row';
    row.innerHTML = `
      <td colspan="7">
        <div class="edit-form" style="margin:0; border:none; background:none; padding:10px 0;">
          ${SP_DOC_TYPES.map(t => spSectionHtml(t, sp, ym)).join('')}
          <div style="margin-top:14px; display:flex; gap:8px;">
            <button id="sp-save-${ym}">저장</button>
            <button id="sp-cancel-${ym}" style="background:#fff; color:var(--ink); border:1px solid var(--line);">취소</button>
          </div>
          <div class="status-line" id="sp-status-${ym}"></div>
        </div>
      </td>
    `;
    document.getElementById(`sp-save-${ym}`).addEventListener('click', () => saveSalesPurchase(ym));
    document.getElementById(`sp-cancel-${ym}`).addEventListener('click', () => { row.style.display = 'none'; row.innerHTML = ''; });
  }

  async function saveSalesPurchase(ym){
    const statusEl = document.getElementById(`sp-status-${ym}`);
    const data = {};
    SP_FIELD_KEYS.forEach(k => { data[k] = parseMoney(document.getElementById(`sp-${k}-${ym}`)); });
    try {
      await salesPurchaseRef.doc(ym).set(data);
      await loadAll();
    } catch (err) {
      statusEl.style.color = 'var(--red)';
      statusEl.textContent = '저장 실패: ' + err.message;
    }
  }

  // 금액 입력칸 실시간 콤마 포맷팅
  document.addEventListener('input', (e) => {
    if (!e.target.classList || !e.target.classList.contains('money-in')) return;
    const el = e.target;
    const cursorFromEnd = el.value.length - el.selectionStart;
    const digits = el.value.replace(/[^\d]/g, '');
    el.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
    const pos = Math.max(0, el.value.length - cursorFromEnd);
    el.setSelectionRange(pos, pos);
  });

  // 매출/매입 "총합계(VAT포함)" 입력 시 공급가액·세액을 부가세 10% 기준으로 자동 계산해준다
  // (공급가액 = 총합계 / 1.1 반올림, 세액 = 총합계 - 공급가액). 자동 계산 후에도 실제 계산서와
  // 다르면 공급가액/세액 칸을 직접 수정할 수 있다 (이 리스너는 총합계 칸에만 반응하므로
  // 공급가액/세액을 직접 고쳐도 값이 되돌아가지 않는다).
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (!el.id) return;
    // sp-salesTotal-YYYY-MM, sp-cashReceiptSalesTotal-YYYY-MM 등 세 증빙 종류 모두 공통으로 처리
    const m = el.id.match(/^sp-(.+)Total-(.+)$/);
    if (!m) return;
    const [, base, ym] = m;
    const total = parseMoney(el);
    const supplyEl = document.getElementById(`sp-${base}Supply-${ym}`);
    const taxEl = document.getElementById(`sp-${base}Tax-${ym}`);
    if (!supplyEl || !taxEl) return;
    if (!total) { supplyEl.value = ''; taxEl.value = ''; return; }
    const supply = Math.round(total / 1.1);
    const tax = total - supply;
    supplyEl.value = supply.toLocaleString('ko-KR');
    taxEl.value = tax.toLocaleString('ko-KR');
  });

  auth.onAuthStateChanged((user) => {
    if (user) loadAll();
  });
</script>
</body>
</html>
