<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회계현황 | NUCKS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pretendard:wght@400;500&display=swap');

  :root{
    --ink:#141414;
    --paper:#f7f6f3;
    --line:#d8d5cd;
    --muted:#8a8578;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--paper);
    font-family:'Pretendard', -apple-system, sans-serif; color:var(--ink);
  }
  header{
    padding:28px 48px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .eyebrow{
    font-size:11px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--muted); margin-bottom:6px;
  }
  h1{
    font-family:'Cormorant Garamond', serif; font-weight:500;
    font-size:32px; margin:0; letter-spacing:.01em;
  }
  .header-right{ display:flex; align-items:center; gap:24px; }
  .header-right a{
    font-size:13px; color:var(--muted); text-decoration:none;
    border-bottom:1px solid var(--muted); cursor:pointer;
  }
  main{ max-width:1100px; margin:0 auto; padding:40px 48px; }

  .meta-bar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:20px; font-size:13px; color:var(--muted);
  }
  .meta-bar .upload-link{
    color:var(--ink); text-decoration:none; border-bottom:1px solid var(--ink);
  }

  .dashboard-frame-wrap{
    border:1px solid var(--line); border-radius:6px; overflow:hidden;
    background:#fff;
  }
  iframe{
    width:100%; height:75vh; border:none; display:block;
  }

  .empty{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    padding:48px; text-align:center; color:var(--muted); font-size:14px; line-height:1.7;
  }
  .empty a{ color:var(--ink); border-bottom:1px solid var(--ink); text-decoration:none; }

  .history{ margin-top:32px; }
  .history-title{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); margin-bottom:14px;
  }
  table{ width:100%; border-collapse:collapse; }
  th{
    text-align:left; font-size:12px; color:var(--muted); font-weight:500;
    padding:10px 12px; border-bottom:1px solid var(--line);
  }
  td{ padding:12px; font-size:13.5px; border-bottom:1px solid var(--line); }
  .dl-link{ color:var(--ink); text-decoration:none; border-bottom:1px solid var(--ink); }
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">NUCKS · Secret Mode</div>
    <h1>회계현황 대시보드</h1>
  </div>
  <div class="header-right">
    <a href="index.html">Home</a>
    <a href="#" id="logoutBtn">Logout</a>
  </div>
</header>

<main>
  <div class="meta-bar">
    <span id="lastUpdated"></span>
    <a class="upload-link" href="files.html">파일함에서 업데이트하기 →</a>
  </div>

  <div id="content"></div>

  <div class="history" id="historyWrap" style="display:none;">
    <div class="history-title">이전 업로드 기록</div>
    <table>
      <thead>
        <tr><th>파일명</th><th>업로더</th><th>날짜</th><th>다운로드</th></tr>
      </thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
  // 관리자만 접근 가능
  requireRole(['admin']);

  const CATEGORY = '회계현황'; // files.html에서 이 카테고리로 올린 파일을 자동으로 찾음

  auth.onAuthStateChanged((user) => {
    if (user) loadDashboard();
  });

  async function loadDashboard() {
    const snapshot = await db.collection('files')
      .where('category', '==', CATEGORY)
      .orderBy('uploadedAt', 'desc')
      .get();

    const files = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    const contentEl = document.getElementById('content');
    const lastUpdatedEl = document.getElementById('lastUpdated');

    if (files.length === 0) {
      contentEl.innerHTML = `
        <div class="empty">
          아직 등록된 회계현황 파일이 없습니다.<br>
          <a href="files.html">파일함</a>에서 카테고리를 <b>"${CATEGORY}"</b>로 지정해 대시보드(HTML) 또는 엑셀 파일을 업로드해 주세요.
        </div>
      `;
      lastUpdatedEl.textContent = '';
      return;
    }

    const latest = files[0];
    const dateStr = latest.uploadedAt?.toDate ? latest.uploadedAt.toDate().toLocaleString('ko-KR') : '-';
    lastUpdatedEl.textContent = `최근 업데이트: ${dateStr} · ${latest.uploaderEmail || ''}`;

    const isHtml = /\.html?$/i.test(latest.name);

    if (isHtml) {
      contentEl.innerHTML = `<div class="dashboard-frame-wrap"><iframe src="${latest.url}"></iframe></div>`;
    } else {
      // HTML이 아닌 파일(엑셀 등)이면 미리보기 대신 다운로드 안내
      contentEl.innerHTML = `
        <div class="empty">
          최신 파일이 브라우저에서 바로 보여줄 수 없는 형식(${latest.name})입니다.<br>
          <a href="${latest.url}" target="_blank" rel="noopener">여기를 눌러 다운로드</a> 후 확인해 주세요.<br>
          (자동 미리보기를 원하시면 HTML 형식의 대시보드 파일로 업로드해 주세요.)
        </div>
      `;
    }

    // 이전 업로드 기록
    if (files.length > 1) {
      const historyWrap = document.getElementById('historyWrap');
      const historyBody = document.getElementById('historyBody');
      historyWrap.style.display = 'block';
      historyBody.innerHTML = '';

      files.slice(1).forEach(f => {
        const d = f.uploadedAt?.toDate ? f.uploadedAt.toDate().toLocaleDateString('ko-KR') : '-';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${f.name}</td>
          <td>${f.uploaderEmail || ''}</td>
          <td>${d}</td>
          <td><a class="dl-link" href="${f.url}" target="_blank" rel="noopener">다운로드</a></td>
        `;
        historyBody.appendChild(tr);
      });
    }
  }

  document.getElementById('logoutBtn').addEventListener('click', async (e) => {
    e.preventDefault();
    await logOut();
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
