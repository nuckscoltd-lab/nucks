<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141414">
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
<title>급여명세서 | NUCKS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pretendard:wght@400;500&display=swap');

  :root{
    --ink:#141414;
    --paper:#f7f6f3;
    --line:#d8d5cd;
    --muted:#8a8578;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--paper);
    font-family:'Pretendard', -apple-system, sans-serif; color:var(--ink);
  }
  header{
    padding:28px 48px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .eyebrow{
    font-size:11px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--muted); margin-bottom:6px;
  }
  h1{
    font-family:'Cormorant Garamond', serif; font-weight:500;
    font-size:32px; margin:0; letter-spacing:.01em;
  }
  .header-right{ display:flex; align-items:center; gap:24px; }
  .header-right a{
    font-size:13px; color:var(--muted); text-decoration:none;
    border-bottom:1px solid var(--muted); cursor:pointer;
  }
  main{ max-width:960px; margin:0 auto; padding:40px 48px; }

  .write-panel{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    padding:28px; margin-bottom:36px;
  }
  .panel-title{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); margin-bottom:18px;
  }
  .section-label{
    font-size:12.5px; font-weight:600; margin:20px 0 12px; color:var(--ink);
  }
  .section-label:first-of-type{ margin-top:0; }
  .grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:12px;
  }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:11px; color:var(--muted); }
  .field input, .field select{
    padding:8px 9px; border:1px solid var(--line); border-radius:4px;
    font-family:inherit; font-size:13px; background:#fff;
  }
  .sum-box{
    display:flex; gap:20px; margin-top:20px; padding:16px; background:var(--paper);
    border-radius:4px; flex-wrap:wrap;
  }
  .sum-item{ font-size:13px; color:var(--muted); }
  .sum-item b{ display:block; font-size:16px; color:var(--ink); margin-top:2px; }
  .submit-btn{
    margin-top:20px; padding:10px 24px; background:var(--ink); color:var(--paper);
    border:none; font-size:12.5px; letter-spacing:.05em; text-transform:uppercase;
    cursor:pointer; border-radius:4px;
  }
  .submit-status{ font-size:13px; margin-top:10px; min-height:18px; }

  .toolbar{ display:flex; gap:12px; margin-bottom:16px; align-items:center; }
  .toolbar select{
    padding:7px 10px; border:1px solid var(--line); border-radius:4px;
    font-family:inherit; font-size:13px; background:#fff;
  }
  .summary-bar{
    display:flex; gap:20px; margin-bottom:20px; flex-wrap:wrap;
  }
  .summary-chip{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    padding:14px 20px; font-size:13px; color:var(--muted);
  }
  .summary-chip b{ color:var(--ink); font-size:16px; display:block; margin-top:4px; }
  table{ width:100%; border-collapse:collapse; }
  th{
    text-align:left; font-size:11.5px; color:var(--muted); font-weight:500;
    padding:9px 10px; border-bottom:1px solid var(--line);
  }
  td{ padding:11px 10px; font-size:13.5px; border-bottom:1px solid var(--line); }
  .row-btn{
    font-size:12px; background:none; border:none; cursor:pointer;
    text-decoration:underline; color:#a4453c;
  }
  .print-btn{
    font-size:12px; background:none; border:none; cursor:pointer;
    text-decoration:underline; color:var(--ink); margin-right:10px;
  }
  .empty{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    padding:32px; text-align:center; color:var(--muted); font-size:13.5px;
  }

  /* 인쇄 전용 영역 - 화면에서는 숨겨두고 인쇄할 때만 노출 */
  #printArea{ display:none; }
  @media print {
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{
      display:block !important; position:absolute; top:0; left:0; width:100%; padding:36px;
    }
  }
  .print-slip{ font-family:'Pretendard', -apple-system, sans-serif; color:#141414; }
  .print-slip .p-header{ text-align:center; margin-bottom:26px; }
  .print-slip .p-company{ font-size:12.5px; color:#666; margin-bottom:10px; }
  .print-slip .p-title{ font-size:25px; font-weight:700; letter-spacing:.2em; }
  .print-slip .p-info-table{ width:100%; border-collapse:collapse; margin-bottom:22px; }
  .print-slip .p-info-table th, .print-slip .p-info-table td{
    border:1px solid #333; padding:9px 12px; font-size:13.5px;
  }
  .print-slip .p-info-table th{ background:#f2f0eb; width:90px; text-align:center; }
  .print-slip .p-pay-table{ width:100%; border-collapse:collapse; margin-bottom:16px; }
  .print-slip .p-pay-table th, .print-slip .p-pay-table td{
    border:1px solid #333; padding:8px 12px; font-size:13px;
  }
  .print-slip .p-pay-table th{ background:#f2f0eb; text-align:left; }
  .print-slip .p-pay-table td{ text-align:right; }
  .print-slip .p-net-box{
    text-align:right; font-size:16px; font-weight:700; margin:16px 0 8px;
  }
  .print-slip .p-date{ text-align:right; font-size:12.5px; color:#555; margin-top:30px; }
  .print-slip .p-sign{
    display:flex; justify-content:flex-end; align-items:center; gap:6px; margin-top:10px;
  }
  .print-slip .p-sign span{ font-size:14px; }
  .print-slip .p-stamp{ width:64px; height:64px; margin-left:-10px; opacity:.92; }
  @media (max-width: 640px) {
    header{ padding:20px !important; flex-wrap:wrap; gap:10px; }
    .header-right{ flex-wrap:wrap; gap:12px !important; }
    main{ padding:20px 14px !important; }
    h1{ font-size:24px !important; }
    .write-panel{ padding:18px 16px !important; }
    .field{ width:100%; }
    input, select, textarea{ font-size:16px !important; width:100% !important; box-sizing:border-box; }
    .field input, .field select{ padding:10px 12px !important; }
    .grid{ grid-template-columns:1fr !important; gap:14px !important; }
    .sum-box{ flex-direction:column; gap:12px !important; }
    .summary-bar{ flex-direction:column; gap:10px !important; }
    .toolbar{ flex-direction:column; align-items:stretch !important; gap:10px !important; }

    /* 넓은 표는 가로 스크롤 대신 카드형으로 세로 전환 */
    table{ min-width:0 !important; }
    thead{ display:none; }
    table, tbody, tr, td{ display:block; width:100%; }
    tr{
      border:1px solid var(--line); border-radius:6px;
      margin-bottom:12px; padding:10px 14px; background:#fff;
    }
    td{
      border:none !important; padding:6px 0 !important; white-space:normal !important;
    }
    td[data-label]::before{
      content:attr(data-label);
      display:block; font-size:11px; color:var(--muted); margin-bottom:2px;
    }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">NUCKS · Secret Mode</div>
    <h1>급여명세서</h1>
  </div>
  <div class="header-right">
    <a href="index.html">Home</a>
    <a href="#" id="logoutBtn">Logout</a>
  </div>
</header>

<main>
  <!-- 급여대장 CSV 가져오기 (관리자 전용) -->
  <div class="write-panel" id="importPanel" style="display:none;">
    <div class="panel-title">급여대장 CSV/엑셀 가져오기</div>
    <div style="font-size:12.5px; color:var(--muted); margin-bottom:14px; line-height:1.6;">
      대상: 이연경, 손영화, 윤성원, 윤상원, 김의석 · 기간: 2025-11-01 이후만 자동 필터링됩니다.
    </div>
    <input type="file" id="importFile" accept=".csv,.xlsx,.xls">
    <button class="submit-btn" id="importParseBtn" style="margin-left:8px;">파일 분석</button>
    <div id="importPreview" style="margin-top:12px; font-size:13px;"></div>
    <button class="submit-btn" id="importRunBtn" style="display:none; margin-top:12px;">가져오기 실행</button>
    <div id="importResult" style="margin-top:10px; font-size:13px;"></div>
  </div>

  <div class="write-panel" id="adminOnlyPanel">
    <div class="panel-title">급여명세서 작성</div>
    <div id="selectionBanner" style="display:none; background:#fbe4e2; color:#a4453c; font-size:12.5px; padding:10px 14px; border-radius:4px; margin-bottom:16px;">
      <span id="selectionBannerText"></span>
      <button id="clearSelectionBtn" style="margin-left:10px; background:none; border:none; color:#a4453c; text-decoration:underline; cursor:pointer; font-size:12.5px;">선택 해제</button>
    </div>

    <div class="grid">
      <div class="field">
        <label for="f-employee">사원 선택</label>
        <select id="f-employee"></select>
      </div>
      <div class="field">
        <label for="f-payDate">지급일</label>
        <input type="date" id="f-payDate">
      </div>
      <div class="field">
        <label for="f-department">부서명</label>
        <input type="text" id="f-department">
      </div>
      <div class="field">
        <label for="f-position">직급</label>
        <input type="text" id="f-position">
      </div>
    </div>

    <div class="section-label">지급 항목</div>
    <div class="grid">
      <div class="field"><label>기본급</label><input type="number" class="pay-input" id="p-기본급" value="0"></div>
      <div class="field"><label>식대</label><input type="number" class="pay-input" id="p-식대" value="0"></div>
      <div class="field"><label>자기계발비</label><input type="number" class="pay-input" id="p-자기계발비" value="0"></div>
      <div class="field"><label>차량유지비</label><input type="number" class="pay-input" id="p-차량유지비" value="0"></div>
      <div class="field"><label>기타</label><input type="number" class="pay-input" id="p-기타" value="0"></div>
    </div>

    <div class="section-label">공제 항목</div>
    <div class="grid">
      <div class="field"><label>국민연금</label><input type="number" class="ded-input" id="d-국민연금" value="0"></div>
      <div class="field"><label>건강보험</label><input type="number" class="ded-input" id="d-건강보험" value="0"></div>
      <div class="field"><label>장기요양보험료</label><input type="number" class="ded-input" id="d-장기요양보험료" value="0"></div>
      <div class="field"><label>고용보험료</label><input type="number" class="ded-input" id="d-고용보험료" value="0"></div>
      <div class="field"><label>소득세</label><input type="number" class="ded-input" id="d-소득세" value="0"></div>
      <div class="field"><label>지방소득세</label><input type="number" class="ded-input" id="d-지방소득세" value="0"></div>
      <div class="field"><label>기타공제액</label><input type="number" class="ded-input" id="d-기타공제액" value="0"></div>
      <div class="field"><label>국민연금지원</label><input type="number" class="ded-input" id="d-국민연금지원" value="0"></div>
      <div class="field"><label>고용보험지원</label><input type="number" class="ded-input" id="d-고용보험지원" value="0"></div>
      <div class="field"><label>연말정산소득세</label><input type="number" class="ded-input" id="d-연말정산소득세" value="0"></div>
      <div class="field"><label>연말정산지방소득세</label><input type="number" class="ded-input" id="d-연말정산지방소득세" value="0"></div>
    </div>

    <div class="sum-box">
      <div class="sum-item">지급액계<b id="sumPay">0</b></div>
      <div class="sum-item">공제액계<b id="sumDed">0</b></div>
      <div class="sum-item">차인지급액<b id="sumNet">0</b></div>
    </div>

    <button class="submit-btn" id="submitBtn">저장</button>
    <div class="submit-status" id="submitStatus"></div>
  </div>

  <div class="toolbar">
    <select id="listEmployeeFilter"><option value="전체">전체 사원</option></select>
    <select id="listMonthFilter"><option value="전체">전체 기간</option></select>
  </div>

  <div class="summary-bar" id="paySummaryBar"></div>

  <table id="listTable" style="display:none;">
    <thead>
      <tr><th>선택</th><th>지급일</th><th>사원명</th><th>부서명</th><th>지급액계</th><th>공제액계</th><th>차인지급액</th><th>관리</th></tr>
    </thead>
    <tbody id="listBody"></tbody>
  </table>
  <div class="empty" id="emptyMsg">불러오는 중...</div>
</main>

<!-- 인쇄 전용 영역 -->
<div id="printArea"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-functions-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
  // 근로자: 본인 것만 조회 / 관리자: 전체 조회 + 작성
  requireRole(['worker', 'admin']);

  const functions = firebase.functions();

  const PAY_KEYS = ['기본급', '식대', '자기계발비', '차량유지비', '기타'];
  const DED_KEYS = ['국민연금', '건강보험', '장기요양보험료', '고용보험료', '소득세', '지방소득세', '기타공제액', '국민연금지원', '고용보험지원', '연말정산소득세', '연말정산지방소득세'];

  // 인쇄용 회사 정보 - 필요하면 이 값들만 바꿔서 갱신하면 됩니다.
  const COMPANY_NAME = 'NUCKS Co.,Ltd';
  const COMPANY_ADDRESS = '05033 서울특별시 광진구 광나루로46길 26, Nucks Building 2F';
  const COMPANY_TEL = '02-6463-1773';
  const COMPANY_STAMP_URL = 'company-stamp.png'; // 서버 루트에 이 파일명으로 업로드해주세요
  const CEO_TITLE = '대표 윤상원';

  function scrollToFormTop() {
    document.getElementById('adminOnlyPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function formatDateKR(str) {
    if (!str) return '';
    const [y, m, d] = String(str).split('-');
    if (!y || !m || !d) return str;
    return `${y}년 ${Number(m)}월 ${Number(d)}일`;
  }

  function buildPrintHtml(s) {
    const payRows = PAY_KEYS.map(k => `<tr><th>${k}</th><td>${(s.pay?.[k] || 0).toLocaleString()}원</td></tr>`).join('');
    const dedRows = DED_KEYS.map(k => `<tr><th>${k}</th><td>${(s.deductions?.[k] || 0).toLocaleString()}원</td></tr>`).join('');
    const today = formatDateKR(new Date().toISOString().slice(0, 10));

    return `
      <div class="print-slip">
        <div class="p-header">
          <div class="p-company">${COMPANY_NAME} · ${COMPANY_ADDRESS} · ${COMPANY_TEL}</div>
          <div class="p-title">급 여 명 세 서</div>
        </div>
        <table class="p-info-table">
          <tr><th>성명</th><td>${s['사원명'] || ''}</td><th>부서</th><td>${s['부서명'] || ''}</td></tr>
          <tr><th>직급</th><td>${s['직급'] || ''}</td><th>지급일</th><td>${formatDateKR(s['지급일'])}</td></tr>
        </table>
        <table class="p-pay-table">
          <thead><tr><th colspan="2">지급 항목</th></tr></thead>
          <tbody>${payRows}</tbody>
          <tfoot><tr><th>지급액계</th><td style="font-weight:700;">${(s['지급액계'] || 0).toLocaleString()}원</td></tr></tfoot>
        </table>
        <table class="p-pay-table">
          <thead><tr><th colspan="2">공제 항목</th></tr></thead>
          <tbody>${dedRows}</tbody>
          <tfoot><tr><th>공제액계</th><td style="font-weight:700;">${(s['공제액계'] || 0).toLocaleString()}원</td></tr></tfoot>
        </table>
        <div class="p-net-box">차인지급액&nbsp; ${(s['차인지급액'] || 0).toLocaleString()}원</div>
        <div class="p-date">발행일: ${today}</div>
        <div class="p-sign">
          <span>${COMPANY_NAME} ${CEO_TITLE}</span>
          <img class="p-stamp" src="${COMPANY_STAMP_URL}">
        </div>
      </div>
    `;
  }

  function printSlip(docId) {
    const s = allSlips.find(x => x.id === docId);
    if (!s) return;
    renderAndPrint(buildPrintHtml(s), 'printArea');
  }

  // 인쇄 영역에 직인 이미지가 있으면, 이미지 로딩이 끝난 뒤에 인쇄를 실행한다.
  // (innerHTML 세팅 직후 바로 print()를 부르면 이미지가 아직 안 그려진 채로 인쇄되는 경우가 있음)
  function renderAndPrint(html, areaId) {
    const area = document.getElementById(areaId);
    area.innerHTML = html;

    const img = area.querySelector('img.p-stamp');
    let printed = false;
    const doPrint = () => {
      if (printed) return;
      printed = true;
      window.print();
    };

    if (img) {
      if (img.complete && img.naturalWidth > 0) {
        doPrint();
      } else {
        img.addEventListener('load', doPrint);
        img.addEventListener('error', doPrint);
        setTimeout(doPrint, 1500); // 안전장치: 로딩이 오래 걸려도 결국은 인쇄되게
      }
    } else {
      doPrint();
    }
  }

  window.addEventListener('afterprint', () => {
    const area = document.getElementById('printArea');
    if (area) area.innerHTML = '';
  });

  let employees = [];
  let allSlips = [];
  let selectedSlipIds = new Set();
  let editingSlipId = null; // 1건만 선택됐을 때, 그 문서 id (수정 모드)
  let currentUser = null;
  let currentRole = null;

  auth.onAuthStateChanged(async (user) => {
    if (!user) return;
    currentUser = user;
    currentRole = await getCurrentUserRole();

    document.getElementById('listMonthFilter').addEventListener('change', renderList);

    if (currentRole === 'admin') {
      document.getElementById('adminOnlyPanel').style.display = 'block';
      document.getElementById('importPanel').style.display = 'block';
      await init();
    } else {
      document.getElementById('adminOnlyPanel').style.display = 'none';
      document.getElementById('listEmployeeFilter').style.display = 'none';
      await loadSlips();
    }
  });

  async function init() {
    const snapshot = await db.collection('users').get();
    employees = snapshot.docs.map(d => ({ uid: d.id, ...d.data() })).filter(e => e.role !== 'guest');

    const empSelect = document.getElementById('f-employee');
    empSelect.innerHTML = employees.map(e => `<option value="${e.uid}">${e.displayName || e.email}</option>`).join('');
    empSelect.addEventListener('change', prefillEmployeeInfo);
    prefillEmployeeInfo();

    document.getElementById('f-payDate').value = new Date().toISOString().slice(0, 10);

    [...PAY_KEYS, ...DED_KEYS].forEach(key => {
      const el = document.getElementById((PAY_KEYS.includes(key) ? 'p-' : 'd-') + key);
      el.addEventListener('input', updateSums);
    });
    updateSums();

    document.getElementById('listEmployeeFilter').addEventListener('change', renderList);

    loadSlips();
  }

  function prefillEmployeeInfo() {
    const uid = document.getElementById('f-employee').value;
    const emp = employees.find(e => e.uid === uid);
    document.getElementById('f-department').value = emp?.department || '';
    document.getElementById('f-position').value = (emp?.positionTags || []).join(', ');
  }

  function updateSums() {
    const payTotal = PAY_KEYS.reduce((sum, k) => sum + (Number(document.getElementById('p-' + k).value) || 0), 0);
    const dedTotal = DED_KEYS.reduce((sum, k) => sum + (Number(document.getElementById('d-' + k).value) || 0), 0);
    document.getElementById('sumPay').textContent = payTotal.toLocaleString();
    document.getElementById('sumDed').textContent = dedTotal.toLocaleString();
    document.getElementById('sumNet').textContent = (payTotal - dedTotal).toLocaleString();
    return { payTotal, dedTotal };
  }

  // 목록에서 선택한 항목(단일/다중)의 세부 금액을 상단 입력 필드에 표시
  // 다중 선택이면 각 항목별로 합산해서 보여줌 (조회 전용)
  // 단일 선택이면 실제 "수정 모드"로 전환 - 저장하면 그 항목이 업데이트됨
  function updateDetailPreview() {
    const banner = document.getElementById('selectionBanner');
    const bannerText = document.getElementById('selectionBannerText');
    const submitBtn = document.getElementById('submitBtn');
    const selected = allSlips.filter(s => selectedSlipIds.has(s.id));

    if (selected.length === 0) {
      banner.style.display = 'none';
      editingSlipId = null;
      submitBtn.disabled = false;
      submitBtn.textContent = '저장';
      return;
    }

    banner.style.display = 'block';

    if (selected.length === 1) {
      editingSlipId = selected[0].id;
      submitBtn.disabled = false;
      submitBtn.textContent = '수정 저장';
      bannerText.textContent = `1건 선택됨 (${selected[0]['사원명']} · ${selected[0]['지급일']}) - 값을 고친 뒤 "수정 저장"을 누르면 이 항목이 업데이트됩니다.`;
    } else {
      editingSlipId = null;
      submitBtn.disabled = true;
      submitBtn.textContent = '저장 불가 (다중 선택 중)';
      bannerText.textContent = `${selected.length}건 선택됨 - 아래는 선택한 항목들의 합계(조회 전용)입니다. 수정하려면 1건만 선택해 주세요.`;
    }

    PAY_KEYS.forEach(k => {
      const sum = selected.reduce((s, item) => s + ((item.pay && item.pay[k]) || 0), 0);
      document.getElementById('p-' + k).value = sum;
    });
    DED_KEYS.forEach(k => {
      const sum = selected.reduce((s, item) => s + ((item.deductions && item.deductions[k]) || 0), 0);
      document.getElementById('d-' + k).value = sum;
    });

    if (selected.length === 1) {
      document.getElementById('f-department').value = selected[0]['부서명'] || '';
      document.getElementById('f-position').value = selected[0]['직급'] || '';
      document.getElementById('f-payDate').value = selected[0]['지급일'] || '';
      const emp = employees.find(e => e.displayName === selected[0]['사원명']);
      if (emp) document.getElementById('f-employee').value = emp.uid;
    } else {
      document.getElementById('f-department').value = '(여러 건)';
      document.getElementById('f-position').value = '(여러 건)';
    }

    updateSums();
  }

  document.getElementById('clearSelectionBtn').addEventListener('click', () => {
    selectedSlipIds.clear();
    editingSlipId = null;
    document.querySelectorAll('.row-select').forEach(cb => { cb.checked = false; });
    document.getElementById('selectionBanner').style.display = 'none';
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = false;
    submitBtn.textContent = '저장';
    // 입력 필드 초기화
    PAY_KEYS.forEach(k => { document.getElementById('p-' + k).value = 0; });
    DED_KEYS.forEach(k => { document.getElementById('d-' + k).value = 0; });
    document.getElementById('f-department').value = '';
    document.getElementById('f-position').value = '';
    prefillEmployeeInfo();
    updateSums();
  });

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const statusEl = document.getElementById('submitStatus');
    const btn = document.getElementById('submitBtn');
    const uid = document.getElementById('f-employee').value;
    const emp = employees.find(e => e.uid === uid);

    const pay = {};
    PAY_KEYS.forEach(k => { pay[k] = Number(document.getElementById('p-' + k).value) || 0; });
    const deductions = {};
    DED_KEYS.forEach(k => { deductions[k] = Number(document.getElementById('d-' + k).value) || 0; });

    const { payTotal, dedTotal } = updateSums();

    const isEditing = !!editingSlipId;
    btn.disabled = true;
    btn.textContent = isEditing ? '수정 저장 중...' : '저장 중...';

    const docData = {
      uid,
      '사원명': emp?.displayName || emp?.email || '',
      '지급일': document.getElementById('f-payDate').value,
      '부서명': document.getElementById('f-department').value.trim(),
      '직급': document.getElementById('f-position').value.trim(),
      pay,
      deductions,
      '지급액계': payTotal,
      '공제액계': dedTotal,
      '차인지급액': payTotal - dedTotal
    };

    try {
      if (isEditing) {
        await db.collection('payslips').doc(editingSlipId).update(docData);
        statusEl.style.color = '#3f6b52';
        statusEl.textContent = '수정되었습니다.';
      } else {
        docData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        await db.collection('payslips').add(docData);
        statusEl.style.color = '#3f6b52';
        statusEl.textContent = '저장되었습니다.';
      }

      // 선택/수정 모드 초기화
      selectedSlipIds.clear();
      editingSlipId = null;
      document.getElementById('selectionBanner').style.display = 'none';

      await loadSlips();
    } catch (err) {
      statusEl.style.color = '#a4453c';
      statusEl.textContent = (isEditing ? '수정' : '저장') + ' 실패: ' + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = '저장';
    }
  });

  async function loadSlips() {
    const query = (currentRole === 'admin')
      ? db.collection('payslips')
      : db.collection('payslips').where('uid', '==', currentUser.uid);

    const snapshot = await query.get();
    allSlips = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    allSlips.sort((a, b) => (b['지급일'] || '').localeCompare(a['지급일'] || ''));

    if (currentRole === 'admin') {
      const filterSelect = document.getElementById('listEmployeeFilter');
      const names = [...new Set(allSlips.map(s => s['사원명']).filter(Boolean))].sort();
      const current = filterSelect.value;
      filterSelect.innerHTML = '<option value="전체">전체 사원</option>' + names.map(n => `<option value="${n}">${n}</option>`).join('');
      if (names.includes(current)) filterSelect.value = current;
    }

    // 지급일(YYYY-MM-DD)에서 연-월(YYYY-MM)만 뽑아 월 필터 옵션 구성
    const monthFilterSelect = document.getElementById('listMonthFilter');
    const months = [...new Set(allSlips.map(s => (s['지급일'] || '').slice(0, 7)).filter(Boolean))].sort().reverse();
    const currentMonth = monthFilterSelect.value;
    monthFilterSelect.innerHTML = '<option value="전체">전체 기간</option>' + months.map(m => `<option value="${m}">${m}</option>`).join('');
    if (months.includes(currentMonth)) monthFilterSelect.value = currentMonth;

    renderList();
  }

  function renderList() {
    const table = document.getElementById('listTable');
    const emptyMsg = document.getElementById('emptyMsg');
    const tbody = document.getElementById('listBody');
    const summaryBar = document.getElementById('paySummaryBar');
    const filterVal = currentRole === 'admin' ? document.getElementById('listEmployeeFilter').value : '전체';
    const monthVal = document.getElementById('listMonthFilter').value;

    let rows = filterVal === '전체' ? allSlips : allSlips.filter(s => s['사원명'] === filterVal);
    if (monthVal !== '전체') {
      rows = rows.filter(s => (s['지급일'] || '').slice(0, 7) === monthVal);
    }

    // 필터링된 범위의 합계 자동 집계
    const payTotalSum = rows.reduce((sum, s) => sum + (s['지급액계'] || 0), 0);
    const dedTotalSum = rows.reduce((sum, s) => sum + (s['공제액계'] || 0), 0);
    const netTotalSum = rows.reduce((sum, s) => sum + (s['차인지급액'] || 0), 0);
    const monthLabel = monthVal === '전체' ? '전체 기간' : monthVal;
    const empLabel = filterVal === '전체' ? '전체 사원' : filterVal;

    summaryBar.innerHTML = `
      <div class="summary-chip">${monthLabel} · ${empLabel} 지급액계<b>${payTotalSum.toLocaleString()}</b></div>
      <div class="summary-chip">공제액계<b>${dedTotalSum.toLocaleString()}</b></div>
      <div class="summary-chip">차인지급액<b>${netTotalSum.toLocaleString()}</b></div>
      <div class="summary-chip">건수<b>${rows.length}건</b></div>
    `;

    if (rows.length === 0) {
      table.style.display = 'none';
      emptyMsg.textContent = '등록된 급여명세서가 없습니다.';
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';
    table.style.display = 'table';

    tbody.innerHTML = rows.map(s => `
      <tr data-id="${s.id}">
        <td data-label="선택"><input type="checkbox" class="row-select" data-id="${s.id}" ${selectedSlipIds.has(s.id) ? 'checked' : ''}></td>
        <td data-label="지급일">${s['지급일'] || ''}</td>
        <td data-label="사원명">${s['사원명'] || ''}</td>
        <td data-label="부서명">${s['부서명'] || ''}</td>
        <td data-label="지급액계">${(s['지급액계'] || 0).toLocaleString()}</td>
        <td data-label="공제액계">${(s['공제액계'] || 0).toLocaleString()}</td>
        <td data-label="차인지급액">${(s['차인지급액'] || 0).toLocaleString()}</td>
        <td data-label="관리">
          <button class="print-btn" data-print="${s.id}">인쇄</button>
          ${currentRole === 'admin' ? `<button class="row-btn" data-id="${s.id}">삭제</button>` : ''}
        </td>
      </tr>
    `).join('');

    // 인쇄 버튼 (모든 사용자 - 본인 명세서 인쇄 가능)
    document.querySelectorAll('.print-btn').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); printSlip(btn.dataset.print); });
    });

    if (currentRole === 'admin') {
      document.querySelectorAll('.row-btn[data-id]').forEach(btn => {
        btn.addEventListener('click', (e) => { e.stopPropagation(); deleteSlip(btn.dataset.id); });
      });

      // 체크박스 직접 클릭
      document.querySelectorAll('.row-select').forEach(cb => {
        cb.addEventListener('click', (e) => e.stopPropagation());
        cb.addEventListener('change', () => {
          if (cb.checked) selectedSlipIds.add(cb.dataset.id);
          else selectedSlipIds.delete(cb.dataset.id);
          updateDetailPreview();
          if (cb.checked) scrollToFormTop();
        });
      });

      // 행(체크박스/삭제 버튼 제외) 클릭 시에도 선택 토글
      document.querySelectorAll('#listBody tr').forEach(tr => {
        tr.style.cursor = 'pointer';
        tr.addEventListener('click', () => {
          const id = tr.dataset.id;
          const cb = tr.querySelector('.row-select');
          cb.checked = !cb.checked;
          if (cb.checked) selectedSlipIds.add(id);
          else selectedSlipIds.delete(id);
          updateDetailPreview();
          if (cb.checked) scrollToFormTop();
        });
      });

      updateDetailPreview();
    }
  }

  async function deleteSlip(docId) {
    if (!confirm('이 급여명세서를 삭제하시겠습니까?')) return;
    try {
      await db.collection('payslips').doc(docId).delete();
      selectedSlipIds.delete(docId);
      await loadSlips();
    } catch (err) {
      alert('삭제 실패: ' + err.message);
    }
  }

  // ---------- 급여대장 CSV 가져오기 (관리자 전용) ----------
  const IMPORT_ALLOWED_NAMES = ['이연경', '손영화', '윤성원', '윤상원', '김의석'];
  const IMPORT_MIN_DATE = '2025-11-01';

  // CSV 컬럼명 -> 우리 필드명 매핑 (다른 부분은 이름이 같아서 그대로 사용)
  const DED_COLUMN_MAP = { ...Object.fromEntries(DED_KEYS.map(k => [k, k])), '고용보험': '고용보험료' };

  let parsedPayslipRows = [];

  // 엑셀 날짜 일련번호(예: 45681) -> 실제 날짜로 변환
  function excelSerialToDate(serial) {
    const utcDays = Math.floor(serial - 25569);
    return new Date(utcDays * 86400 * 1000);
  }

  function parseDateFlexible(value) {
    if (value === null || value === undefined || value === '') return null;

    if (value instanceof Date) {
      if (isNaN(value.getTime())) return null;
      return value.toISOString().slice(0, 10);
    }

    if (typeof value === 'number') {
      const d = excelSerialToDate(value);
      if (!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
      return null;
    }

    const cleaned = String(value).replace(/\s*\(GMT[^)]*\)\s*$/i, '').trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(cleaned)) return cleaned.slice(0, 10);
    if (/^\d{4}\/\d{2}\/\d{2}/.test(cleaned)) return cleaned.slice(0, 10).replace(/\//g, '-');

    const d = new Date(cleaned);
    if (!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
    return null;
  }

  function toNumber(value) {
    if (value === undefined || value === null || value === '') return 0;
    const n = Number(String(value).replace(/,/g, ''));
    return isNaN(n) ? 0 : n;
  }

  // CSV 또는 엑셀(xlsx/xls) 파일을 읽어서 행 배열(JSON)로 반환
  function readFileAsRows(file) {
    return new Promise((resolve, reject) => {
      const isExcel = /\.xlsx?$/i.test(file.name);

      if (isExcel) {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array', cellDates: true });
            const sheetName = workbook.SheetNames[0];
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: '' });
            resolve(rows);
          } catch (err) {
            reject(err);
          }
        };
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
      } else {
        Papa.parse(file, {
          header: true,
          skipEmptyLines: true,
          transformHeader: (h) => h.replace(/^\uFEFF/, '').trim(),
          complete: (results) => resolve(results.data),
          error: reject
        });
      }
    });
  }

  document.getElementById('importParseBtn')?.addEventListener('click', async () => {
    const fileInput = document.getElementById('importFile');
    const previewEl = document.getElementById('importPreview');
    const file = fileInput.files[0];

    if (!file) {
      previewEl.textContent = '파일을 선택해 주세요.';
      return;
    }

    previewEl.textContent = '분석 중...';

    try {
      const rows = await readFileAsRows(file);
      const mapped = [];

      rows.forEach((row) => {
        const name = String(row['사원명'] || '').trim();
        if (!IMPORT_ALLOWED_NAMES.includes(name)) return;

        const payDate = parseDateFlexible(row['지급일']);
        if (!payDate || payDate < IMPORT_MIN_DATE) return;

        const pay = {};
        PAY_KEYS.forEach(k => { pay[k] = toNumber(row[k]); });

        const deductions = {};
        Object.entries(DED_COLUMN_MAP).forEach(([csvKey, ourKey]) => {
          deductions[ourKey] = toNumber(row[csvKey]);
        });

        mapped.push({
          '사원명': name,
          '지급일': payDate,
          '부서명': String(row['부서'] || '').trim(),
          '직급': String(row['직급'] || '').trim(),
          pay,
          deductions,
          '지급액계': toNumber(row['지급액계']),
          '공제액계': toNumber(row['공제액계']),
          '차인지급액': toNumber(row['차인지급액'])
        });
      });

      parsedPayslipRows = mapped;
      previewEl.textContent = `조건에 맞는 ${mapped.length}건을 가져올 준비가 되었습니다. (전체 ${rows.length}행 중)`;
      document.getElementById('importRunBtn').style.display = mapped.length ? 'inline-block' : 'none';
    } catch (err) {
      previewEl.textContent = '파일 분석 실패: ' + err.message;
    }
  });

  document.getElementById('importRunBtn')?.addEventListener('click', async () => {
    const btn = document.getElementById('importRunBtn');
    const resultEl = document.getElementById('importResult');

    btn.disabled = true;
    btn.textContent = '가져오는 중...';
    resultEl.textContent = '';

    try {
      const importPayslips = functions.httpsCallable('importPayslips');
      const res = await importPayslips({ rows: parsedPayslipRows });
      const { imported, skipped } = res.data;

      let msg = `${imported}건 가져오기 완료.`;
      if (skipped.length) {
        msg += ` (건너뜀 ${skipped.length}건: 계정 없음 등)`;
      }
      resultEl.style.color = '#3f6b52';
      resultEl.textContent = msg;

      await loadSlips();
    } catch (err) {
      resultEl.style.color = '#a4453c';
      resultEl.textContent = '가져오기 실패: ' + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = '가져오기 실행';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async (e) => {
    e.preventDefault();
    await logOut();
    window.location.href = 'login.html';
  });
</script>
