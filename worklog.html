<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>근무일지 | NUCKS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pretendard:wght@400;500&display=swap');

  :root{
    --ink:#141414;
    --paper:#f7f6f3;
    --line:#d8d5cd;
    --muted:#8a8578;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--paper);
    font-family:'Pretendard', -apple-system, sans-serif; color:var(--ink);
  }
  header{
    padding:28px 48px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .eyebrow{
    font-size:11px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--muted); margin-bottom:6px;
  }
  h1{
    font-family:'Cormorant Garamond', serif; font-weight:500;
    font-size:32px; margin:0; letter-spacing:.01em;
  }
  .header-right{ display:flex; align-items:center; gap:24px; }
  .header-right a{
    font-size:13px; color:var(--muted); text-decoration:none;
    border-bottom:1px solid var(--muted); cursor:pointer;
  }
  main{ max-width:1100px; margin:0 auto; padding:40px 48px; }

  /* 작성 폼 */
  .write-panel{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    padding:24px; margin-bottom:40px;
  }
  .panel-title{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); margin-bottom:18px;
  }
  .form-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; margin-bottom:16px;
  }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:11.5px; color:var(--muted); }
  .field input, .field textarea{
    padding:8px 9px; border:1px solid var(--line); border-radius:4px;
    font-family:inherit; font-size:13.5px; background:#fff;
  }
  .field textarea{ resize:vertical; min-height:60px; }
  .task-checks{
    display:flex; flex-wrap:wrap; gap:12px; margin-bottom:16px;
  }
  .task-checks label{
    font-size:13px; display:flex; align-items:center; gap:5px; cursor:pointer;
  }
  .submit-btn{
    padding:10px 22px; background:var(--ink); color:var(--paper);
    border:none; font-size:12.5px; letter-spacing:.05em; text-transform:uppercase;
    cursor:pointer; border-radius:4px;
  }
  .submit-status{ font-size:13px; margin-top:10px; min-height:18px; }

  /* 목록 */
  .toolbar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:18px; gap:12px; flex-wrap:wrap;
  }
  .toolbar select{
    padding:7px 10px; border:1px solid var(--line); border-radius:4px;
    font-family:inherit; font-size:13px; background:#fff;
  }
  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; min-width:800px; }
  th{
    text-align:left; font-size:11.5px; color:var(--muted); font-weight:500;
    padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  td{
    padding:11px 10px; font-size:13px; border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  td.nowrap{ white-space:nowrap; }
  td.detail-cell{ max-width:240px; white-space:normal; }
  .task-tag{
    display:inline-block; font-size:10.5px; padding:2px 7px; border-radius:12px;
    background:#ece9e2; color:#7a766c; margin:1px 2px 1px 0;
  }
  .row-btn{
    font-size:12px; background:none; border:none; cursor:pointer;
    text-decoration:underline; color:var(--muted); margin-right:8px;
  }
  .row-btn.danger{ color:#a4453c; }
  .attach-link{ color:var(--ink); text-decoration:none; border-bottom:1px solid var(--ink); font-size:12.5px; }
  .empty{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    padding:32px; text-align:center; color:var(--muted); font-size:13.5px;
  }

  /* 목록/달력 전환 버튼 */
  .view-toggle-btn{
    padding:6px 14px; border:1px solid var(--line); border-radius:20px;
    background:#fff; font-size:12.5px; color:var(--muted); cursor:pointer;
  }
  .view-toggle-btn.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  /* 달력보기 */
  .cal-nav{
    display:flex; align-items:center; justify-content:center; gap:20px;
    margin-bottom:16px;
  }
  .cal-nav-btn{
    border:none; background:none; cursor:pointer; font-size:14px; color:var(--muted);
  }
  .cal-month-label{ font-size:16px; font-weight:600; min-width:120px; text-align:center; }
  .cal-grid{
    display:grid; grid-template-columns:repeat(7, 1fr);
    border-top:1px solid var(--line); border-left:1px solid var(--line);
  }
  .cal-dow{
    padding:8px; font-size:11.5px; color:var(--muted); text-align:center;
    border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    background:#fff;
  }
  .cal-cell{
    min-height:110px; border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:6px; background:#fff; vertical-align:top;
  }
  .cal-cell.other-month{ background:#f2f0eb; }
  .cal-date{ font-size:12px; color:var(--muted); margin-bottom:4px; }
  .cal-date.today{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:50%; background:var(--ink); color:var(--paper);
  }
  .cal-item{
    font-size:11px; padding:2px 6px; margin-bottom:3px; border-radius:3px;
    background:#ece9e2; color:#3a3733; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    cursor:default;
  }
  .cal-item-leave{
    background:#e8e2f2; color:#5b4b8a;
  }
  .cal-item-holiday{
    background:#fbe4e2; color:#a4453c; font-weight:600;
  }
  .cal-cell-holiday{ background:#fdf6f5; }
  .cal-cell-holiday.other-month{ background:#f2f0eb; }
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">NUCKS</div>
    <h1>근무일지</h1>
  </div>
  <div class="header-right">
    <a href="index.html">Home</a>
    <a href="#" id="logoutBtn">Logout</a>
  </div>
</header>

<main>
  <!-- 작성 폼 (근로자/관리자 본인 명의로 작성) -->
  <div class="write-panel">
    <div class="panel-title">근무일지 작성</div>
    <div class="form-grid">
      <div class="field">
        <label for="f-date">날짜</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label for="f-checkin">출근시간</label>
        <input type="time" id="f-checkin">
      </div>
      <div class="field">
        <label for="f-checkout">퇴근시간</label>
        <input type="time" id="f-checkout">
      </div>
      <div class="field">
        <label for="f-project">프로젝트</label>
        <input type="text" id="f-project" placeholder="예: 힐스테이트장위">
      </div>
    </div>

    <div class="task-checks" id="taskChecks"></div>

    <div class="field" style="margin-bottom:16px;">
      <label for="f-detail">상세내용</label>
      <textarea id="f-detail" placeholder="오늘 진행한 업무 내용을 적어주세요"></textarea>
    </div>

    <div class="field" style="margin-bottom:16px; max-width:320px;">
      <label for="f-file">파일첨부 (선택)</label>
      <input type="file" id="f-file">
    </div>

    <button class="submit-btn" id="submitBtn">등록</button>
    <div class="submit-status" id="submitStatus"></div>
  </div>

  <!-- 목록 -->
  <div class="toolbar">
    <div style="display:flex; gap:8px; align-items:center;">
      <button class="view-toggle-btn active" id="viewListBtn">목록보기</button>
      <button class="view-toggle-btn" id="viewCalendarBtn">달력보기</button>
    </div>
    <select id="employeeFilter" style="display:none;">
      <option value="전체">전체 사원</option>
    </select>
    <button class="row-btn" id="refreshBtn" style="text-decoration:none; font-size:12.5px;">새로고침</button>
  </div>

  <!-- 달력보기 -->
  <div id="calendarView" style="display:none;">
    <div class="cal-nav">
      <button class="cal-nav-btn" id="calPrevBtn">◀</button>
      <div class="cal-month-label" id="calMonthLabel"></div>
      <button class="cal-nav-btn" id="calNextBtn">▶</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="table-wrap" id="listView">
    <table id="logTable" style="display:none;">
      <thead>
        <tr>
          <th>날짜</th><th>사원명</th><th>출근</th><th>퇴근</th><th>프로젝트</th>
          <th>업무유형</th><th>상세내용</th><th>첨부</th><th>관리</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div class="empty" id="emptyMsg">불러오는 중...</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
  requireRole(['worker', 'admin']);

  const storage = firebase.storage();
  const TASK_TYPES = ['도면작성', '스케치업', '마감스펙', '제안서', '회의', '경영관리', '공무', '기타업무'];

  let currentUser = null;
  let currentRole = null;
  let currentDisplayName = '';
  let allRows = [];
  let allLeaveRows = [];

  // 2026년 대한민국 공휴일 (우주항공청 발표 월력요항 기준)
  // 다른 연도가 필요하거나 날짜가 변경되면 이 목록만 수정하면 됩니다.
  const HOLIDAYS = {
    '2026-01-01': '신정',
    '2026-02-16': '설날 연휴',
    '2026-02-17': '설날',
    '2026-02-18': '설날 연휴',
    '2026-03-01': '삼일절',
    '2026-03-02': '대체공휴일',
    '2026-05-01': '근로자의 날',
    '2026-05-05': '어린이날',
    '2026-05-24': '부처님오신날',
    '2026-05-25': '대체공휴일',
    '2026-06-03': '지방선거일',
    '2026-06-06': '현충일',
    '2026-08-15': '광복절',
    '2026-08-17': '대체공휴일',
    '2026-09-24': '추석 연휴',
    '2026-09-25': '추석',
    '2026-09-26': '추석 연휴',
    '2026-10-03': '개천절',
    '2026-10-05': '대체공휴일',
    '2026-10-09': '한글날',
    '2026-12-25': '크리스마스'
  };

  // 업무유형 체크박스 렌더
  document.getElementById('taskChecks').innerHTML = TASK_TYPES.map(t =>
    `<label><input type="checkbox" class="task-check" value="${t}"> ${t}</label>`
  ).join('');

  auth.onAuthStateChanged(async (user) => {
    if (!user) return;
    currentUser = user;
    currentRole = await getCurrentUserRole();

    const userDoc = await db.collection('users').doc(user.uid).get();
    currentDisplayName = userDoc.data()?.displayName || user.email;

    document.getElementById('employeeFilter').style.display = (currentRole === 'admin') ? 'inline-block' : 'none';

    // 오늘 날짜 기본값
    document.getElementById('f-date').value = new Date().toISOString().slice(0, 10);

    loadLogs();
  });

  document.getElementById('refreshBtn').addEventListener('click', loadLogs);
  document.getElementById('employeeFilter').addEventListener('change', () => { renderTable(); renderCalendar(); });

  // 목록/달력 전환
  let viewMode = 'list';
  let calMonth = new Date(); // 달력에 표시 중인 월 (1일 기준으로 다룸)
  calMonth.setDate(1);

  document.getElementById('viewListBtn').addEventListener('click', () => switchView('list'));
  document.getElementById('viewCalendarBtn').addEventListener('click', () => switchView('calendar'));
  document.getElementById('calPrevBtn').addEventListener('click', () => { calMonth.setMonth(calMonth.getMonth() - 1); renderCalendar(); });
  document.getElementById('calNextBtn').addEventListener('click', () => { calMonth.setMonth(calMonth.getMonth() + 1); renderCalendar(); });

  function switchView(mode) {
    viewMode = mode;
    document.getElementById('viewListBtn').classList.toggle('active', mode === 'list');
    document.getElementById('viewCalendarBtn').classList.toggle('active', mode === 'calendar');
    document.getElementById('listView').style.display = (mode === 'list') ? 'block' : 'none';
    document.getElementById('emptyMsg').style.display = (mode === 'list') ? '' : 'none';
    document.getElementById('calendarView').style.display = (mode === 'calendar') ? 'block' : 'none';
    if (mode === 'calendar') renderCalendar();
  }

  function renderCalendar() {
    const year = calMonth.getFullYear();
    const month = calMonth.getMonth();
    document.getElementById('calMonthLabel').textContent = `${year}년 ${month + 1}월`;

    const filterVal = document.getElementById('employeeFilter').value;
    const rows = (currentRole === 'admin' && filterVal !== '전체')
      ? allRows.filter(r => r['사원명'] === filterVal)
      : allRows;
    const leaveRows = (currentRole === 'admin' && filterVal !== '전체')
      ? allLeaveRows.filter(r => r['사원명'] === filterVal)
      : allLeaveRows;

    // 날짜별로 그룹핑 (근무일지 / 연차 따로)
    const byDate = {};
    rows.forEach(r => {
      const d = r['날짜'];
      if (!d) return;
      if (!byDate[d]) byDate[d] = [];
      byDate[d].push(r);
    });

    const leaveByDate = {};
    leaveRows.forEach(r => {
      const d = r['날짜'];
      if (!d) return;
      if (!leaveByDate[d]) leaveByDate[d] = [];
      leaveByDate[d].push(r);
    });

    const firstOfMonth = new Date(year, month, 1);
    const startDow = firstOfMonth.getDay(); // 0=일요일
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayStr = new Date().toISOString().slice(0, 10);

    const grid = document.getElementById('calGrid');
    let html = ['일', '월', '화', '수', '목', '금', '토'].map(d => `<div class="cal-dow">${d}</div>`).join('');

    // 이전 달 채우기
    for (let i = 0; i < startDow; i++) {
      html += `<div class="cal-cell other-month"></div>`;
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const items = byDate[dateStr] || [];
      const leaveItems = leaveByDate[dateStr] || [];
      const holidayName = HOLIDAYS[dateStr];
      const isToday = dateStr === todayStr;

      let cellHtml = '';

      // 공휴일 표시 (가장 위에)
      if (holidayName) {
        cellHtml += `<div class="cal-item cal-item-holiday" title="${holidayName}">🎌 ${holidayName}</div>`;
      }

      // 연차 항목 표시
      leaveItems.forEach(r => {
        const label = (currentRole === 'admin')
          ? `${r['사원명'] || ''} · ${r['연차구분'] || '연차'}`
          : `${r['연차구분'] || '연차'}`;
        cellHtml += `<div class="cal-item cal-item-leave" title="${label}">🏖 ${label}</div>`;
      });

      // 근무일지 항목 표시
      items.forEach(r => {
        const label = (currentRole === 'admin')
          ? `${r['사원명'] || ''} · ${r['프로젝트'] || '근무일지'}`
          : (r['프로젝트'] || '근무일지');
        cellHtml += `<div class="cal-item" title="${label}">${label}</div>`;
      });

      const cellClass = holidayName ? 'cal-cell cal-cell-holiday' : 'cal-cell';

      html += `
        <div class="${cellClass}">
          <div class="cal-date ${isToday ? 'today' : ''}">${day}</div>
          ${cellHtml}
        </div>
      `;
    }

    grid.innerHTML = html;
  }

  async function loadLogs() {
    const emptyMsg = document.getElementById('emptyMsg');
    const table = document.getElementById('logTable');
    emptyMsg.textContent = '불러오는 중...';
    emptyMsg.style.display = 'block';
    table.style.display = 'none';

    try {
      let query, leaveQuery;
      if (currentRole === 'admin') {
        query = db.collection('workLogs').orderBy('날짜', 'desc');
        leaveQuery = db.collection('leaves');
      } else {
        query = db.collection('workLogs').where('uid', '==', currentUser.uid);
        leaveQuery = db.collection('leaves').where('uid', '==', currentUser.uid);
      }
      const [snapshot, leaveSnapshot] = await Promise.all([query.get(), leaveQuery.get()]);
      allRows = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      allLeaveRows = leaveSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));

      // 근로자 본인 목록은 별도 정렬(최신순) - where 절 사용 시 orderBy 인덱스 이슈 회피를 위해 클라이언트에서 정렬
      allRows.sort((a, b) => (b['날짜'] || '').localeCompare(a['날짜'] || ''));

      if (currentRole === 'admin') populateEmployeeFilter();
      renderTable();
      renderCalendar();
    } catch (err) {
      emptyMsg.textContent = '불러오기 실패: ' + err.message;
    }
  }

  function populateEmployeeFilter() {
    const select = document.getElementById('employeeFilter');
    const current = select.value;
    const names = [...new Set([
      ...allRows.map(r => r['사원명']),
      ...allLeaveRows.map(r => r['사원명'])
    ].filter(Boolean))].sort();
    select.innerHTML = '<option value="전체">전체 사원</option>' +
      names.map(n => `<option value="${n}">${n}</option>`).join('');
    if (names.includes(current)) select.value = current;
  }

  function renderTable() {
    const table = document.getElementById('logTable');
    const emptyMsg = document.getElementById('emptyMsg');
    const tbody = document.getElementById('tableBody');

    const filterVal = document.getElementById('employeeFilter').value;
    const rows = (currentRole === 'admin' && filterVal !== '전체')
      ? allRows.filter(r => r['사원명'] === filterVal)
      : allRows;

    if (rows.length === 0) {
      table.style.display = 'none';
      emptyMsg.textContent = '등록된 근무일지가 없습니다.';
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';
    table.style.display = 'table';

    tbody.innerHTML = '';
    rows.forEach(row => {
      const canManage = (row.uid === currentUser.uid) || (currentRole === 'admin');
      const taskTags = (row.tasks ? Object.keys(row.tasks).filter(k => row.tasks[k]) : [])
        .map(t => `<span class="task-tag">${t}</span>`).join('');
      const attach = row.attachment
        ? `<a class="attach-link" href="${row.attachment.url}" target="_blank" rel="noopener">${row.attachment.name}</a>`
        : '';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="nowrap">${row['날짜'] || ''}</td>
        <td class="nowrap">${row['사원명'] || ''}</td>
        <td class="nowrap">${row['출근시간'] || ''}</td>
        <td class="nowrap">${row['퇴근시간'] || ''}</td>
        <td class="nowrap">${row['프로젝트'] || ''}</td>
        <td>${taskTags}</td>
        <td class="detail-cell">${row['상세내용'] || ''}</td>
        <td class="nowrap">${attach}</td>
        <td class="nowrap">
          ${canManage ? `<button class="row-btn danger" data-id="${row.id}">삭제</button>` : ''}
        </td>
      `;
      tbody.appendChild(tr);
    });

    document.querySelectorAll('.row-btn.danger').forEach(btn => {
      btn.addEventListener('click', () => deleteLog(btn.dataset.id));
    });
  }

  async function deleteLog(docId) {
    if (!confirm('이 근무일지를 삭제하시겠습니까?')) return;
    try {
      await db.collection('workLogs').doc(docId).delete();
      await loadLogs();
    } catch (err) {
      alert('삭제 실패: ' + err.message);
    }
  }

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const statusEl = document.getElementById('submitStatus');
    const btn = document.getElementById('submitBtn');

    const date = document.getElementById('f-date').value;
    const checkin = document.getElementById('f-checkin').value;
    const checkout = document.getElementById('f-checkout').value;
    const project = document.getElementById('f-project').value.trim();
    const detail = document.getElementById('f-detail').value.trim();
    const fileInput = document.getElementById('f-file');

    if (!date) {
      statusEl.style.color = '#a4453c';
      statusEl.textContent = '날짜를 입력해 주세요.';
      return;
    }

    const tasks = {};
    document.querySelectorAll('.task-check').forEach(cb => { tasks[cb.value] = cb.checked; });

    btn.disabled = true;
    btn.textContent = '등록 중...';
    statusEl.style.color = 'var(--muted)';
    statusEl.textContent = '등록 중입니다...';

    try {
      const docData = {
        uid: currentUser.uid,
        '사원명': currentDisplayName,
        '날짜': date,
        '출근시간': checkin,
        '퇴근시간': checkout,
        '프로젝트': project,
        tasks: tasks,
        '상세내용': detail,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      if (fileInput.files[0]) {
        const file = fileInput.files[0];
        const path = `worklogs/${currentUser.uid}/${Date.now()}_${file.name}`;
        const ref = storage.ref(path);
        await ref.put(file);
        const url = await ref.getDownloadURL();
        docData.attachment = { name: file.name, url };
      }

      await db.collection('workLogs').add(docData);

      statusEl.style.color = '#3f6b52';
      statusEl.textContent = '등록되었습니다.';
      document.getElementById('f-project').value = '';
      document.getElementById('f-detail').value = '';
      document.getElementById('f-file').value = '';
      document.querySelectorAll('.task-check').forEach(cb => { cb.checked = false; });

      await loadLogs();
    } catch (err) {
      statusEl.style.color = '#a4453c';
      statusEl.textContent = '등록 실패: ' + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = '등록';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async (e) => {
    e.preventDefault();
    await logOut();
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
