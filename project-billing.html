<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pretendard:wght@400;500&display=swap');

  :root{
    --ink:#141414;
    --paper:#f7f6f3;
    --line:#d8d5cd;
    --muted:#8a8578;
    --green:#3f6b52;
    --red:#a4453c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--paper);
    font-family:'Pretendard', -apple-system, sans-serif; color:var(--ink);
  }
  header{
    padding:28px 48px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .eyebrow{
    font-size:11px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--muted); margin-bottom:6px;
  }
  h1{
    font-family:'Cormorant Garamond', serif; font-weight:500;
    font-size:32px; margin:0; letter-spacing:.01em;
  }
  .header-right{ display:flex; align-items:center; gap:24px; }
  .header-right a{
    font-size:13px; color:var(--muted); text-decoration:none;
    border-bottom:1px solid var(--muted); cursor:pointer;
  }
  main{ max-width:1280px; margin:0 auto; padding:40px 48px; }

  .panel{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    padding:24px; margin-bottom:24px;
  }
  .panel-title{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); margin-bottom:16px;
  }

  .summary-bar{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:24px; }
  .summary-chip{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    padding:14px 20px; font-size:13px; color:var(--muted); flex:1; min-width:150px;
  }
  .summary-chip b{ color:var(--ink); font-size:18px; display:block; margin-top:4px; }
  .summary-chip.warn b{ color:var(--red); }

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:center; }
  .toolbar select, .toolbar input{
    padding:8px 10px; border:1px solid var(--line); border-radius:4px;
    font-family:inherit; font-size:13px; background:#fff;
  }
  .toolbar input[type="text"]{ flex:1; min-width:180px; }
  .add-btn{
    padding:8px 16px; background:var(--ink); color:var(--paper);
    border:none; font-size:12.5px; letter-spacing:.05em; cursor:pointer; border-radius:4px;
  }

  .project-card{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    margin-bottom:12px; overflow:hidden;
  }
  .project-head{
    display:flex; align-items:center; gap:14px; padding:16px 18px; cursor:pointer;
  }
  .project-head:hover{ background:#fafaf8; }
  .project-name{ font-size:14.5px; font-weight:500; }
  .project-sub{ font-size:12px; color:var(--muted); margin-top:3px; }
  .project-meta{ margin-left:auto; display:flex; gap:22px; align-items:center; flex-wrap:wrap; }
  .project-meta .m-item{ text-align:right; font-size:11.5px; color:var(--muted); min-width:90px; }
  .project-meta .m-item b{ display:block; font-size:13.5px; color:var(--ink); font-weight:500; margin-top:2px; }
  .status-badge{
    display:inline-block; font-size:11px; padding:3px 10px; border-radius:12px;
    background:#ece9e2; color:#7a766c; white-space:nowrap;
  }
  .status-badge.done{ background:#dfe9e2; color:var(--green); }
  .status-badge.review{ background:#fbe4e2; color:var(--red); }
  .source-tag{
    font-size:10px; padding:2px 7px; border-radius:10px; background:#f1eee6; color:var(--muted);
    margin-left:8px;
  }

  .project-body{ display:none; border-top:1px solid var(--line); padding:18px; background:#fcfbf9; }
  .project-body.open{ display:block; }

  .subsection-title{ font-size:11.5px; color:var(--muted); margin:0 0 10px; letter-spacing:.06em; text-transform:uppercase; }

  table.mini{ width:100%; border-collapse:collapse; margin-bottom:20px; }
  table.mini th{
    text-align:left; font-size:11px; color:var(--muted); font-weight:500;
    padding:7px 8px; border-bottom:1px solid var(--line);
  }
  table.mini td{ padding:8px; font-size:13px; border-bottom:1px solid var(--line); }
  table.mini tr:last-child td{ border-bottom:none; }
  .amt-in{ color:var(--green); }
  .amt-out{ color:var(--red); }

  .edit-row input, .edit-row select{
    width:100%; padding:6px 7px; border:1px solid var(--line); border-radius:4px;
    font-family:inherit; font-size:12.5px;
  }
  .row-btn{
    font-size:11.5px; background:none; border:none; cursor:pointer;
    text-decoration:underline; color:var(--muted); margin-right:8px; padding:0;
  }
  .row-btn.danger{ color:var(--red); }

  .inline-add{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:flex-end; }
  .inline-add .field{ display:flex; flex-direction:column; gap:4px; }
  .inline-add label{ font-size:10.5px; color:var(--muted); }
  .inline-add input, .inline-add select{
    padding:6px 8px; border:1px solid var(--line); border-radius:4px; font-family:inherit; font-size:12.5px;
  }
  .inline-add button{
    padding:7px 14px; background:var(--ink); color:var(--paper); border:none;
    font-size:11.5px; cursor:pointer; border-radius:4px; height:31px;
  }

  .project-edit-form{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); }
  .project-edit-form .form-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .project-edit-form .field{ display:flex; flex-direction:column; gap:4px; }
  .project-edit-form label{ font-size:10.5px; color:var(--muted); }
  .project-edit-form input, .project-edit-form select, .project-edit-form textarea{
    padding:7px 9px; border:1px solid var(--line); border-radius:4px; font-family:inherit; font-size:12.5px; min-width:140px;
  }
  .project-edit-form textarea{ width:100%; min-height:60px; resize:vertical; }

  .status-line{ font-size:12.5px; margin-top:8px; min-height:16px; }
  .empty{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    padding:36px; text-align:center; color:var(--muted); font-size:13.5px;
  }
  .content-box{
    white-space:pre-line; font-size:12.5px; color:#54514a; background:#f4f2ec;
    border-radius:4px; padding:10px 12px; margin-bottom:16px; line-height:1.6;
  }

  @media (max-width: 720px) {
    header{ padding:20px !important; flex-wrap:wrap; gap:10px; }
    .header-right{ flex-wrap:wrap; gap:12px !important; }
    main{ padding:24px 16px !important; }
    h1{ font-size:24px !important; }
    input, select, textarea{ font-size:16px !important; }
    .project-head{ flex-wrap:wrap; }
    .project-meta{ margin-left:0; width:100%; justify-content:space-between; }
    table.mini{ min-width:0 !important; }
  }
</style>
</head>

  });

<script>
  const projectsRef = db.collection('billingProjects');
  let allProjects = [];
  let openIds = new Set();
  let editingProjectId = null;
  let activeStatus = '전체';
  let activeCategory = '전체';
  let searchText = '';

  function fmtWon(n){ return (Math.round(n) || 0).toLocaleString() + '원'; }
  function num(v){ return Number(v) || 0; }
  function esc(s){ return String(s || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }

  function totalClaim(p){
    if (p.rounds && p.rounds.length) return p.rounds.reduce((s, r) => s + num(r.claimAmount), 0);
    return 0;
  }
  function totalCollect(p){
    if (p.rounds && p.rounds.length) return p.rounds.reduce((s, r) => s + num(r.collectAmount), 0);
    return 0;
  }
  function outstanding(p){
    const claim = totalClaim(p);
    if (!claim) return 0;
    return claim - totalCollect(p);
  }

  async function seedIfEmpty(){
    const snap = await projectsRef.limit(1).get();
    if (!snap.empty) return;
    const batch = db.batch();
    EMBEDDED_PROJECTS.forEach((p, i) => {
      const docRef = projectsRef.doc();
      batch.set(docRef, Object.assign({}, p, { order: i, createdAt: firebase.firestore.FieldValue.serverTimestamp() }));
    });
    await batch.commit();
  }

  async function loadProjects(){
    await seedIfEmpty();
    const snap = await projectsRef.orderBy('order', 'asc').get();
    allProjects = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderAll();
  }

  function renderAll(){
    const main = document.getElementById('mainArea');
    main.innerHTML = `
      <div class="summary-bar" id="summaryBar"></div>
      <div class="panel" style="padding:16px 18px;">
        <div class="toolbar">
          <select id="statusFilter">
            <option value="전체">전체 상태</option>
          </select>
          <select id="categoryFilter">
            <option value="전체">전체 구분</option>
            <option value="공사">공사</option>
            <option value="설계">설계</option>
          </select>
          <input type="text" id="searchInput" placeholder="계약명 · 거래처명 검색">
          <button class="add-btn" id="newProjectBtn">+ 새 프로젝트</button>
        </div>
      </div>
      <div id="projectList"></div>
      <div class="empty" id="emptyMsg" style="display:none;">조건에 맞는 프로젝트가 없습니다.</div>
    `;

    // 상태 옵션 동적 채우기
    const statuses = [...new Set(allProjects.map(p => p.status).filter(Boolean))].sort();
    document.getElementById('statusFilter').innerHTML =
      '<option value="전체">전체 상태</option>' + statuses.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
    document.getElementById('statusFilter').value = activeStatus;
    document.getElementById('categoryFilter').value = activeCategory;
    document.getElementById('searchInput').value = searchText;

    document.getElementById('statusFilter').addEventListener('change', (e) => { activeStatus = e.target.value; renderList(); });
    document.getElementById('categoryFilter').addEventListener('change', (e) => { activeCategory = e.target.value; renderList(); });
    document.getElementById('searchInput').addEventListener('input', (e) => { searchText = e.target.value.trim(); renderList(); });
    document.getElementById('newProjectBtn').addEventListener('click', createBlankProject);

    renderSummary();
    renderList();
  }

  function renderSummary(){
    const bar = document.getElementById('summaryBar');
    const totalContract = allProjects.reduce((s, p) => s + num(p.contractAmount), 0);
    const totalCol = allProjects.reduce((s, p) => s + totalCollect(p), 0);
    const totalOut = allProjects.reduce((s, p) => s + outstanding(p), 0);
    const inProgress = allProjects.filter(p => p.status && !['완료', '지급완료'].includes(p.status)).length;

    bar.innerHTML = `
      <div class="summary-chip">프로젝트 수<b>${allProjects.length}건</b></div>
      <div class="summary-chip">총계약금 합계<b>${fmtWon(totalContract)}</b></div>
      <div class="summary-chip">총수금 합계<b>${fmtWon(totalCol)}</b></div>
      <div class="summary-chip ${totalOut > 0 ? 'warn' : ''}">청구미수금 합계<b>${fmtWon(totalOut)}</b></div>
      <div class="summary-chip">진행중/확인필요<b>${inProgress}건</b></div>
    `;
  }

  function statusClass(status){
    if (['완료', '지급완료'].includes(status)) return 'done';
    if (status === '확인필요') return 'review';
    return '';
  }

  function renderList(){
    const listEl = document.getElementById('projectList');
    const emptyMsg = document.getElementById('emptyMsg');

    let rows = allProjects;
    if (activeStatus !== '전체') rows = rows.filter(p => p.status === activeStatus);
    if (activeCategory !== '전체') rows = rows.filter(p => (p.category || '').includes(activeCategory));
    if (searchText) {
      const q = searchText.toLowerCase();
      rows = rows.filter(p => (p.name || '').toLowerCase().includes(q) || (p.client || '').toLowerCase().includes(q));
    }

    if (rows.length === 0) {
      listEl.innerHTML = '';
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';

    listEl.innerHTML = rows.map(p => renderProjectCard(p)).join('');

    rows.forEach(p => {
      const head = document.querySelector(`[data-head="${p.id}"]`);
      if (head) head.addEventListener('click', () => toggleOpen(p.id));
    });

    rows.forEach(p => {
      if (openIds.has(p.id)) bindCardEvents(p);
    });
  }

  function toggleOpen(id){
    if (openIds.has(id)) openIds.delete(id); else openIds.add(id);
    renderList();
  }

  function renderProjectCard(p){
    const isOpen = openIds.has(p.id);
    const claim = totalClaim(p);
    const collect = totalCollect(p);
    const out = outstanding(p);

    return `
      <div class="project-card">
        <div class="project-head" data-head="${p.id}">
          <div>
            <div class="project-name">${esc(p.name)}</div>
            <div class="project-sub">${esc(p.client || '-')} · ${esc(p.category || '-')}${p.contractDate ? ' · 계약 ' + p.contractDate : ''}</div>
          </div>
          <div class="project-meta">
            <div class="m-item">총계약금<b>${p.contractAmount ? fmtWon(p.contractAmount) : '-'}</b></div>
            <div class="m-item">청구액<b>${claim ? fmtWon(claim) : '-'}</b></div>
            <div class="m-item">수금액<b>${fmtWon(collect)}</b></div>
            <div class="m-item">미수금<b style="${out > 0 ? 'color:var(--red);' : ''}">${claim ? fmtWon(out) : '-'}</b></div>
            <span class="status-badge ${statusClass(p.status)}">${esc(p.status || '-')}</span>
          </div>
        </div>
        <div class="project-body ${isOpen ? 'open' : ''}" data-body="${p.id}">
          ${isOpen ? renderProjectBody(p) : ''}
        </div>
      </div>
    `;
  }

  function renderProjectBody(p){
    const roundsHtml = (p.rounds || []).length ? `
      <div class="subsection-title">회차별 청구 / 수금</div>
      <table class="mini">
        <thead><tr><th>회차</th><th>청구금액</th><th>수금금액</th><th>관리</th></tr></thead>
        <tbody id="rounds-${p.id}">
          ${p.rounds.map((r, i) => `
            <tr>
              <td>${r.round}차</td>
              <td>${fmtWon(r.claimAmount)}</td>
              <td>${fmtWon(r.collectAmount)}</td>
              <td>
                <button class="row-btn" data-round-edit="${p.id}:${i}">수정</button>
                <button class="row-btn danger" data-round-del="${p.id}:${i}">삭제</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div class="inline-add">
        <div class="field"><label>회차</label><input type="number" id="nr-round-${p.id}" style="width:60px;" value="${(p.rounds.length || 0) + 1}"></div>
        <div class="field"><label>청구금액</label><input type="text" inputmode="numeric" id="nr-claim-${p.id}" class="money-in" style="width:120px;" placeholder="0"></div>
        <div class="field"><label>수금금액</label><input type="text" inputmode="numeric" id="nr-collect-${p.id}" class="money-in" style="width:120px;" placeholder="0"></div>
        <button data-round-add="${p.id}">회차 추가</button>
      </div>
    ` : `
      <div class="subsection-title">회차별 청구 / 수금 (없음 — 은행 거래내역만 이관된 건)</div>
      <div class="inline-add">
        <div class="field"><label>회차</label><input type="number" id="nr-round-${p.id}" style="width:60px;" value="1"></div>
        <div class="field"><label>청구금액</label><input type="text" inputmode="numeric" id="nr-claim-${p.id}" class="money-in" style="width:120px;" placeholder="0"></div>
        <div class="field"><label>수금금액</label><input type="text" inputmode="numeric" id="nr-collect-${p.id}" class="money-in" style="width:120px;" placeholder="0"></div>
        <button data-round-add="${p.id}">회차 추가</button>
      </div>
    `;

    const contentHtml = p.content ? `<div class="subsection-title">진행 메모</div><div class="content-box">${esc(p.content)}</div>` : '';
    const noteHtml = p.note ? `<div class="subsection-title">특이사항</div><div class="content-box">${esc(p.note)}</div>` : '';
    const extraInfo = `
      <div class="subsection-title">추가 정보</div>
      <table class="mini" style="margin-bottom:20px;">
        <tbody>
          <tr><td style="color:var(--muted); width:120px;">최종사업비</td><td>${p.finalCost ? fmtWon(p.finalCost) : '-'}</td>
              <td style="color:var(--muted); width:100px;">착수일</td><td>${p.startDate || '-'}</td></tr>
          <tr><td style="color:var(--muted);">코드</td><td>${esc(p.code || '-')}</td>
              <td style="color:var(--muted);">종료일</td><td>${p.endDate || '-'}</td></tr>
        </tbody>
      </table>
    `;

    return `
      ${contentHtml}
      ${noteHtml}
      ${extraInfo}
      ${roundsHtml}
      <button class="row-btn" data-project-edit="${p.id}" style="margin-top:6px;">프로젝트 정보 수정</button>
      <button class="row-btn danger" data-project-del="${p.id}">프로젝트 삭제</button>
      <div id="editForm-${p.id}"></div>
      <div class="status-line" id="status-${p.id}"></div>
    `;
  }

  function bindCardEvents(p){
    const addRoundBtn = document.querySelector(`[data-round-add="${p.id}"]`);
    if (addRoundBtn) addRoundBtn.addEventListener('click', () => addRound(p.id));

    document.querySelectorAll(`[data-round-del^="${p.id}:"]`).forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.roundDel.split(':')[1]);
        deleteRound(p.id, idx);
      });
    });
    document.querySelectorAll(`[data-round-edit^="${p.id}:"]`).forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.roundEdit.split(':')[1]);
        editRoundPrompt(p.id, idx);
      });
    });

    const editBtn = document.querySelector(`[data-project-edit="${p.id}"]`);
    if (editBtn) editBtn.addEventListener('click', () => openProjectEditForm(p.id));

    const delBtn = document.querySelector(`[data-project-del="${p.id}"]`);
    if (delBtn) delBtn.addEventListener('click', () => deleteProject(p.id));
  }

  function parseMoney(el){
    return Number(String(el.value || '').replace(/[^\d]/g, '')) || 0;
  }

  async function addRound(id){
    const p = allProjects.find(x => x.id === id);
    const round = Number(document.getElementById(`nr-round-${id}`).value) || (p.rounds.length + 1);
    const claimAmount = parseMoney(document.getElementById(`nr-claim-${id}`));
    const collectAmount = parseMoney(document.getElementById(`nr-collect-${id}`));
    const rounds = [...(p.rounds || []), { round, claimAmount, collectAmount }];
    await projectsRef.doc(id).update({ rounds });
    await loadProjects();
  }

  async function deleteRound(id, idx){
    if (!confirm('이 회차를 삭제할까요?')) return;
    const p = allProjects.find(x => x.id === id);
    const rounds = p.rounds.filter((_, i) => i !== idx);
    await projectsRef.doc(id).update({ rounds });
    await loadProjects();
  }

  async function editRoundPrompt(id, idx){
    const p = allProjects.find(x => x.id === id);
    const r = p.rounds[idx];
    const newClaim = prompt('청구금액', r.claimAmount);
    if (newClaim === null) return;
    const newCollect = prompt('수금금액', r.collectAmount);
    if (newCollect === null) return;
    const rounds = [...p.rounds];
    rounds[idx] = { round: r.round, claimAmount: Number(newClaim) || 0, collectAmount: Number(newCollect) || 0 };
    await projectsRef.doc(id).update({ rounds });
    await loadProjects();
  }

  function openProjectEditForm(id){
    const p = allProjects.find(x => x.id === id);
    const container = document.getElementById(`editForm-${id}`);
    container.innerHTML = `
      <div class="project-edit-form">
        <div class="form-row">
          <div class="field" style="min-width:220px;"><label>계약명</label><input type="text" id="ep-name-${id}" value="${esc(p.name)}"></div>
          <div class="field"><label>거래처명</label><input type="text" id="ep-client-${id}" value="${esc(p.client)}"></div>
          <div class="field"><label>구분</label>
            <select id="ep-category-${id}">
              <option value="공사" ${p.category === '공사' ? 'selected' : ''}>공사</option>
              <option value="설계" ${p.category === '설계' ? 'selected' : ''}>설계</option>
            </select>
          </div>
          <div class="field"><label>상태</label><input type="text" id="ep-status-${id}" value="${esc(p.status)}" placeholder="완료/진행중 등"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>계약일자</label><input type="date" id="ep-contractDate-${id}" value="${p.contractDate || ''}"></div>
          <div class="field"><label>시작일</label><input type="date" id="ep-startDate-${id}" value="${p.startDate || ''}"></div>
          <div class="field"><label>종료일</label><input type="date" id="ep-endDate-${id}" value="${p.endDate || ''}"></div>
          <div class="field"><label>총계약금(부가세포함)</label><input type="text" inputmode="numeric" id="ep-contractAmount-${id}" class="money-in" value="${p.contractAmount ? p.contractAmount.toLocaleString('ko-KR') : ''}"></div>
          <div class="field"><label>최종사업비</label><input type="text" inputmode="numeric" id="ep-finalCost-${id}" class="money-in" value="${p.finalCost ? p.finalCost.toLocaleString('ko-KR') : ''}"></div>
        </div>
        <div class="field" style="margin-bottom:10px;"><label>특이사항</label><textarea id="ep-note-${id}">${esc(p.note)}</textarea></div>
        <button class="add-btn" id="ep-save-${id}">저장</button>
        <button class="row-btn" id="ep-cancel-${id}" style="margin-left:8px;">취소</button>
      </div>
    `;
    document.getElementById(`ep-save-${id}`).addEventListener('click', () => saveProjectEdit(id));
    document.getElementById(`ep-cancel-${id}`).addEventListener('click', () => { container.innerHTML = ''; });
  }

  async function saveProjectEdit(id){
    const statusEl = document.getElementById(`status-${id}`);
    const updateData = {
      name: document.getElementById(`ep-name-${id}`).value.trim(),
      client: document.getElementById(`ep-client-${id}`).value.trim(),
      category: document.getElementById(`ep-category-${id}`).value,
      status: document.getElementById(`ep-status-${id}`).value.trim(),
      contractDate: document.getElementById(`ep-contractDate-${id}`).value || null,
      startDate: document.getElementById(`ep-startDate-${id}`).value || null,
      endDate: document.getElementById(`ep-endDate-${id}`).value || null,
      contractAmount: parseMoney(document.getElementById(`ep-contractAmount-${id}`)),
      finalCost: parseMoney(document.getElementById(`ep-finalCost-${id}`)),
      note: document.getElementById(`ep-note-${id}`).value.trim()
    };
    try {
      await projectsRef.doc(id).update(updateData);
      await loadProjects();
    } catch (err) {
      statusEl.style.color = 'var(--red)';
      statusEl.textContent = '저장 실패: ' + err.message;
    }
  }

  async function deleteProject(id){
    const p = allProjects.find(x => x.id === id);
    if (!confirm(`"${p.name}" 프로젝트를 삭제할까요? 회차/거래 이력이 모두 함께 삭제됩니다.`)) return;
    await projectsRef.doc(id).delete();
    await loadProjects();
  }

  async function createBlankProject(){
    const name = prompt('새 프로젝트의 계약명을 입력하세요');
    if (!name) return;
    await projectsRef.add({
      source: 'manual', name, client: '', category: '공사', status: '진행중',
      contractDate: null, startDate: null, endDate: null, contractAmount: 0,
      note: '', content: '', rounds: [], finalCost: 0,
      order: Date.now(), createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await loadProjects();
  }

  auth.onAuthStateChanged((user) => {
    if (user) loadProjects();
  });

  // 금액 입력칸(money-in) 실시간 콤마 포맷팅 — 동적으로 계속 새로 생기는 요소들이라 이벤트 위임 방식 사용
  document.addEventListener('input', (e) => {
    if (!e.target.classList || !e.target.classList.contains('money-in')) return;
    const el = e.target;
    const cursorFromEnd = el.value.length - el.selectionStart;
    const digits = el.value.replace(/[^\d]/g, '');
    el.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
    const pos = Math.max(0, el.value.length - cursorFromEnd);
    el.setSelectionRange(pos, pos);
  });
</script>
</body>
</html>
