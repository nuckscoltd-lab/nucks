<title>프로젝트 결산 | NUCKS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pretendard:wght@400;500&display=swap');

  :root{
    --ink:#141414;
    --paper:#f7f6f3;
    --line:#d8d5cd;
    --muted:#8a8578;
    --green:#3f6b52;
    --red:#a4453c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--paper);
    font-family:'Pretendard', -apple-system, sans-serif; color:var(--ink);
  }
  header{
    padding:28px 48px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .eyebrow{
    font-size:11px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--muted); margin-bottom:6px;
  }
  h1{
    font-family:'Cormorant Garamond', serif; font-weight:500;
    font-size:32px; margin:0; letter-spacing:.01em;
  }
  .header-right{ display:flex; align-items:center; gap:24px; }
  .header-right a{
    font-size:13px; color:var(--muted); text-decoration:none;
    border-bottom:1px solid var(--muted); cursor:pointer;
  }
  main{ max-width:1280px; margin:0 auto; padding:40px 48px; }

  .panel{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    padding:24px; margin-bottom:24px;
  }
  .panel-title{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); margin-bottom:16px;
  }

  .summary-bar{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:24px; }
  .summary-chip{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    padding:14px 20px; font-size:13px; color:var(--muted); flex:1; min-width:150px;
  }
  .summary-chip b{ color:var(--ink); font-size:18px; display:block; margin-top:4px; }

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:center; }
  .toolbar select, .toolbar input{
    padding:8px 10px; border:1px solid var(--line); border-radius:4px;
    font-family:inherit; font-size:13px; background:#fff;
  }
  .toolbar input[type="text"]{ flex:1; min-width:180px; }
  .add-btn{
    padding:8px 16px; background:var(--ink); color:var(--paper);
    border:none; font-size:12.5px; letter-spacing:.05em; cursor:pointer; border-radius:4px;
  }
  .row-btn{
    font-size:11.5px; background:none; border:none; cursor:pointer;
    text-decoration:underline; color:var(--muted); margin-right:8px; padding:0;
  }
  .row-btn.danger{ color:var(--red); }

  .proj-card{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    margin-bottom:12px; overflow:hidden;
  }
  .proj-head{
    display:flex; align-items:center; gap:14px; padding:16px 18px; cursor:pointer; flex-wrap:wrap;
  }
  .proj-head:hover{ background:#fafaf8; }
  .proj-name{ font-size:14.5px; font-weight:500; }
  .proj-sub{ font-size:12px; color:var(--muted); margin-top:3px; }
  .proj-meta{ margin-left:auto; display:flex; gap:22px; align-items:center; flex-wrap:wrap; }
  .proj-meta .m-item{ text-align:right; font-size:11.5px; color:var(--muted); min-width:90px; }
  .proj-meta .m-item b{ display:block; font-size:13px; color:var(--ink); font-weight:500; margin-top:2px; }
  .tag{
    display:inline-block; font-size:11px; padding:3px 10px; border-radius:12px;
    background:#ece9e2; color:#7a766c; white-space:nowrap;
  }

  .proj-body{ display:none; border-top:1px solid var(--line); padding:20px; background:#fcfbf9; }
  .proj-body.open{ display:block; }
  .subsection-title{ font-size:11.5px; color:var(--muted); margin:18px 0 10px; letter-spacing:.06em; text-transform:uppercase; }
  .subsection-title:first-child{ margin-top:0; }

  table.mini{ width:100%; border-collapse:collapse; margin-bottom:8px; }
  table.mini th{
    text-align:left; font-size:11px; color:var(--muted); font-weight:500;
    padding:7px 8px; border-bottom:1px solid var(--line);
  }
  table.mini td{ padding:8px; font-size:13px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.mini tr:last-child td{ border-bottom:none; }

  .partner-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; }
  .partner-box{ background:#fff; border:1px solid var(--line); border-radius:6px; padding:12px 14px; }
  .partner-box .p-label{ font-size:11px; color:var(--muted); margin-bottom:4px; }
  .partner-box .p-company{ font-size:13.5px; font-weight:500; }
  .partner-box .p-contacts{ font-size:12px; color:var(--muted); margin-top:2px; }

  ul.plain-list{ margin:0; padding-left:18px; font-size:13px; line-height:1.7; }
  ul.plain-list li{ margin-bottom:2px; }

  .form-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; align-items:flex-end; }
  .field{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .field.wide{ flex:1; min-width:200px; }
  .field label{ font-size:11px; color:var(--muted); }
  .field input, .field select, .field textarea{
    padding:8px 9px; border:1px solid var(--line); border-radius:4px;
    font-family:inherit; font-size:13px; background:#fff;
  }

  .list-editor{ background:#fff; border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin-bottom:14px; }
  .list-editor .li-row{ display:flex; gap:8px; margin-bottom:8px; align-items:flex-start; }
  .list-editor .li-row input{ flex:1; padding:7px 9px; border:1px solid var(--line); border-radius:4px; font-family:inherit; font-size:12.5px; }
  .list-editor .li-row .li-name{ flex:0 0 160px; }
  .list-editor .li-remove{ background:none; border:none; color:var(--red); cursor:pointer; font-size:12px; text-decoration:underline; padding:7px 0; }
  .list-editor .li-add{ background:#fff; border:1px dashed var(--line); border-radius:4px; padding:6px 12px; font-size:12px; color:var(--muted); cursor:pointer; }
  .list-editor .li-add:hover{ border-color:var(--ink); color:var(--ink); }

  .status-line{ font-size:12.5px; margin-top:8px; min-height:16px; }
  .empty{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    padding:36px; text-align:center; color:var(--muted); font-size:13.5px;
  }

  @media (max-width: 720px) {
    header{ padding:20px !important; flex-wrap:wrap; gap:10px; }
    .header-right{ flex-wrap:wrap; gap:12px !important; }
    main{ padding:24px 16px !important; }
    h1{ font-size:24px !important; }
    input, select, textarea{ font-size:16px !important; }
    .proj-head{ flex-wrap:wrap; }
    .proj-meta{ margin-left:0; width:100%; justify-content:space-between; }
    table.mini{ min-width:0 !important; }
  }
</style>
</head>

<script>
  const settlementsRef = db.collection('projectSettlements');
  let allSettlements = [];
  let openIds = new Set();
  let editingId = null;

  let activeOrderer = '전체';
  let searchText = '';
  let startMonth = '';
  let endMonth = '';

  const PARTNER_FIELDS = [
    { key: 'orderer', label: '발주처' },
    { key: 'developer', label: '시행사' },
    { key: 'constructor', label: '건설사' },
    { key: 'architect', label: '건축사' },
    { key: 'salesAgency', label: '분양대행사' }
  ];

  function esc(s){ return String(s || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }

  async function seedIfEmpty(){
    const snap = await settlementsRef.limit(1).get();
    if (!snap.empty) return;
    const batch = db.batch();
    EMBEDDED_SETTLEMENTS.forEach((p, i) => {
      const docRef = settlementsRef.doc();
      batch.set(docRef, Object.assign({}, p, { order: i, createdAt: firebase.firestore.FieldValue.serverTimestamp() }));
    });
    await batch.commit();
  }

  async function loadSettlements(){
    await seedIfEmpty();
    const snap = await settlementsRef.orderBy('order', 'asc').get();
    allSettlements = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderAll();
  }

  function getFilteredSettlements(){
    let rows = allSettlements;
    if (activeOrderer !== '전체') rows = rows.filter(p => (p.partners?.orderer?.company || '(미지정)') === activeOrderer);
    if (startMonth) rows = rows.filter(p => (p.startDate || '').slice(0, 7) >= startMonth);
    if (endMonth) rows = rows.filter(p => (p.startDate || '').slice(0, 7) <= endMonth);
    if (searchText) {
      const q = searchText.toLowerCase();
      rows = rows.filter(p => (p.name || '').toLowerCase().includes(q) || (p.projNo || '').toLowerCase().includes(q));
    }
    return rows;
  }

  function renderAll(){
    const main = document.getElementById('mainArea');
    main.innerHTML = `
      <div class="summary-bar" id="summaryBar"></div>
      <div class="panel" style="padding:16px 18px;">
        <div class="toolbar">
          <select id="ordererFilter"><option value="전체">전체 발주처</option></select>
          <span style="display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted);">
            <input type="month" id="startMonthFilter" style="padding:7px 8px; border:1px solid var(--line); border-radius:4px; font-family:inherit; font-size:13px; background:#fff;">
            ~
            <input type="month" id="endMonthFilter" style="padding:7px 8px; border:1px solid var(--line); border-radius:4px; font-family:inherit; font-size:13px; background:#fff;">
            <button type="button" class="row-btn" id="clearMonthRangeBtn" style="margin-left:2px;">초기화</button>
          </span>
          <input type="text" id="searchInput" placeholder="프로젝트명 · PROJ.NO 검색">
          <button class="add-btn" id="newSettlementBtn">+ 새 결산서</button>
        </div>
      </div>
      <div id="settlementList"></div>
      <div class="empty" id="emptyMsg" style="display:none;">조건에 맞는 결산서가 없습니다.</div>
    `;

    const orderers = [...new Set(allSettlements.map(p => p.partners?.orderer?.company || '(미지정)').filter(Boolean))].sort();
    document.getElementById('ordererFilter').innerHTML =
      '<option value="전체">전체 발주처</option>' + orderers.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('');
    document.getElementById('ordererFilter').value = activeOrderer;
    document.getElementById('startMonthFilter').value = startMonth;
    document.getElementById('endMonthFilter').value = endMonth;
    document.getElementById('searchInput').value = searchText;

    document.getElementById('ordererFilter').addEventListener('change', (e) => { activeOrderer = e.target.value; renderList(); });
    document.getElementById('startMonthFilter').addEventListener('change', (e) => { startMonth = e.target.value; renderList(); });
    document.getElementById('endMonthFilter').addEventListener('change', (e) => { endMonth = e.target.value; renderList(); });
    document.getElementById('clearMonthRangeBtn').addEventListener('click', () => {
      startMonth = ''; endMonth = '';
      document.getElementById('startMonthFilter').value = '';
      document.getElementById('endMonthFilter').value = '';
      renderList();
    });
    document.getElementById('searchInput').addEventListener('input', (e) => { searchText = e.target.value.trim(); renderList(); });
    document.getElementById('newSettlementBtn').addEventListener('click', createBlankSettlement);

    renderList();
  }

  function renderSummary(){
    const bar = document.getElementById('summaryBar');
    const rows = getFilteredSettlements();
    const isFiltered = rows.length !== allSettlements.length;
    const ordererCount = new Set(rows.map(p => p.partners?.orderer?.company).filter(Boolean)).size;
    const inProgress = rows.filter(p => (p.notes || []).some(n => n.includes('예정'))).length;

    bar.innerHTML = `
      <div class="summary-chip">${isFiltered ? '필터된 ' : ''}결산서 건수<b>${rows.length}건${isFiltered ? ` <span style="font-size:11px; color:var(--muted);">/ 전체 ${allSettlements.length}건</span>` : ''}</b></div>
      <div class="summary-chip">참여 발주처 수<b>${ordererCount}곳</b></div>
      <div class="summary-chip">진행중(추정)<b>${inProgress}건</b></div>
    `;
  }

  function renderList(){
    const listEl = document.getElementById('settlementList');
    const emptyMsg = document.getElementById('emptyMsg');

    renderSummary();
    const rows = getFilteredSettlements();

    if (rows.length === 0) {
      listEl.innerHTML = '';
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';

    listEl.innerHTML = rows.map(p => renderCard(p)).join('');

    rows.forEach(p => {
      const head = document.querySelector(`[data-head="${p.id}"]`);
      if (head) head.addEventListener('click', () => toggleOpen(p.id));
    });
    rows.forEach(p => {
      if (openIds.has(p.id)) bindCardEvents(p);
    });
  }

  function toggleOpen(id){
    if (openIds.has(id)) openIds.delete(id); else openIds.add(id);
    editingId = null;
    renderList();
  }

  function renderCard(p){
    const isOpen = openIds.has(p.id);
    return `
      <div class="proj-card">
        <div class="proj-head" data-head="${p.id}">
          <div>
            <div class="proj-name">${esc(p.name)}</div>
            <div class="proj-sub">${esc(p.projNo)} · PM ${esc(p.pm || '-')}</div>
          </div>
          <div class="proj-meta">
            <div class="m-item">기간<b>${p.startDate || '-'} ~ ${p.endDate || '-'}</b></div>
            <div class="m-item">발주처<b>${esc(p.partners?.orderer?.company || '-')}</b></div>
            <span class="tag">${esc(p.partners?.constructor?.company || p.partners?.orderer?.company || '-')}</span>
          </div>
        </div>
        <div class="proj-body ${isOpen ? 'open' : ''}" data-body="${p.id}">
          ${isOpen ? renderBody(p) : ''}
        </div>
      </div>
    `;
  }

  function renderBody(p){
    if (editingId === p.id) return renderEditForm(p);

    const partnerHtml = `
      <div class="subsection-title">대외업체</div>
      <div class="partner-grid">
        ${PARTNER_FIELDS.map(f => `
          <div class="partner-box">
            <div class="p-label">${f.label}</div>
            <div class="p-company">${esc(p.partners?.[f.key]?.company) || '-'}</div>
            ${p.partners?.[f.key]?.contacts ? `<div class="p-contacts">${esc(p.partners[f.key].contacts)}</div>` : ''}
          </div>
        `).join('')}
      </div>
    `;

    const progressHtml = `
      <div class="subsection-title">프로젝트 진행 내용</div>
      ${(p.progressItems || []).length ? `<ul class="plain-list">${p.progressItems.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : '<div style="font-size:12.5px; color:var(--muted);">등록된 내용이 없습니다.</div>'}
    `;

    const peopleHtml = `
      <div class="subsection-title">투입인원</div>
      ${(p.people || []).length ? `
        <table class="mini">
          <thead><tr><th style="width:160px;">이름</th><th>업무 내용</th></tr></thead>
          <tbody>${p.people.map(person => `<tr><td>${esc(person.name)}</td><td>${esc(person.role)}</td></tr>`).join('')}</tbody>
        </table>
      ` : '<div style="font-size:12.5px; color:var(--muted);">등록된 인원이 없습니다.</div>'}
    `;

    const notesHtml = `
      <div class="subsection-title">특이사항</div>
      ${(p.notes || []).length ? `<ul class="plain-list">${p.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : '<div style="font-size:12.5px; color:var(--muted);">등록된 특이사항이 없습니다.</div>'}
    `;

    return `
      ${partnerHtml}
      ${progressHtml}
      ${peopleHtml}
      ${notesHtml}
      <div style="margin-top:18px;">
        <button class="row-btn" data-edit="${p.id}">수정</button>
        <button class="row-btn danger" data-del="${p.id}">삭제</button>
      </div>
      <div class="status-line" id="status-${p.id}"></div>
    `;
  }

  function bindCardEvents(p){
    const editBtn = document.querySelector(`[data-edit="${p.id}"]`);
    if (editBtn) editBtn.addEventListener('click', () => { editingId = p.id; renderList(); });

    const delBtn = document.querySelector(`[data-del="${p.id}"]`);
    if (delBtn) delBtn.addEventListener('click', () => deleteSettlement(p.id));

    if (editingId === p.id) bindEditFormEvents(p.id);
  }

  async function deleteSettlement(id){
    const p = allSettlements.find(x => x.id === id);
    if (!confirm(`"${p.name}" 결산서를 삭제할까요?`)) return;
    await settlementsRef.doc(id).delete();
    openIds.delete(id);
    await loadSettlements();
  }

  // ---------- 목록형(진행내용/특이사항) + 인원(이름+역할) 편집기 ----------
  function renderSimpleListEditor(containerId, items){
    return `
      <div class="list-editor" id="${containerId}">
        ${items.map((v, i) => `
          <div class="li-row" data-idx="${i}">
            <input type="text" class="li-text" value="${esc(v)}">
            <button type="button" class="li-remove" data-remove="${i}">삭제</button>
          </div>
        `).join('')}
        <button type="button" class="li-add" data-add="1">+ 항목 추가</button>
      </div>
    `;
  }

  function renderPeopleListEditor(containerId, people){
    return `
      <div class="list-editor" id="${containerId}">
        ${people.map((person, i) => `
          <div class="li-row" data-idx="${i}">
            <input type="text" class="li-name" placeholder="이름" value="${esc(person.name)}">
            <input type="text" class="li-role" placeholder="업무 내용" value="${esc(person.role)}">
            <button type="button" class="li-remove" data-remove="${i}">삭제</button>
          </div>
        `).join('')}
        <button type="button" class="li-add" data-add="1">+ 인원 추가</button>
      </div>
    `;
  }

  function wireSimpleListEditor(containerId){
    const container = document.getElementById(containerId);
    container.querySelector('.li-add').addEventListener('click', () => {
      const row = document.createElement('div');
      row.className = 'li-row';
      row.innerHTML = `<input type="text" class="li-text" value=""><button type="button" class="li-remove">삭제</button>`;
      row.querySelector('.li-remove').addEventListener('click', () => row.remove());
      container.insertBefore(row, container.querySelector('.li-add'));
    });
    container.querySelectorAll('.li-remove').forEach(btn => {
      btn.addEventListener('click', () => btn.closest('.li-row').remove());
    });
  }

  function wirePeopleListEditor(containerId){
    const container = document.getElementById(containerId);
    container.querySelector('.li-add').addEventListener('click', () => {
      const row = document.createElement('div');
      row.className = 'li-row';
      row.innerHTML = `<input type="text" class="li-name" placeholder="이름" value=""><input type="text" class="li-role" placeholder="업무 내용" value=""><button type="button" class="li-remove">삭제</button>`;
      row.querySelector('.li-remove').addEventListener('click', () => row.remove());
      container.insertBefore(row, container.querySelector('.li-add'));
    });
    container.querySelectorAll('.li-remove').forEach(btn => {
      btn.addEventListener('click', () => btn.closest('.li-row').remove());
    });
  }

  function readSimpleList(containerId){
    const container = document.getElementById(containerId);
    return Array.from(container.querySelectorAll('.li-row .li-text'))
      .map(el => el.value.trim())
      .filter(Boolean);
  }

  function readPeopleList(containerId){
    const container = document.getElementById(containerId);
    return Array.from(container.querySelectorAll('.li-row')).map(row => ({
      name: row.querySelector('.li-name').value.trim(),
      role: row.querySelector('.li-role').value.trim()
    })).filter(p => p.name || p.role);
  }

  function renderEditForm(p){
    return `
      <div class="form-row">
        <div class="field"><label>PROJ. NO.</label><input type="text" id="ef-projNo" value="${esc(p.projNo)}"></div>
        <div class="field wide"><label>프로젝트명</label><input type="text" id="ef-name" value="${esc(p.name)}"></div>
        <div class="field"><label>PM</label><input type="text" id="ef-pm" value="${esc(p.pm)}"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>시작일</label><input type="date" id="ef-startDate" value="${p.startDate || ''}"></div>
        <div class="field"><label>종료일</label><input type="date" id="ef-endDate" value="${p.endDate || ''}"></div>
      </div>

      <div class="subsection-title">대외업체</div>
      <div class="form-row" style="align-items:flex-start;">
        ${PARTNER_FIELDS.map(f => `
          <div class="field">
            <label>${f.label} - 회사명</label>
            <input type="text" id="ef-${f.key}-company" value="${esc(p.partners?.[f.key]?.company)}" style="margin-bottom:6px;">
            <label>${f.label} - 담당자</label>
            <input type="text" id="ef-${f.key}-contacts" value="${esc(p.partners?.[f.key]?.contacts)}">
          </div>
        `).join('')}
      </div>

      <div class="subsection-title">프로젝트 진행 내용</div>
      ${renderSimpleListEditor(`ef-progress-${p.id}`, p.progressItems || [])}

      <div class="subsection-title">투입인원</div>
      ${renderPeopleListEditor(`ef-people-${p.id}`, p.people || [])}

      <div class="subsection-title">특이사항</div>
      ${renderSimpleListEditor(`ef-notes-${p.id}`, p.notes || [])}

      <button class="add-btn" id="ef-save-${p.id}">저장</button>
      <button class="row-btn" id="ef-cancel-${p.id}" style="margin-left:10px;">취소</button>
      <div class="status-line" id="status-${p.id}"></div>
    `;
  }

  function bindEditFormEvents(id){
    wireSimpleListEditor(`ef-progress-${id}`);
    wirePeopleListEditor(`ef-people-${id}`);
    wireSimpleListEditor(`ef-notes-${id}`);

    document.getElementById(`ef-save-${id}`).addEventListener('click', () => saveSettlement(id));
    document.getElementById(`ef-cancel-${id}`).addEventListener('click', () => { editingId = null; renderList(); });
  }

  async function saveSettlement(id){
    const statusEl = document.getElementById(`status-${id}`);
    const partners = {};
    PARTNER_FIELDS.forEach(f => {
      partners[f.key] = {
        company: document.getElementById(`ef-${f.key}-company`).value.trim(),
        contacts: document.getElementById(`ef-${f.key}-contacts`).value.trim()
      };
    });

    const updateData = {
      projNo: document.getElementById('ef-projNo').value.trim(),
      name: document.getElementById('ef-name').value.trim(),
      pm: document.getElementById('ef-pm').value.trim(),
      startDate: document.getElementById('ef-startDate').value || null,
      endDate: document.getElementById('ef-endDate').value || null,
      partners,
      progressItems: readSimpleList(`ef-progress-${id}`),
      people: readPeopleList(`ef-people-${id}`),
      notes: readSimpleList(`ef-notes-${id}`)
    };

    if (!updateData.name) {
      statusEl.style.color = 'var(--red)';
      statusEl.textContent = '프로젝트명을 입력해주세요.';
      return;
    }

    try {
      await settlementsRef.doc(id).update(updateData);
      editingId = null;
      await loadSettlements();
      openIds.add(id);
      renderList();
    } catch (err) {
      statusEl.style.color = 'var(--red)';
      statusEl.textContent = '저장 실패: ' + err.message;
    }
  }

  async function createBlankSettlement(){
    const name = prompt('새 결산서의 프로젝트명을 입력하세요');
    if (!name) return;
    const emptyPartners = {};
    PARTNER_FIELDS.forEach(f => { emptyPartners[f.key] = { company: '', contacts: '' }; });

    const docRef = await settlementsRef.add({
      projNo: '', name, pm: '', startDate: null, endDate: null,
      partners: emptyPartners, progressItems: [], people: [], notes: [],
      order: Date.now(), createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await loadSettlements();
    openIds.add(docRef.id);
    editingId = docRef.id;
    renderList();
  }

  auth.onAuthStateChanged((user) => {
    if (user) loadSettlements();
  });
</script>
</body>
</html>
