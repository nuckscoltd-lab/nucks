<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트 기록부 | NUCKS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 프로젝트 기록부: 프로젝트현황과 같은 틀(거래처·프로젝트·일정 막대)에서 자금 부분을 뺀 읽기 전용 일정 위에,
   협력업체·현장 소통 기록(유선·카톡·회의 등)과 근무일지를 달력으로 모아 보는 페이지 */
:root{
  --bg:#e9ebee; --paper:#ffffff; --ink:#1c2227; --muted:#6b737b; --line:#cfd4d9; --head:#f5f6f8; --off:#eef0f3;
  --accent:#d0702e; --accent-soft:#f6e3d4; --sel:#1f6feb; --danger:#c9372c; --ok:#1e7a44; --okbg:#e3f3e8; --warn:#b35a14; --warnbg:#fdecdc; --bad:#b3261e; --badbg:#fbe1df;
  --font-ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; --font-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding:14px max(16px,env(safe-area-inset-left,0px)) 40px;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grp{display:flex;gap:4px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px}
.btn{border:0;background:transparent;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;text-decoration:none;color:inherit;display:inline-block}
.btn:hover{background:var(--head)}
.btn.pri{background:var(--accent);color:#fff}.btn.pri:hover{filter:brightness(1.06)}
.btn.line{border:1px solid var(--line);background:var(--paper)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:default}
.inp{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px;min-width:0}
textarea.inp{width:100%;resize:vertical;line-height:1.55}
.hint{color:var(--muted);font-size:12px;line-height:1.5}
.stat{font-family:var(--font-num);font-size:12px;color:var(--muted);padding:0 6px}
h1{font-size:19px;margin:0}
.tt{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}

/* 위쪽 요약 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.card h3{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:8px}
.card h3 small{font-weight:400;color:var(--muted)}
.li{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-top:1px solid var(--off);cursor:pointer;min-width:0}
.li:first-of-type{border-top:0}
.li:hover{background:var(--head)}
.li .d{font-family:var(--font-num);font-size:11.5px;color:var(--muted);flex:none;width:44px}
.li .p{color:var(--muted);flex:none;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li.over .d{color:var(--bad);font-weight:600}
.empty{color:var(--muted);padding:8px 0;font-size:12.5px}

/* 일정판(프로젝트현황과 같은 틀, 읽기 전용) */
.board{background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:auto;max-height:calc(100vh - 150px);position:relative}
.rw{display:flex;width:max-content;min-width:100%;border-bottom:1px solid var(--off);height:40px}
.rw.hd{position:sticky;top:0;z-index:6;height:44px;background:var(--head);border-bottom:1px solid var(--line)}
.rw.gh{height:26px;background:#faf6f2;border-bottom:1px solid var(--line)}
.lf{position:sticky;left:0;z-index:4;width:310px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--paper);border-right:1px solid var(--line)}
.rw.hd .lf{background:var(--head);z-index:7;font-weight:600;color:var(--muted);font-size:12px}
.rw.gh .lf{background:#faf6f2;font-weight:700;width:310px}
.rw.gh .tl{background:#faf6f2}
.rw:not(.hd):not(.gh):hover .lf,.rw:not(.hd):not(.gh):hover .rt{background:#fff8f1}
.rw:not(.hd):not(.gh){cursor:pointer}
.lf .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.pill{font-size:10.5px;border-radius:9px;padding:0 7px;line-height:1.55;background:var(--head);color:var(--muted);flex:none;white-space:nowrap;border:1px solid var(--line)}
.pill.on{background:var(--accent-soft);color:var(--warn);border-color:#e9c4a6}
.pill.done{background:#eceae7;color:#7a726b}
.pill.lost{background:var(--badbg);color:var(--bad);border-color:#efbcb8}
.pill.ct{background:#eaf1fe;color:#1d54b8;border-color:#c5d8fa}
.tl{position:relative;flex:none;height:100%}
.rt{position:sticky;right:0;z-index:4;width:150px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--paper);border-left:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.rw.hd .rt{background:var(--head);z-index:7;font-weight:600}
.rt b{color:var(--ink);font-family:var(--font-num);font-weight:500}
.rt .open{background:var(--badbg);color:var(--bad);border-radius:8px;padding:0 6px;font-weight:600}
.mo{position:absolute;top:0;height:100%;border-left:1px solid var(--line);font-size:11px;color:var(--muted);padding:4px 5px;white-space:nowrap;overflow:hidden;text-overflow:clip;box-sizing:border-box}
.mo.yr{border-left:2px solid #9aa2aa}
.mo.yr b{color:var(--ink)}
.vl{position:absolute;top:0;bottom:0;border-left:1px solid #eef0f3;pointer-events:none}
.vl.y{border-left:1px solid #cfd4d9}
.today{position:absolute;top:0;bottom:0;border-left:2px solid #e24b3f;opacity:.7;z-index:2;pointer-events:none}
.bar-b{position:absolute;top:13px;height:14px;border-radius:3px;font-size:10px;line-height:14px;color:#fff;padding:0 4px;overflow:hidden;white-space:nowrap;opacity:.9}
.bar-b.pt{top:11px;height:18px;width:18px!important;margin-left:-9px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.25);padding:0}
.mk{position:absolute;top:2px;width:9px;height:9px;margin-left:-4px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2);z-index:3}
.mk.o{box-shadow:0 0 0 2px var(--bad)}
.mk:hover{transform:scale(1.5)}
.ev{position:absolute;bottom:2px;width:5px;height:5px;margin-left:-2px;background:#b6bdc4;border-radius:50%;opacity:.8}
.grp-label{font-size:12px}

/* 오버레이·팝업 공통 */
.ov{position:fixed;inset:0;background:rgba(20,26,34,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.md{background:var(--paper);border-radius:12px;width:min(1180px,100%);height:min(900px,94vh);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);min-height:0}
.md.sm{width:min(720px,100%);height:auto;max-height:92vh}
.md.mid{width:min(900px,100%);height:auto;max-height:92vh}
.mh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mh h2{margin:0;font-size:16px;flex:1;min-width:200px}
.mh h2 small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
.mb{padding:14px 16px;overflow:auto;flex:1;min-height:0}
.mf{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.x{border:0;background:none;font-size:24px;line-height:1;color:var(--muted);cursor:pointer}

/* 프로젝트 팝업 */
.fb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--head)}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:2px 10px;cursor:pointer;font-size:12px;user-select:none;display:inline-flex;gap:5px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.off{opacity:.45}
.minimap{display:flex;gap:3px;overflow-x:auto;padding:8px 16px;border-bottom:1px solid var(--line)}
.mm{flex:none;min-width:46px;border:1px solid var(--line);border-radius:6px;padding:2px 5px;text-align:center;cursor:pointer;font-size:10.5px;color:var(--muted);background:var(--paper)}
.mm b{display:block;font-size:12px;font-family:var(--font-num);font-weight:500;color:var(--ink)}
.mm.on{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.mm.pj{background:#fbf5ee}
.mm .bt{height:4px;border-radius:2px;margin-top:3px;background:#e7eaed;position:relative;overflow:hidden}
.mm .bt s{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.mm .bt u{position:absolute;left:0;top:0;bottom:0;background:#9fb4cf;opacity:.8;height:2px;text-decoration:none}
.pjb{display:grid;grid-template-columns:minmax(0,1fr) 340px;flex:1;min-height:0}
.calw{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}
.calh{display:flex;align-items:center;gap:8px;padding:8px 16px}
.calh h3{margin:0;font-size:17px;min-width:110px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:1;min-height:0;overflow:auto;grid-auto-rows:minmax(92px,1fr);border-top:1px solid var(--line)}
.dw{padding:3px 6px;font-size:11.5px;color:var(--muted);background:var(--head);border-bottom:1px solid var(--line);border-right:1px solid var(--off);text-align:center;position:sticky;top:0;z-index:2;grid-row:1;height:24px}
.cal{grid-template-rows:24px;grid-auto-rows:minmax(92px,1fr)}
.dc{border-right:1px solid var(--off);border-bottom:1px solid var(--off);padding:2px 3px;min-width:0;cursor:pointer;position:relative;overflow:hidden}
.dc:hover{background:#fff8f1}
.dc.out{background:#fafafa;color:#b3b9bf}
.dc.inpj{background:#fffaf4}
.dc.sel{box-shadow:inset 0 0 0 2px var(--sel);z-index:1}
.dc .n{font-size:11.5px;font-family:var(--font-num);padding:0 3px;display:inline-block;border-radius:9px}
.dc.td .n{background:#e24b3f;color:#fff}
.dc.sun .n{color:#d4392e}.dc.sat .n{color:#2d6bd1}
.dc.hol .n{color:#d4392e}
.ch{display:block;font-size:11px;line-height:1.35;border-radius:3px;padding:0 4px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:color-mix(in srgb,var(--c) 16%,#fff);border-left:3px solid var(--c);color:#222;cursor:pointer}
.ch.open{font-weight:600}
.ch.due{background:#fff;border:1px dashed var(--c);border-left:3px solid var(--c)}
.ch.wl{background:#eef1f4;border-left:3px solid #9aa4ad;color:#4c555d}
.more{font-size:10.5px;color:var(--muted);padding:0 4px}
.side{overflow:auto;padding:12px 14px;min-height:0}
.side h4{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.rc{border:1px solid var(--line);border-left:4px solid var(--c,#999);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:#fff}
.rc.hl{box-shadow:0 0 0 2px var(--sel)}
.rc .hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.rc .tt2{font-weight:600;font-size:13.5px;margin:3px 0}
.rc .ct{white-space:pre-wrap;line-height:1.55;font-size:12.5px;word-break:break-word}
.rc .ft{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.bd{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:0 6px;color:#fff;background:var(--c,#6b7280)}
.tg{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;background:var(--head);color:#555;border:1px solid var(--line)}
.tg.over{background:var(--badbg);color:var(--bad);border-color:#efbcb8}
.tg.hi{background:#fde2e2;color:#b3261e}
.tg.ok{background:var(--okbg);color:var(--ok)}
.th{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.th img{width:72px;height:72px;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:6px;cursor:zoom-in;background:#f3f4f6}
.wlc{border:1px solid var(--line);border-left:4px solid #9aa4ad;border-radius:8px;padding:6px 10px;margin-bottom:6px;background:#f8f9fa;font-size:12.5px}
.wlc b{font-weight:600}
.sumd{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:var(--paper)}
.sumd>summary{cursor:pointer;padding:8px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;list-style:none}
.sumd>summary::-webkit-details-marker{display:none}
.sumd>summary::before{content:'▸';color:var(--muted)}
.sumd[open]>summary::before{content:'▾'}
.sumd .sb{padding:6px 12px 10px;border-top:1px solid var(--line)}
.sumd .sa{display:flex;gap:6px;justify-content:flex-end;padding-top:6px}
.sumnew{background:var(--accent);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px}
.sumok{color:var(--muted);font-size:11px;border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.mdl{line-height:1.75;font-size:13.5px}.mdl .h{font-weight:700;margin-top:12px}.mdl .ml{padding-left:14px;text-indent:-10px}
.mdl .ml::before{content:'· '}
.sech{font-weight:700;margin:14px 0 4px;font-size:13px}
.wlc .ct{white-space:pre-wrap;color:#444;margin-top:2px;line-height:1.5}
.lst .dh{font-weight:700;margin:14px 0 6px;font-size:13px;display:flex;gap:8px;align-items:center}
.lst .dh:after{content:"";flex:1;border-top:1px solid var(--line)}
.lstw{flex:1;overflow:auto;padding:4px 16px 16px;min-height:0}

/* 폼 */
.fr{display:grid;grid-template-columns:96px 1fr;gap:8px 10px;align-items:center;margin-bottom:9px}
.fr>label{font-size:12.5px;color:#4b5563;font-weight:600}
.fr .inp{width:100%}
.fr.top{align-items:start}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2>*{flex:1;min-width:110px}
.att{display:flex;flex-wrap:wrap;gap:8px}
.att .t{position:relative;width:84px;height:84px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#f3f4f6}
.att .t img{width:100%;height:100%;object-fit:cover;object-position:top}
.att .t b{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:20px;height:20px;line-height:19px;text-align:center;cursor:pointer;font-size:13px}
.att .add{width:84px;height:84px;border:2px dashed #c4cad2;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:11.5px;cursor:pointer;line-height:1.35}
.att .add.drag{border-color:var(--sel);background:#eef4ff}
.ai-it{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fff}
.ai-it.off{opacity:.45}
.ai-it .g{display:grid;grid-template-columns:150px 120px 120px 130px 1fr;gap:6px;margin:6px 0}
.ai-it .inp{width:100%}
.chk{background:#fff7db;border:1px solid #f1d98a;color:#6b4e00;border-radius:6px;padding:4px 8px;font-size:12px;margin-top:4px;white-space:pre-wrap}
.dup{background:var(--badbg);color:var(--bad);border-radius:6px;padding:2px 8px;font-size:12px;display:inline-block;margin-left:6px}
.steps{background:var(--head);border-radius:8px;padding:8px 12px;font-size:12.5px;line-height:1.6;margin-bottom:10px}
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;overflow:auto;text-align:center;padding:30px 10px;cursor:zoom-out}
#lb img{max-width:min(960px,100%);background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2227;color:#fff;border-radius:8px;padding:10px 16px;z-index:400;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw}
.warn{background:#fff4d6;border:1px solid #f1d98a;color:#6b4e00;border-radius:8px;padding:8px 12px;font-size:12.5px}

@media (max-width:900px){
  .pjb{grid-template-columns:1fr;overflow:auto}
  .calw{border-right:0;min-height:520px}
  .lf{width:190px}.rw.gh .lf{width:190px}
  .rt{width:96px}.rt .lastd{display:none}
  .ai-it .g{grid-template-columns:1fr 1fr}
  .fr{grid-template-columns:1fr}
}
@media print{
  body>*:not(#layer){display:none!important}
  #layer2{display:none!important}
  .ov{position:static;background:none;padding:0}
  .md{height:auto;box-shadow:none;width:100%}
  .mb,.lstw,.side,.cal{overflow:visible!important}
  .fb,.minimap,.mf,.x,.calh .btn{display:none!important}
}
</style>
</head>

<script>
(()=>{
/* ===== 접근 권한 =====
   이 페이지는 직원도 쓰는 공용 페이지입니다(프로젝트현황·출납부 등은 관리자 전용).
   아래 역할 이름 중 하나인 로그인 사용자가 들어올 수 있습니다. 회사에서 쓰는 직원 역할 이름이 다르면 여기만 고치면 됩니다. */
const ALLOWED_ROLES=['worker','admin'];   // 거래처 연락처 페이지와 같은 기준(근로자·관리자)
try{if(typeof requireRole==='function')requireRole(ALLOWED_ROLES)}catch(e){console.warn('requireRole 실패',e)}

/* ===== 상수·유틸 ===== */
const TYPES={'전달사항':'#1f6feb','변경지시':'#c8102e','결정사항':'#0e9f6e','이슈·문제':'#d97706','회의':'#7c3aed','현장·점검':'#0891b2','기타':'#6b7280'};
const CHANNELS=['유선','문자·카톡','메일','회의','공문','현장'];
const CH_ICON={'유선':'📞','문자·카톡':'💬','메일':'✉️','회의':'👥','공문':'📄','현장':'🚧'};
const STATUS=['','접수','진행','완료','보류'];
const PRI=['보통','중요','긴급'];
const STORE='projectLogs',BOARDC='projectLogBoards',AMTC='projectLogAmounts',READC='projectLogReads',ROOT='project-log';
const KEYK='nucks-plog-apikey',MODELK='nucks-plog-model',DEF_MODEL='claude-sonnet-5-5';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const DAY=86400000;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const fd=t=>{const d=new Date(t);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
const addD=(s,n)=>fd(pd(s)+n*DAY);
const diff=(a,b)=>Math.round((pd(b)-pd(a))/DAY);
const dow=s=>new Date(pd(s)).getUTCDay();
const WK='일월화수목금토';
const todayStr=(()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())})();
const md=s=>s?(+s.slice(5,7))+'.'+(+s.slice(8,10)):'';
const ymd=s=>s?s.slice(0,4)+'.'+(+s.slice(5,7))+'.'+(+s.slice(8,10)):'';
const ym=s=>s.slice(0,7);
const addM=(m,n)=>{const[y,mm]=m.split('-').map(Number);const t=y*12+mm-1+n;return Math.floor(t/12)+'-'+pad(t%12+1)};
const ok=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||''));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let toastT;function toast(m,ms){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms||3200)}
function fsReady(){try{return typeof firebase!=='undefined'&&typeof db!=='undefined'&&!!db}catch(e){return false}}
const HOL={'01-01':'신정','03-01':'삼일절','05-01':'근로자의날','05-05':'어린이날','06-06':'현충일','08-15':'광복절','10-03':'개천절','10-09':'한글날','12-25':'성탄절'};

/* ===== 상태 ===== */
let BOARDS=[],BOARD=null;           // projectLogBoards 문서들(자금 뺀 일정 사본)
let SUMS={};                        // AI 경과 요약 보관함 (projectLogs 중 kind:'summary')
let RECS={};                        // 기록 (projectLogs) id → 문서
let ROWS=[];                        // 화면용 평탄화: {g,r}
let ROWIDX={};                      // rowId → {g,r}
let ME={uid:'',name:'',email:'',admin:false};
let WL=null,WLP=null;               // 근무일지 캐시
let AM={},READS={};                 // 금액 영향(관리자 전용), 읽음 확인
const V={q:'',st:'',range:'recent',zoom:6,onlyRec:false};
let PJ=null;                        // 프로젝트 팝업 상태

/* ===== 사용자 ===== */
async function initMe(){
  try{
    const u=firebase.auth().currentUser;if(!u)return;
    ME.uid=u.uid;ME.email=u.email||'';ME.name=u.displayName||(u.email||'').split('@')[0]||'';
    try{const d=await db.collection('users').doc(u.uid).get();if(d.exists){const x=d.data();ME.name=x.displayName||x.name||ME.name;ME.admin=x.role==='admin'}}catch(e){}
    if(!ME.admin&&typeof window!=='undefined'&&(window.currentUserRole==='admin'||window.userRole==='admin'))ME.admin=true;
  }catch(e){}
}
const canEdit=r=>ME.admin||(r.createdBy&&r.createdBy.uid&&r.createdBy.uid===ME.uid);

/* ===== 데이터 로딩 ===== */
function indexRows(){
  ROWS=[];ROWIDX={};
  if(!BOARD)return;
  (BOARD.groups||[]).forEach(g=>(g.rows||[]).forEach(r=>{const o={g,r};ROWIDX[r.id]=o;if(!g.hidden&&!r.hidden)ROWS.push(o)}));
}
function setBoard(id){
  BOARD=BOARDS.find(b=>b.id===id)||BOARDS[0]||null;indexRows();
}
function startData(){
  if(!fsReady()){$('#board').innerHTML='<div class="empty" style="padding:30px">서버에 연결할 수 없습니다. 로그인 상태를 확인해 주세요.</div>';return}
  db.collection(BOARDC).onSnapshot(snap=>{
    BOARDS=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(!BOARDS.length&&ME.admin&&!window.__autoSynced){window.__autoSynced=1;setTimeout(()=>syncFromSchedule(true),300)}
    BOARDS.sort((a,b)=>(a.id==='nucks-all-projects'?-1:0)-(b.id==='nucks-all-projects'?-1:0));
    setBoard(BOARD&&BOARD.id);renderAll();
  },err=>{
    $('#board').innerHTML=`<div class="empty" style="padding:30px">프로젝트 목록을 읽지 못했습니다 (${esc(err&&err.message||err)})<br>Firestore 규칙에 projectLogBoards 읽기 허용이 필요합니다.</div>`;
  });
  db.collection(STORE).onSnapshot(snap=>{
    RECS={};SUMS={};snap.docs.forEach(d=>{const x=d.data();if(!x||x.deleted)return;const o=Object.assign({id:d.id},x);if(isSum(x))SUMS[d.id]=o;else RECS[d.id]=o});
    renderAll();if(PJ)renderPJ(true);if($('#sumList'))renderSumList();
  },err=>{toast('기록을 읽지 못했습니다: '+(err&&err.message||err),6000)});
  db.collection(READC).onSnapshot(snap=>{READS={};snap.docs.forEach(d=>{READS[d.id]=d.data()});renderCards();updTitle();if(PJ)renderPJ(true)},()=>{});
  if(ME.admin)db.collection(AMTC).onSnapshot(snap=>{AM={};snap.docs.forEach(d=>{AM[d.id]=d.data()});if(PJ)renderPJ(true)},()=>{});
}
const readersOf=x=>Object.values(READS).filter(r=>r.recId===x.id);
const readBy=(x,u)=>!!READS[x.id+'__'+u];
const needMyRead=x=>x.share&&ME.uid&&!(x.createdBy&&x.createdBy.uid===ME.uid)&&!readBy(x,ME.uid);
function updTitle(){const n=Object.values(RECS).filter(needMyRead).length;document.title=(n?`(${n}) `:'')+'프로젝트 기록부 | NUCKS'}
async function markRead(id){
  const x=RECS[id];if(!x||!ME.uid)return;
  try{await db.collection(READC).doc(id+'__'+ME.uid).set({recId:id,uid:ME.uid,name:ME.name,at:Date.now()});toast('확인했습니다')}catch(e){toast('확인 처리 실패: '+(e&&e.message||e),5000)}
}

/* ===== 근무일지 (읽기 전용, 자금 항목은 읽지 않음) ===== */
const normCode=c=>String(c||'').replace(/\(\d+\)/g,'').trim();
const corpFlag=s=>/\(주\)|㈜|주식회사/.test(String(s||''));
const normName=s=>String(s||'').toLowerCase().replace(/m\s*\/\s*h/g,'mh').replace(/\(주\)|㈜|주식회사/g,'').replace(/[^0-9a-z가-힣]/g,'');
async function loadWL(){
  if(WL)return WL;
  if(WLP)return WLP;
  WLP=(async()=>{
    const out={entries:[],partial:false,mode:'',err:''};
    try{
      let list=[]; // {date,emp,detail,projects:[{name,code,hours,tasks[]}]}
      const fromDoc=d=>{const row=d.data();return{date:row['날짜']||'',emp:row['사원명']||'(이름없음)',detail:row['상세내용']||'',projects:(row.projects||[]).map(p=>({name:String(p['프로젝트']||'').trim(),code:String(p['프로젝트코드']||'').trim(),hours:Number(p['투입시간'])||0,tasks:Object.keys(p.tasks||{}).filter(k=>p.tasks[k])}))}};
      if(ME.admin){
        const snap=await db.collection('workLogs').get();
        list=snap.docs.map(fromDoc);out.mode='all';
      }else{
        // 근로자: 서버 함수가 "공유가 허용된 근로자의 근무일지 + 내 근무일지"만 골라 준다(보안 규칙은 본인·관리자 전용 그대로).
        try{
          const r=await firebase.functions().httpsCallable('projectLogWorklogs',{timeout:60000})({});
          list=((r.data&&r.data.rows)||[]).map(x=>({date:x.date||'',emp:x.emp||'(이름없음)',detail:x.detail||'',projects:(x.projects||[]).map(p=>({name:String(p.name||'').trim(),code:String(p.code||'').trim(),hours:Number(p.hours)||0,tasks:p.tasks||[]}))}));
          out.mode='shared';
        }catch(e){ // 함수가 아직 배포되지 않았거나 실패하면 내 근무일지만
          if(!ME.uid)throw e;
          const snap=await db.collection('workLogs').where('uid','==',ME.uid).get();
          list=snap.docs.map(fromDoc);out.partial=true;out.mode='own';out.fnErr=(e&&e.code)||'';
        }
      }
      let codes={};try{const o=await db.collection('officialProjects').doc('list').get();if(o.exists)codes=(o.data()||{}).codes||{}}catch(e){}
      list.forEach(row=>{
        (row.projects||[]).forEach(p=>{
          const name=p.name,raw=p.code,code=String(codes[name]||'').trim()||raw;
          if(!name&&!code)return;
          out.entries.push({date:row.date,emp:row.emp,name,code,ncode:normCode(code),nname:normName(name),hours:p.hours,
            tags:p.tasks,detail:row.detail});
        });
      });
    }catch(e){out.err=String(e&&e.message||e)}
    WL=out;return out;
  })();
  return WLP;
}
const nk=n=>normName(n)+'|'+(corpFlag(n)?1:0);
function wlOf(r){
  if(!WL)return[];
  if(r._wl)return r._wl;
  const code=String(r.projCode||'').trim(),nc=normCode(code),nn=normName(r.name),cf=corpFlag(r.name);
  const lk=new Set((r.wlNames||[]).filter(n=>normName(n)).map(nk)),ex=new Set((r.wlExclude||[]).filter(n=>normName(n)).map(nk));
  const hits=WL.entries.filter(e=>{
    if(!ok(e.date))return false;
    if(e.nname&&ex.has(nk(e.name)))return false;
    if(code&&e.code===code)return true;
    if(nn&&e.nname&&e.nname===nn&&corpFlag(e.name)===cf)return true;
    if(e.nname&&lk.has(nk(e.name)))return true;
    if(nc&&e.ncode&&e.ncode===nc)return true;
    return false;
  });
  hits.sort((a,b)=>a.date.localeCompare(b.date));
  Object.defineProperty(r,'_wl',{value:hits,enumerable:false,configurable:true});
  return hits;
}

/* ===== 프로젝트 보조 계산 ===== */
const barsOf=r=>(r.bars||[]).filter(b=>ok(b.start));
function periodOf(r){
  const bs=barsOf(r);if(!bs.length)return null;
  const s=bs.map(b=>b.start).sort()[0];
  const open=bs.some(b=>b.startOnly);
  const e=bs.filter(b=>!b.startOnly).map(b=>b.end).sort().pop()||'';
  return{start:s,end:e||'',open:open&&!e,openEnd:open};
}
function statusOf(r){
  const b=(r.bars||[])[0];const t=b&&b.inner||'';
  if(t==='실주')return'lost';if(t==='완료')return'done';return'live';
}
const isSum=x=>x&&(x.kind==='summary'||(x.source==='ai'&&/^AI 경과 요약 /.test(x.title||'')));
const sumsOf=rowId=>Object.values(SUMS).filter(x=>x.rowId===rowId).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
const recsOf=rowId=>Object.values(RECS).filter(x=>x.rowId===rowId).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
const isActiveRec=x=>x.status==='접수'||x.status==='진행';
const isOpenRec=x=>isActiveRec(x)||x.status==='보류';   // 처리 중 + 보류(보류도 미완 상태로 계속 점검)
const STAT_ICON={'접수':'📝','진행':'⏰','완료':'👌','보류':'⚠️'};
const ov=x=>isActiveRec(x)&&ok(x.dueDate)&&x.dueDate<todayStr;   // 기한 지남 표시는 접수·진행만

/* ===== 메인 화면 ===== */
function rangeOptions(){
  const ys=new Set([todayStr.slice(0,4)]);
  ROWS.forEach(({r})=>barsOf(r).forEach(b=>{ys.add(b.start.slice(0,4));if(ok(b.end))ys.add(b.end.slice(0,4))}));
  Object.values(RECS).forEach(x=>ok(x.date)&&ys.add(x.date.slice(0,4)));
  const a=[...ys].filter(y=>+y>=2015&&+y<=2100).sort().reverse();
  const cur=$('#fRange').value||V.range;
  $('#fRange').innerHTML='<option value="recent">최근 1년(앞 3개월 포함)</option><option value="all">전체 기간</option>'+a.map(y=>`<option value="y${y}">${y}년</option>`).join('');
  $('#fRange').value=[...$('#fRange').options].some(o=>o.value===cur)?cur:'recent';V.range=$('#fRange').value;
}
function calcRange(){
  if(V.range==='recent')return{cs:addD(todayStr,-300),ce:addD(todayStr,90)};
  if(V.range[0]==='y'){const y=V.range.slice(1);return{cs:y+'-01-01',ce:y+'-12-31'}}
  let lo='9999-12-31',hi='0000-01-01';
  ROWS.forEach(({r})=>barsOf(r).forEach(b=>{if(b.start<lo)lo=b.start;const e=b.startOnly?b.start:b.end;if(ok(e)&&e>hi)hi=e}));
  Object.values(RECS).forEach(x=>{if(ok(x.date)){if(x.date<lo)lo=x.date;if(x.date>hi)hi=x.date}});
  if(lo>hi){lo=addD(todayStr,-200);hi=addD(todayStr,60)}
  if(todayStr>hi)hi=todayStr;
  return{cs:lo,ce:addD(hi,20)};
}
function rowVisible({g,r}){
  const q=V.q.trim().toLowerCase();
  if(q&&!((g.name+' '+r.name+' '+(r.code||'')+' '+(r.projCode||'')).toLowerCase().includes(q)))return false;
  const st=statusOf(r);
  if(V.st==='live'&&st!=='live')return false;
  if(V.st==='done'&&st!=='done')return false;
  if(V.st==='lost'&&st!=='lost')return false;
  if(V.onlyRec&&!recsOf(r.id).length)return false;
  return true;
}
function renderCards(){
  const recs=Object.values(RECS).filter(x=>ROWIDX[x.rowId]);
  const open=recs.filter(isOpenRec).sort((a,b)=>(isActiveRec(b)-isActiveRec(a))||(a.dueDate||'9999').localeCompare(b.dueDate||'9999')||a.date.localeCompare(b.date));
  const recent=recs.slice().sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||''))||(b.createdAt||0)-(a.createdAt||0)).slice(0,6);
  const pn=x=>(ROWIDX[x.rowId]?ROWIDX[x.rowId].r.name:'');
  const item=(x,showDue)=>`<div class="li ${ov(x)?'over':''}" data-open-rec="${x.id}"><span class="d">${showDue&&ok(x.dueDate)?'~'+md(x.dueDate):md(x.date)}</span><span class="p">${esc(pn(x))}</span><span class="t">${esc(x.title)}</span>${x.status?`<span class="tg">${esc(x.status)}</span>`:''}</div>`;
  const unread=recs.filter(needMyRead).sort((a,b)=>b.date.localeCompare(a.date));
  $('#cards').innerHTML=
   (unread.length?`<div class="card" style="border-color:#e9a39c;background:#fffafa"><h3>📣 확인이 필요한 전달사항 <small>${unread.length}건 · 눌러서 열고 “확인했어요”</small></h3>${unread.slice(0,7).map(x=>item(x,false)).join('')}</div>`:'')+
   `<div class="card"><h3>⏰ 처리 중·보류 중인 변경지시·후속조치 <small>${open.length}건 · 처리중 먼저, 기한 순</small></h3>${open.length?open.slice(0,7).map(x=>item(x,true)).join('')+(open.length>7?`<div class="hint" style="padding-top:4px">외 ${open.length-7}건 (아래 프로젝트에서 확인)</div>`:''):'<div class="empty">처리 중인 건이 없습니다. 기록에 "접수/진행/보류" 상태를 주면 여기에 모입니다.</div>'}</div>`+
   `<div class="card"><h3>🆕 최근 기록 <small>${recs.length}건 누적</small></h3>${recent.length?recent.map(x=>item(x,false)).join(''):'<div class="empty">아직 기록이 없습니다. 위의 “＋ 새 기록” 또는 “📷 캡처로 자동 기록”으로 시작하세요.</div>'}</div>`;
}
function renderBoard(){
  const host=$('#board');
  if(!BOARD){host.innerHTML='<div class="empty" style="padding:30px">표시할 프로젝트가 아직 없습니다.<br>'+(ME.admin?'위의 “프로젝트현황에서 가져오기”를 누르면 프로젝트가 나타납니다.':'관리자가 프로젝트현황에서 가져오면 이곳에 프로젝트가 나타납니다.')+'</div>';return}
  const rows=ROWS.filter(rowVisible);
  const{cs,ce}=calcRange(),dw=V.zoom,nd=diff(cs,ce)+1,W=nd*dw;
  const X=d=>diff(cs,d)*dw;
  // 눈금(월)
  let mo='',vl='';
  // 월 눈금: 각 칸의 폭(다음 달 시작까지)에 맞춰 글자를 줄이거나 자른다 - 앞 달 글자가 다음 달(연도) 글자와 겹치지 않게
  const ms=[];
  for(let m=ym(cs);;m=addM(m,1)){const s=m+'-01';if(s>ce)break;ms.push({m,s,x:s<cs?0:X(s)})}
  ms.forEach((o,i)=>{
    const{m,s,x}=o,nx=i+1<ms.length?ms[i+1].x:W,w=Math.max(0,nx-x);
    const yr=m.endsWith('-01'),withYear=yr||i===0,mon=+m.slice(5),y4=m.slice(0,4),y2="'"+y4.slice(2);
    let label;
    if(w<22)label='';
    else if(!withYear)label=w>=34?`${mon}월`:`${mon}`;
    else if(w>=64)label=`<b>${y4}</b> ${mon}월`;
    else if(w>=52)label=`<b>${y2}</b> ${mon}월`;
    else if(w>=34)label=`<b>${y2}</b> ${mon}`;
    else label=`<b>${y2}</b>`;
    mo+=`<div class="mo ${yr?'yr':''}" style="left:${x}px;width:${w}px" title="${y4}년 ${mon}월">${label}</div>`;
    if(s>=cs)vl+=`<div class="vl ${yr?'y':''}" style="left:${x}px"></div>`;
  });
  const todayX=todayStr>=cs&&todayStr<=ce?`<div class="today" style="left:${X(todayStr)+dw/2}px"></div>`:'';
  let h=`<div class="rw hd"><div class="lf">거래처 · 프로젝트</div><div class="tl" style="width:${W}px">${mo}${todayX}</div><div class="rt">기록</div></div>`;
  let lastG=null,n=0;
  for(const o of rows){
    const{g,r}=o;
    if(g!==lastG){lastG=g;h+=`<div class="rw gh"><div class="lf"><span class="grp-label">${esc(g.name)}</span></div><div class="tl" style="width:${W}px">${vl}</div><div class="rt" style="background:#faf6f2"></div></div>`}
    const rec=recsOf(r.id),op=rec.filter(isOpenRec).length,st=statusOf(r),last=rec.length?rec[rec.length-1].date:'';
    const b0=(r.bars||[])[0],stTxt=b0&&b0.inner||'';
    let bars='';
    for(const b of barsOf(r)){

let SYNCING=false;
async function syncFromSchedule(auto){
  if(!ME.admin||SYNCING)return;
  SYNCING=true;const bt=$('#bSync');if(bt){bt.disabled=true;bt.textContent='가져오는 중…'}
  try{
    const snap=await db.collection('scheduleProjects').get();
    if(snap.empty){toast(auto?'프로젝트현황에 저장된 프로젝트가 없습니다. 프로젝트현황 페이지를 열어 한 번 서버에 저장해 주세요.':'서버에 저장된 프로젝트현황이 없습니다. 프로젝트현황 페이지(최신 파일)를 열어 서버로 올린 뒤 다시 눌러 주세요.',7000);return}
    let n=0,rows=0;
    for(const d of snap.docs){
      const data=d.data()||{};if(!data.groups)continue;
      const c=boardCopy(data,d.id);c._pushedAt=Date.now();c._syncedBy='기록부';
      await db.collection(BOARDC).doc(d.id).set(c);n++;
      (c.groups||[]).forEach(g=>rows+=(g.rows||[]).length);
    }
    toast(n?`프로젝트현황에서 일정표 ${n}개(프로젝트 ${rows}줄)를 가져왔습니다`:'가져올 프로젝트가 없습니다',5000);
  }catch(e){toast('가져오기 실패: '+(e&&e.message||e),7000)}
  finally{SYNCING=false;const b2=$('#bSync');if(b2){b2.disabled=false;b2.textContent='🔄 프로젝트현황에서 가져오기'}}
}

function closePJ(){PJ=null;$('#pjOv')&&$('#pjOv').remove()}
function dayData(r,all){
  // 날짜 → {recs,wl,due}
  const D={},get=d=>D[d]||(D[d]={recs:[],wl:[],due:[]});
  const f=PJ;const q=f.q.trim().toLowerCase();
  if(f.rec)recsOf(r.id).forEach(x=>{
    if(f.types.size&&!f.types.has(x.type))return;
    if(f.open&&!isOpenRec(x))return;
    if(q&&!(x.title+' '+x.content+' '+x.counterpart).toLowerCase().includes(q))return;
    if(ok(x.date))get(x.date).recs.push(x);
    if(ok(x.dueDate)&&isOpenRec(x)&&x.dueDate!==x.date)get(x.dueDate).due.push(x);
  });
  if(f.wl&&!f.types.size&&!f.open)wlOf(r).forEach(e=>{
    if(q&&!(e.emp+' '+e.detail+' '+e.tags.join(' ')).toLowerCase().includes(q))return;
    get(e.date).wl.push(e);
  });
  return D;
}

/* ===== 이미지(캡처) 처리 ===== */
function compressImage(file,max=1600,q=.86){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('읽기 실패'));
    fr.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error('이미지가 아닙니다'));
      img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
        const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};
      img.src=fr.result};
    fr.readAsDataURL(file);
  });
}
async function uploadImages(rowId,list){
  const out=[];
  for(const f of list){
    if(f.url){out.push({name:f.name,url:f.url,path:f.path||''});continue}
    const path=`${ROOT}/${rowId}/${Date.now()}_${Math.random().toString(36).slice(2,6)}_${String(f.name||'capture.jpg').replace(/[^\w.\-가-힣]/g,'_')}`;
    const ref=firebase.storage().ref(path);
    await ref.putString(f.data,'data_url');
    out.push({name:f.name,url:await ref.getDownloadURL(),path});
  }
  return out;
}
function attHTML(list,id){
  return `<div class="att" id="${id}">${list.map((f,i)=>`<div class="t"><img src="${esc(f.url||f.data)}" alt=""><b data-rm="${i}" title="빼기">×</b></div>`).join('')}<label class="add" data-drop>＋<br>캡처 추가<br>(끌어놓기·Ctrl+V)<input type="file" accept="image/*" multiple hidden></label></div>`;
}
function wireAtt(id,list,redraw){
  const box=document.getElementById(id);if(!box)return;
  const add=async fl=>{for(const f of [...fl].filter(f=>f.type&&f.type.startsWith('image/'))){try{list.push({name:f.name||('캡처_'+todayStr+'.jpg'),data:await compressImage(f)})}catch(e){toast('이미지를 읽지 못했습니다')}}redraw()};
  box.querySelector('input').onchange=e=>{add(e.target.files);e.target.value=''};
  const d=box.querySelector('[data-drop]');
  d.ondragover=e=>{e.preventDefault();d.classList.add('drag')};d.ondragleave=()=>d.classList.remove('drag');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('drag');add(e.dataTransfer.files)};
  box.onclick=e=>{const b=e.target.closest('[data-rm]');if(b){list.splice(+b.dataset.rm,1);redraw()}};
  wireAtt.paste=add;
}
document.addEventListener('paste',ev=>{

});

/* ===== 카톡 대화 정리 (텍스트 붙여넣기 · 캡처 · Claude 채팅) =====

   · 캡처 이미지 자동 정리는 API 키가 필요(이미지는 상대적으로 비쌈) */
let AI=null;
function aiPrompt(base,rowName,note,src){
  const intro=src==='text'?'아래는 건설·인테리어 프로젝트 관련 협력업체/현장 카카오톡 대화 텍스트입니다.':'첨부한 이미지는 건설·인테리어 프로젝트 관련 협력업체/현장 카카오톡·문자 대화 캡처입니다.';
  return `${intro} 업무 기록용으로 정리해 주세요.
프로젝트: ${rowName||'(미지정)'}
${note?'참고: '+note+'\n':''}규칙:
- 대화에서 확인되는 사실만 적고, 없는 내용을 지어내지 마세요. 금액·수량·치수·날짜·일정 같은 수치는 원문 그대로 보존합니다.
- 날짜별·주제별로 나눠 기록 1건씩 만드세요. 같은 날 같은 주제는 한 건으로 합칩니다. 인사·잡담은 빼세요.
- 날짜가 안 보이면 ${base}로 하고 check에 "날짜 미표시"라고 적으세요. 시간이 보이면 HH:MM(24시간), 없으면 빈 문자열.
- type은 다음 중 하나: 전달사항, 변경지시, 결정사항, 이슈·문제, 회의, 현장·점검, 기타 (공사 범위·자재·일정·금액이 바뀌는 지시는 변경지시)
- channel은 "문자·카톡" 고정. counterpart는 대화방 이름 또는 상대 업체/담당자(보이는 대로).
- title은 한 줄(30자 이내), content는 줄바꿈(\\n)으로 구분한 핵심 요약(결정·지시·요청 사항 위주, 누가 말했는지 필요하면 표시).
- priority는 보통/중요/긴급, status는 후속 조치가 필요하면 "접수", 아니면 "". 후속 기한이 언급되면 dueDate(YYYY-MM-DD), 없으면 "".
- 공기(일정)가 늘거나 줄어드는 내용이 있으면 scheduleDays에 증감 일수(숫자, 없으면 0).
- 애매하거나 잘 안 읽히는 부분은 check에 적으세요(없으면 빈 문자열).
반드시 아래 JSON만 출력하세요(설명·코드블록 표시 금지):
{"items":[{"date":"YYYY-MM-DD","time":"","counterpart":"","type":"전달사항","channel":"문자·카톡","title":"","content":"","priority":"보통","status":"","dueDate":"","scheduleDays":0,"check":""}]}`;
}
function parseAIJson(txt){
  const s=String(txt||''),a=s.indexOf('{'),b=s.lastIndexOf('}');
  if(a<0||b<=a)throw new Error('JSON을 찾지 못했습니다');
  const j=JSON.parse(s.slice(a,b+1));
  const arr=Array.isArray(j.items)?j.items:(Array.isArray(j)?j:[]);
  if(!arr.length)throw new Error('정리된 기록이 없습니다');
  return arr.map(x=>({date:ok(x.date)?x.date:todayStr,time:/^\d{1,2}:\d{2}$/.test(x.time||'')?(x.time.length===4?'0'+x.time:x.time):'',counterpart:String(x.counterpart||''),
    type:TYPES[x.type]?x.type:'전달사항',channel:CHANNELS.includes(x.channel)?x.channel:'문자·카톡',title:String(x.title||'').slice(0,80),content:Array.isArray(x.content)?x.content.join('\n'):String(x.content||''),
    priority:PRI.includes(x.priority)?x.priority:'보통',status:STATUS.includes(x.status)?x.status:'',dueDate:ok(x.dueDate)?x.dueDate:'',scheduleDays:Math.round(Number(x.scheduleDays))||0,check:String(x.check||''),use:true}));
}
/* 카카오톡 텍스트 → [{date,time,speaker,text}]  (PC 복사·PC 내보내기·모바일 내보내기 형식을 모두 읽음. 날짜가 없으면 base 날짜) */
function parseKakao(raw,base){
  const lines=String(raw||'').replace(/\r/g,'').split('\n');
  const msgs=[];let curDate=base,last=null;
  const t24=(ap,h,m)=>{h=+h;if(ap==='오후'&&h<12)h+=12;if(ap==='오전'&&h===12)h=0;return pad(h)+':'+pad(+m)};
  const D=(y,m,d)=>y+'-'+pad(+m)+'-'+pad(+d);
  let m;
  for(let ln of lines){
    const line=ln.trim();if(!line){if(last)last.text+='\n';continue}
    if((m=line.match(/^-{3,}\s*(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일.*?-{3,}$/))||(m=line.match(/^(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일\s*[월화수목금토일]요일$/))){curDate=D(m[1],m[2],m[3]);last=null;continue}
    // PC: [이름] [오후 2:30] 내용
    if((m=line.match(/^\[([^\]]+)\]\s*\[(오전|오후)\s*(\d{1,2}):(\d{2})\]\s?(.*)$/))){last={date:curDate,time:t24(m[2],m[3],m[4]),speaker:m[1],text:m[5]};msgs.push(last);continue}
    // 모바일: 2026년 11월 11일 오후 2:30, 이름 : 내용   /  2026. 11. 11. 오후 2:30, 이름 : 내용 / 2026. 11. 11. 14:30, 이름 : 내용
    if((m=line.match(/^(\d{4})[.년]\s*(\d{1,2})[.월]\s*(\d{1,2})[.일]?\s*(오전|오후)\s*(\d{1,2}):(\d{2}),\s*([^:]+?)\s*:\s?(.*)$/))){curDate=D(m[1],m[2],m[3]);last={date:curDate,time:t24(m[4],m[5],m[6]),speaker:m[7],text:m[8]};msgs.push(last);continue}
    if((m=line.match(/^(\d{4})[.년]\s*(\d{1,2})[.월]\s*(\d{1,2})[.일]?\s*(\d{1,2}):(\d{2}),\s*([^:]+?)\s*:\s?(.*)$/))){curDate=D(m[1],m[2],m[3]);last={date:curDate,time:pad(+m[4])+':'+m[5],speaker:m[6],text:m[7]};msgs.push(last);continue}
    if(/^(\d{4})[.년]\s*\d{1,2}[.월]\s*\d{1,2}[.일]?\s*[월화수목금토일]?요?일?$/.test(line)){const q=line.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);if(q){curDate=D(q[1],q[2],q[3]);last=null;continue}}
    if(/^(.+?) ?님이 (들어왔|나갔|초대)/.test(line)||/^(사진|이모티콘|동영상|파일)$/.test(line)){continue}
    if(last)last.text+=(last.text?'\n':'')+line;
    else{last={date:curDate,time:'',speaker:'',text:line};msgs.push(last)}
  }
  msgs.forEach(x=>x.text=x.text.replace(/\n+$/,''));
  return msgs.filter(x=>x.text);
}
function kakaoByDay(msgs){const o={};msgs.forEach(x=>(o[x.date]=o[x.date]||[]).push(x));return Object.keys(o).sort().map(d=>({date:d,msgs:o[d]}))}

async function claudeCall(content,maxTok){
  // 1순위: 서버 함수(projectLogAI) — 명함 읽기와 같은 서버 키를 쓰므로 직원이 키를 입력할 필요가 없다
  const images=content.filter(c=>c.type==='image').map(c=>c.source.data);
  const prompt=(content.find(c=>c.type==='text')||{}).text||'';
  let fnErr=null;
  try{
    if(typeof firebase!=='undefined'&&firebase.functions){
      const call=firebase.functions().httpsCallable('projectLogAI',{timeout:130000});
      const r=await call({prompt,images,maxTokens:maxTok||6000});
      return String((r.data&&r.data.text)||'');
    }
  }catch(e){fnErr=e}
  // 2순위: 이 PC에 저장해 둔 개인 API 키(서버 함수를 아직 못 쓸 때만)
  const key=localStorage.getItem(KEYK),model=localStorage.getItem(MODELK)||DEF_MODEL;
  if(!key){
    const code=fnErr&&fnErr.code||'';
    if(/not-found/.test(code))throw new Error('서버 함수(projectLogAI)가 아직 배포되지 않았습니다. 관리자가 함수를 배포해야 합니다.');
    throw new Error(fnErr?(fnErr.message||String(fnErr)):'AI 기능을 쓸 수 없습니다.');
  }
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model,max_tokens:maxTok||6000,messages:[{role:'user',content}]})});
  const j=await r.json();
  if(!r.ok)throw new Error((j&&j.error&&j.error.message)||('HTTP '+r.status));
  return(j.content||[]).map(c=>c.text||'').join('');
}
async function runAI(kind){
  aiKeep();

  let calls=[];
  if(kind==='img')calls=[AI.images.slice(0,10).map(im=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:im.data.split(',')[1]}})).concat([{type:'text',text:aiPrompt(AI.base,rn,AI.note,'img')}])];
  else{
    const msgs=parseKakao(AI.text,AI.base);
    if(!msgs.length){AI.err='붙여넣은 내용에서 대화를 찾지 못했습니다.';renderAI();return}
    // 긴 대화는 날짜 단위로 쪼개 여러 번에 나눠 보낸다(한 번에 약 1.4만 자)
    let cur='',days=kakaoByDay(msgs),chunks=[];
    for(const d of days){const t=kakaoToText([...d.msgs]);if(cur&&(cur.length+t.length)>14000){chunks.push(cur);cur=''}cur+=(cur?'\n\n':'')+t}
    if(cur)chunks.push(cur);
    calls=chunks.map(c=>[{type:'text',text:aiPrompt(AI.base,rn,AI.note,'text')+'\n\n[대화 텍스트]\n'+c}]);
  }
  AI.busy=true;AI.err='';renderAI();
  try{
    let all=[];
    for(let i=0;i<calls.length;i++){
      $('#aiMsg')&&($('#aiMsg').textContent=`정리 중… ${i+1}/${calls.length}`);
      all=all.concat(parseAIJson(await claudeCall(calls[i])));
    }

  }catch(e){AI.err='자동 정리 실패: '+(e&&e.message||e)+' (키·모델 이름·인터넷 연결을 확인하거나 “날짜별로 나누기”를 쓰세요)'}

function mdLite(t){
  return String(t||'').split(/\r?\n/).map(l=>{
    let x=esc(l).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__(.+?)__/g,'<b>$1</b>');
    const raw=l.trim();
    if(!raw)return '<div style="height:6px"></div>';
    if(/^#{1,4}\s/.test(raw))return `<div class="h">${esc(raw.replace(/^#{1,4}\s*/,'').replace(/\*\*/g,''))}</div>`;
    if(/^(\*\*)?\d+\.\s/.test(raw)&&raw.length<60)return `<div class="h">${x}</div>`;
    if(/^[-*•]\s/.test(raw))return `<div class="ml">${x.replace(/^\s*[-*•]\s/,'')}</div>`;
    return `<div>${x}</div>`;
  }).join('');
}

  const a=t.closest('[data-act]');
  if(a){
    const act=a.dataset.act;
    if(act==='close')closePJ();
    else if(act==='prev'){PJ.month=addM(PJ.month,-1);renderPJ(true)}
    else if(act==='next'){PJ.month=addM(PJ.month,1);renderPJ(true)}
    else if(act==='today'){PJ.month=ym(todayStr);PJ.sel=todayStr;renderPJ(true)}
    else if(act==='view'){PJ.view=PJ.view==='cal'?'list':'cal';renderPJ()}
    else if(act==='print')window.print();
    else if(act==='newRec')openForm(null,{rowId:PJ.rowId,date:PJ.sel||todayStr});
    else if(act==='newRecDay')openForm(null,{rowId:PJ.rowId,date:PJ.sel||todayStr});
    else if(act==='ai')openAI({rowId:PJ.rowId,date:PJ.sel||todayStr});
    else if(act==='sum')openSummary();
    else if(act==='sumbox')openSummary(true);
    return;
  }
  const ed=t.closest('[data-edit]');if(ed){const x=RECS[ed.dataset.edit];if(x)openForm(x);return}
  const dl=t.closest('[data-del]');if(dl){delRec(dl.dataset.del);return}
  const ty=t.closest('[data-type]');if(ty){const k=ty.dataset.type;PJ.types.has(k)?PJ.types.delete(k):PJ.types.add(k);renderPJ(true);return}
  const fl=t.closest('[data-flag]');if(fl){const k=fl.dataset.flag;PJ[k]=!PJ[k];renderPJ(true);return}
  const mm=t.closest('[data-month]');if(mm){PJ.month=mm.dataset.month;renderPJ(true);return}
  const rc=t.closest('[data-rec]');if(rc){const x=RECS[rc.dataset.rec];if(x){PJ.sel=x.date;PJ.month=ym(x.date);PJ.hl=x.id;renderPJ(true)}return}
  const dc=t.closest('.dc');if(dc){PJ.sel=dc.dataset.day;if(ym(PJ.sel)!==PJ.month)PJ.month=ym(PJ.sel);renderPJ(true);return}
});
document.addEventListener('dblclick',e=>{
  if(!PJ)return;const dc=e.target.closest('.dc');if(dc&&!e.target.closest('.ch'))openForm(null,{rowId:PJ.rowId,date:dc.dataset.day});
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.stat){const x=RECS[t.dataset.stat];if(x)db.collection(STORE).doc(x.id).update({status:t.value,updatedAt:Date.now(),updatedBy:{uid:ME.uid,name:ME.name}}).then(()=>toast('처리상태를 바꿨습니다'),err=>toast('변경 실패: '+(err&&err.message||err),5000));return}
  if(t.dataset&&t.dataset.ai!==undefined&&AI){const it=AI.items[+t.dataset.ai];if(it){const k=t.dataset.k;it[k]=k==='use'?t.checked:t.value;if(k==='use'||k==='date')renderAI()}return}
  if(t.id==='fBoard'){setBoard(t.value);renderAll();return}
  if(t.id==='aiRow'&&AI){AI.rowId=t.value;return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.ai!==undefined&&AI&&t.dataset.k!=='use'){const it=AI.items[+t.dataset.ai];if(it)it[t.dataset.k]=t.value;return}
  if(t.id==='pjQ'&&PJ){PJ.q=t.value;renderPJ(true);return}
});
$('#qProj').oninput=e=>{V.q=e.target.value;renderBoard()};
$('#fSt').onchange=e=>{V.st=e.target.value;renderBoard()};
$('#fRange').onchange=e=>{V.range=e.target.value;$('#board').scrollLeft=0;renderBoard()};
$('#fZoom').onchange=e=>{V.zoom=+e.target.value;renderBoard()};
$('#fOnlyRec').onchange=e=>{V.onlyRec=e.target.checked;renderBoard()};

/* ===== 시작 ===== */
let started=false;
function boot(){if(started)return;started=true;initMe().then(startData)}
try{
  if(typeof firebase!=='undefined'&&firebase.auth){firebase.auth().onAuthStateChanged(u=>{if(u)boot()});setTimeout(()=>{if(!started&&fsReady())boot()},4000)}
  else $('#board').innerHTML='<div class="empty" style="padding:30px">서버 연결 파일(firebase-config.js, auth.js)을 찾을 수 없습니다.</div>';
}catch(e){console.error(e)}
window.__PLOG={openProject,openForm,get PJ(){return PJ},get RECS(){return RECS}};
})();
</script>
</body>
